<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;
    padding: 20px;

    font-family: Arial, sans-serif;

    background: #111;
    color: white;

    text-align: center;

}

    margin-bottom: 5px;
}

    color: #aaa;

}


/* =========================================================
   CAMERA
========================================================= */

.camera-container {

    position: relative;

    width: 100%;

    max-width: 700px;

    margin: auto;

    background: black;

    overflow: hidden;

    border-radius: 12px;

}

video {

    display: block;

    width: 100%;

    height: auto;

}


/* =========================================================
   GREEN GUIDE
========================================================= */

.scan-guide {

    position: absolute;

    width: 88%;

    aspect-ratio: 1.586 / 1;

    left: 50%;

    top: 50%;

    transform: translate(-50%, -50%);

    border: 3px solid #00ff66;

    border-radius: 10px;

    box-shadow:
        0 0 10px #00ff66,
        inset 0 0 10px rgba(0,255,102,0.2);

    pointer-events: none;

    z-index: 5;

}

.scan-guide::after {

    content: "ALIGN ID CARD HERE";

    position: absolute;

    top: -30px;

    left: 50%;

    transform: translateX(-50%);

    font-size: 13px;

    color: #00ff66;

    white-space: nowrap;

}


/* =========================================================
   LIVE RED DETECTION BOX
========================================================= */

.red-detection-box {

    position: absolute;

    display: none;

    border: 4px solid #2196f3;

    border-radius: 8px;

    box-shadow:
        0 0 12px rgba(33,150,243,0.9),
        inset 0 0 8px rgba(33,150,243,0.2);

    pointer-events: none;

    z-index: 10;

    transition:
        left 0.12s ease,
        top 0.12s ease,
        width 0.12s ease,
        height 0.12s ease;

}

.red-detection-box span {

    position: absolute;

    left: 0;

    top: -29px;

    padding: 5px 9px;

    background: #2196f3;

    color: white;

    font-size: 12px;

    font-weight: bold;

    border-radius: 5px;

    white-space: nowrap;

}

   CONTROLS
========================================================= */

    margin: 20px auto;

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;

}

button {

    padding: 12px 18px;

    border: none;

    border-radius: 8px;

    font-size: 15px;

}

.progress-bar {

/* =========================================================

<script>


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const lrnCanvas =
    document.getElementById("lrnCanvas");

const processedImage =
    document.getElementById("processedImage");

const startButton =
    document.getElementById("startButton");

const scanButton =
    document.getElementById("scanButton");

const stopButton =
    document.getElementById("stopButton");

const databaseButton =
    document.getElementById("databaseButton");

const status =
    document.getElementById("status");

const progressBar =
    document.getElementById("progressBar");

const nameField =
    document.getElementById("nameField");

const gradeField =
    document.getElementById("gradeField");

const sectionField =
    document.getElementById("sectionField");

const lrnField =
    document.getElementById("lrnField");

const idField =
    document.getElementById("idField");

const databaseResult =
    document.getElementById("databaseResult");

const databaseStatus =
    document.getElementById("databaseStatus");

const databaseDetails =
    document.getElementById("databaseDetails");

const rawOCR =
    document.getElementById("rawOCR");


/* =========================================================
   LIVE RED DETECTION ELEMENTS
========================================================= */

const redDetectionBox =
    document.getElementById(
        "redDetectionBox"
    );


const redDetectionCanvas =
    document.createElement(
        "canvas"
    );


const redDetectionCtx =
    redDetectionCanvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );


let redDetectionTimer =
    null;


let lastRedDetection =
    null;


/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */

const DATABASE_URL =
    "https://script.google.com/macros/s/AKfycby8SQH20dz2PK6Covm_GOy4sG1WigvDaxZr8a--gbrI_LBKE1KJoQO7AMzaKZR_3mQ/exec";


/* =========================================================
   CAMERA
========================================================= */

let cameraStream =
    null;


startButton.addEventListener(
    "click",
    startCamera
);


stopButton.addEventListener(
    "click",
    stopCamera
);


scanButton.addEventListener(
    "click",
    captureAndScan
);


databaseButton.addEventListener(
    "click",
    checkDatabase
);


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

    try {

        status.textContent =
            "Starting camera...";


        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio: false,

                    video: {

                        facingMode: {
                            ideal: "environment"
                        },

                        width: {
                            ideal: 1920
                        },

                        height: {
                            ideal: 1080
                        },

                        frameRate: {
                            ideal: 30
                        }

                    }

                });


        video.srcObject =
            cameraStream;


        /*
         * Request high camera resolution.
         */

        const track =
            cameraStream
                .getVideoTracks()[0];


        try {

            await track.applyConstraints({

                width: {
                    ideal: 1920
                },

                height: {
                    ideal: 1080
                }

            });

        }

        catch (constraintError) {

            console.log(
                "Could not apply extra camera constraints:",
                constraintError
            );

        }


        startButton.disabled =
            true;

        scanButton.disabled =
            false;

        stopButton.disabled =
            false;


        status.textContent =
            "Camera ready. Align the entire ID inside the green guide.";


        /* =================================================
           START LIVE RED DETECTION
        ================================================= */

        if (redDetectionTimer) {

            clearInterval(
                redDetectionTimer
            );

        }


        redDetectionTimer =
            setInterval(

                detectRedIDLive,

                250

            );

    }

    catch (error) {

        console.error(
            "CAMERA ERROR:",
            error
        );

        status.textContent =
            "Could not access camera: " +
            error.message;

    }

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera() {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        cameraStream =
            null;

    }


    video.srcObject =
        null;


    /*
     * Stop live detection.
     */

    if (redDetectionTimer) {

        clearInterval(
            redDetectionTimer
        );

        redDetectionTimer =
            null;

    }


    redDetectionBox.style.display =
        "none";


    lastRedDetection =
        null;


    startButton.disabled =
        false;

    scanButton.disabled =
        true;

    stopButton.disabled =
        true;


    status.textContent =
        "Camera stopped.";

}


/* =========================================================
   LIVE RED ID DETECTION
========================================================= */

function detectRedIDLive() {

    if (
        !cameraStream ||
        !video.videoWidth ||
        !video.videoHeight
    ) {

        redDetectionBox.style.display =
            "none";

        return;

    }


    /*
     * Small image for fast detection.
     */

    const detectionWidth =
        320;


    const detectionHeight =
        Math.round(

            video.videoHeight *
            (
                detectionWidth /
                video.videoWidth
            )

        );


    redDetectionCanvas.width =
        detectionWidth;


    redDetectionCanvas.height =
        detectionHeight;


    redDetectionCtx.drawImage(

        video,

        0,
        0,

        video.videoWidth,
        video.videoHeight,

        0,
        0,

        detectionWidth,
        detectionHeight

    );


    const imageData =
        redDetectionCtx.getImageData(

            0,
            0,

            detectionWidth,
            detectionHeight

        );


    const data =
        imageData.data;


    /*
     * Restrict detection to the
     * green guide.
     */

    const guideLeft =
        Math.round(
            detectionWidth * 0.06
        );


    const guideRight =
        Math.round(
            detectionWidth * 0.94
        );


    const guideWidth =
        guideRight -
        guideLeft;


    const guideHeight =
        guideWidth / 1.586;


    const guideTop =
        Math.round(
            (
                detectionHeight -
                guideHeight
            ) / 2
        );


    const guideBottom =
        Math.round(
            guideTop +
            guideHeight
        );


    /*
     * Find all red pixels.
     */

    let minX =
        detectionWidth;

    let minY =
        detectionHeight;

    let maxX =
        -1;

    let maxY =
        -1;


    let redPixelCount =
        0;


    for (
        let y = guideTop;
        y < guideBottom;
        y++
    ) {

        for (
            let x = guideLeft;
            x < guideRight;
            x++
        ) {

            const index =
                (
                    y *
                    detectionWidth +
                    x
                ) * 4;


            const r =
                data[index];

            const g =
                data[index + 1];

            const b =
                data[index + 2];


            /*
             * Red detection.
             */

            const isRed =
                r > 80 &&
                r > g * 1.25 &&
                r > b * 1.25 &&
                (r - g) > 25 &&
                (r - b) > 25;


            if (isRed) {

                redPixelCount++;


                if (x < minX)
                    minX = x;


                if (y < minY)
                    minY = y;


                if (x > maxX)
                    maxX = x;


                if (y > maxY)
                    maxY = y;

            }

        }

    }


    /*
     * No red detected.
     */

    if (
        maxX === -1 ||
        maxY === -1
    ) {

        redDetectionBox.style.display =
            "none";

        lastRedDetection =
            null;

        return;

    }


    const detectedWidth =
        maxX - minX;


    const detectedHeight =
        maxY - minY;


    const detectedArea =
        detectedWidth *
        detectedHeight;


    const guideArea =
        guideWidth *
        guideHeight;


    /*
     * Reject small red objects/noise.
     */

    if (
        detectedArea <
        guideArea * 0.08
    ) {

        redDetectionBox.style.display =
            "none";

        lastRedDetection =
            null;

        return;

    }


    /*
     * Add padding.
     */

    const paddingX =
        detectedWidth * 0.08;


    const paddingY =
        detectedHeight * 0.08;


    minX -=
        paddingX;


    minY -=
        paddingY;


    maxX +=
        paddingX;


    maxY +=
        paddingY;


    /*
     * Keep the detection inside
     * the guide.
     */

    minX =
        Math.max(
            guideLeft,
            minX
        );


    minY =
        Math.max(
            guideTop,
            minY
        );


    maxX =
        Math.min(
            guideRight,
            maxX
        );


    maxY =
        Math.min(
            guideBottom,
            maxY
        );


    /*
     * Convert to percentages.
     */

    const leftPercent =
        (
            minX /
            detectionWidth
        ) * 100;


    const topPercent =
        (
            minY /
            detectionHeight
        ) * 100;


    const widthPercent =
        (
            (
                maxX -
                minX
            ) /
            detectionWidth
        ) * 100;


    const heightPercent =
        (
            (
                maxY -
                minY
            ) /
            detectionHeight
        ) * 100;


    /*
     * Show blue box.
     */

    redDetectionBox.style.display =
        "block";


    redDetectionBox.style.left =
        leftPercent + "%";


    redDetectionBox.style.top =
        topPercent + "%";


    redDetectionBox.style.width =
        widthPercent + "%";


    redDetectionBox.style.height =
        heightPercent + "%";


    /*
     * Save detection.
     */

    lastRedDetection = {

        x: minX,

        y: minY,

        width:
            maxX - minX,

        height:
            maxY - minY,

        detectionWidth:
            detectionWidth,

        detectionHeight:
            detectionHeight

    };

}


/* =========================================================
   CAPTURE + SCAN
========================================================= */

async function captureAndScan() {

    if (!cameraStream) {

        alert(
            "Please start the camera first."
        );

        return;

    }


    scanButton.disabled =
        true;


    databaseButton.disabled =
        true;


    databaseResult.style.display =
        "none";


    progressBar.style.width =
        "0%";


    status.textContent =
        "Capturing ID...";


    try {

        await performOCR();

    }

    catch (error) {

        console.error(
            "SCAN ERROR:",
            error
        );

        status.textContent =
            "Scanning failed: " +
            error.message;

    }


    scanButton.disabled =
        false;

}


/* =========================================================
   FALLBACK CARD CROP
========================================================= */

function getFallbackCardCrop(
    videoWidth,
    videoHeight
) {

    const cropWidth =
        videoWidth * 0.88;


    const cropHeight =
        cropWidth / 1.586;


    let finalCropWidth =
        cropWidth;


    let finalCropHeight =
        cropHeight;


    if (
        finalCropHeight >
        videoHeight * 0.92
    ) {

        finalCropHeight =
            videoHeight * 0.92;


        finalCropWidth =
            finalCropHeight *
            1.586;

    }


    return {

        x:
            (
                videoWidth -
                finalCropWidth
            ) / 2,

        y:
            (
                videoHeight -
                finalCropHeight
            ) / 2,

        width:
            finalCropWidth,

        height:
            finalCropHeight

    };

}


/* =========================================================
   AUTOMATIC RED ID CROP
========================================================= */

function detectRedIDArea(
    sourceCanvas
) {

    const sourceWidth =
        sourceCanvas.width;


    const sourceHeight =
        sourceCanvas.height;


    const detectionWidth =
        320;


    const detectionHeight =
        Math.round(

            sourceHeight *
            (
                detectionWidth /
                sourceWidth
            )

        );


    const smallCanvas =
        document.createElement(
            "canvas"
        );


    smallCanvas.width =
        detectionWidth;


    smallCanvas.height =
        detectionHeight;


    const ctx =
        smallCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    ctx.drawImage(

        sourceCanvas,

        0,
        0,

        sourceWidth,
        sourceHeight,

        0,
        0,

        detectionWidth,
        detectionHeight

    );


    const imageData =
        ctx.getImageData(

            0,
            0,

            detectionWidth,
            detectionHeight

        );


    const data =
        imageData.data;


    /*
     * Search inside the same area
     * as the green guide.
     */

    const guideLeft =
        detectionWidth * 0.06;


    const guideRight =
        detectionWidth * 0.94;


    const guideWidth =
        guideRight -
        guideLeft;


    const guideHeight =
        guideWidth / 1.586;


    const guideTop =
        (
            detectionHeight -
            guideHeight
        ) / 2;


    const guideBottom =
        guideTop +
        guideHeight;


    let minX =
        detectionWidth;


    let minY =
        detectionHeight;


    let maxX =
        -1;


    let maxY =
        -1;


    for (
        let y =
            Math.floor(guideTop);

        y <
            Math.ceil(guideBottom);

        y++
    ) {

        for (
            let x =
                Math.floor(guideLeft);

            x <
                Math.ceil(guideRight);

            x++
        ) {

            const index =
                (
                    y *
                    detectionWidth +
                    x
                ) * 4;


            const r =
                data[index];


            const g =
                data[index + 1];


            const b =
                data[index + 2];


            const isRed =
                r > 80 &&
                r > g * 1.25 &&
                r > b * 1.25 &&
                (r - g) > 25 &&
                (r - b) > 25;


            if (isRed) {

                minX =
                    Math.min(
                        minX,
                        x
                    );


                minY =
                    Math.min(
                        minY,
                        y
                    );


                maxX =
                    Math.max(
                        maxX,
                        x
                    );


                maxY =
                    Math.max(
                        maxY,
                        y
                    );

            }

        }

    }


    /*
     * No reliable red region.
     */

    if (
        maxX === -1 ||
        maxY === -1
    ) {

        return getFallbackCardCrop(
            sourceWidth,
            sourceHeight
        );

    }


    let detectedWidth =
        maxX - minX;


    let detectedHeight =
        maxY - minY;


    /*
     * Reject tiny detections.
     */

    if (
        detectedWidth *
        detectedHeight
        <
        guideWidth *
        guideHeight *
        0.08
    ) {

        return getFallbackCardCrop(
            sourceWidth,
            sourceHeight
        );

    }


    /*
     * Add padding.
     */

    const paddingX =
        detectedWidth * 0.12;


    const paddingY =
        detectedHeight * 0.12;


    minX -=
        paddingX;


    minY -=
        paddingY;


    maxX +=
        paddingX;


    maxY +=
        paddingY;


    /*
     * Convert small-image coordinates
     * back to the original camera image.
     */

    let cropX =
        (
            minX /
            detectionWidth
        ) *
        sourceWidth;


    let cropY =
        (
            minY /
            detectionHeight
        ) *
        sourceHeight;


    let cropWidth =
        (
            (
                maxX -
                minX
            ) /
            detectionWidth
        ) *
        sourceWidth;


    let cropHeight =
        (
            (
                maxY -
                minY
            ) /
            detectionHeight
        ) *
        sourceHeight;


    /*
     * Adjust toward the ID card ratio.
     */

    const targetRatio =
        1.586;


    const currentRatio =
        cropWidth /
        cropHeight;


    if (
        currentRatio < targetRatio
    ) {

        const newWidth =
            cropHeight *
            targetRatio;


        cropX -=
            (
                newWidth -
                cropWidth
            ) / 2;


        cropWidth =
            newWidth;

    }

    else {

        const newHeight =
            cropWidth /
            targetRatio;


        cropY -=
            (
                newHeight -
                cropHeight
            ) / 2;


        cropHeight =
            newHeight;

    }


    /*
     * Clamp to image boundaries.
     */

    cropX =
        Math.max(
            0,
            cropX
        );


    cropY =
        Math.max(
            0,
            cropY
        );


    if (
        cropX +
        cropWidth >
        sourceWidth
    ) {

        cropWidth =
            sourceWidth -
            cropX;

    }


    if (
        cropY +
        cropHeight >
        sourceHeight
    ) {

        cropHeight =
            sourceHeight -
            cropY;

    }


    return {

        x:
            cropX,

        y:
            cropY,

        width:
            cropWidth,

        height:
            cropHeight

    };

}


/* =========================================================
   IMAGE PREPROCESSING
========================================================= */

function preprocessCanvas(
    sourceCanvas,
    contrast = 1.35
) {

    const ctx =
        sourceCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    const imageData =
        ctx.getImageData(

            0,
            0,

            sourceCanvas.width,
            sourceCanvas.height

        );


    const data =
        imageData.data;


    const factor =
        (
            259 *
            (
                contrast +
                255
            )
        ) /
        (
            255 *
            (
                259 -
                contrast
            )
        );


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r =
            data[i];


        const g =
            data[i + 1];


        const b =
            data[i + 2];


        /*
         * Grayscale.
         */

        let gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;


        /*
         * Contrast.
         */

        gray =
            factor *
            (
                gray -
                128
            ) +
            128;


        gray =
            Math.max(

                0,

                Math.min(
                    255,
                    gray
                )

            );


        data[i] =
            gray;


        data[i + 1] =
            gray;


        data[i + 2] =
            gray;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );

}


/* =========================================================
   MAIN OCR
========================================================= */

async function performOCR() {

    status.textContent =
        "Preparing ID image...";


    const videoWidth =
        video.videoWidth;


    const videoHeight =
        video.videoHeight;


    if (
        !videoWidth ||
        !videoHeight
    ) {

        throw new Error(
            "Camera image is not ready."
        );

    }


    /*
     * Capture the full camera frame
     * temporarily.
     */

    const fullCanvas =
        document.createElement(
            "canvas"
        );


    fullCanvas.width =
        videoWidth;


    fullCanvas.height =
        videoHeight;


    const fullCtx =
        fullCanvas.getContext(
            "2d"
        );


    fullCtx.drawImage(

        video,

        0,
        0,

        videoWidth,
        videoHeight

    );


    /*
     * Detect the red ID.
     */

    status.textContent =
        "Detecting red ID area...";


    const crop =
        detectRedIDArea(
            fullCanvas
        );


    console.log(
        "FINAL ID CROP:",
        crop
    );


    /*
     * Hide live box while scanning
     * so the processed image is clean.
     */

    redDetectionBox.style.display =
        "none";


    /*
     * Upscale.
     */

    const scale =
        2;


    canvas.width =
        Math.round(
            crop.width *
            scale
        );


    canvas.height =
        Math.round(
            crop.height *
            scale
        );


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.imageSmoothingEnabled =
        true;


    ctx.imageSmoothingQuality =
        "high";


    ctx.drawImage(

        fullCanvas,

        crop.x,
        crop.y,

        crop.width,
        crop.height,

        0,
        0,

        canvas.width,
        canvas.height

    );


    status.textContent =
        "Enhancing image...";


    /*
     * Grayscale + moderate contrast.
     */

    preprocessCanvas(
        canvas,
        1.35
    );


    /*
     * Display processed image.
     */

    processedImage.src =
        canvas.toDataURL(
            "image/png"
        );


    processedImage.style.display =
        "block";


    /* =====================================================
       MAIN OCR
    ===================================================== */

    status.textContent =
        "Reading ID information...";


    const result =
        await Tesseract.recognize(

            canvas,

            "eng",

            {

                logger:
                    function(info) {

                        console.log(
                            "TESSERACT:",
                            info
                        );


                        if (
                            info.progress !==
                            undefined
                        ) {

                            progressBar.style.width =
                                (
                                    info.progress *
                                    80
                                ) + "%";

                        }


                        if (
                            info.status
                        ) {

                            status.textContent =
                                info.status;

                        }

                    },


                tessedit_pageseg_mode:
                    6,


                preserve_interword_spaces:
                    1

            }

        );


    const text =
        result.data.text;


    console.log(
        "MAIN OCR RESULT:",
        text
    );


    rawOCR.textContent =
        text ||
        "Tesseract returned no text.";


    /*
     * Parse all fields.
     */

    parseOCR(
        text
    );


    /* =====================================================
       TARGETED LRN OCR
    ===================================================== */

    if (
        !isValidLRN(
            lrnField.value
        )
    ) {

        status.textContent =
            "Improving LRN recognition...";


        const targetedLRN =
            await performTargetedLRNOCR(
                canvas
            );


        if (
            isValidLRN(
                targetedLRN
            )
        ) {

            lrnField.value =
                targetedLRN;


            rawOCR.textContent +=
                "\n\n[Targeted LRN OCR]\n" +
                targetedLRN;

        }

    }


    progressBar.style.width =
        "100%";


    /* =====================================================
       DATABASE
    ===================================================== */

    if (
        isValidLRN(
            lrnField.value
        )
    ) {

        status.textContent =
            "OCR complete. Checking database...";


        await checkDatabase();

    }

    else {

        status.textContent =
            "OCR complete. LRN could not be confidently detected.";


        databaseButton.disabled =
            false;

    }

}


/* =========================================================
   TARGETED LRN OCR
========================================================= */

async function performTargetedLRNOCR(
    fullCanvas
) {

    const width =
        fullCanvas.width;


    const height =
        fullCanvas.height;


    /*
     * LRN is normally around the
     * upper-middle area.
     */

    const x =
        width * 0.05;


    const y =
        height * 0.25;


    const cropWidth =
        width * 0.90;


    const cropHeight =
        height * 0.18;


    /*
     * Extra enlargement.
     */

    const scale =
        3;


    lrnCanvas.width =
        Math.round(
            cropWidth *
            scale
        );


    lrnCanvas.height =
        Math.round(
            cropHeight *
            scale
        );


    const ctx =
        lrnCanvas.getContext(
            "2d"
        );


    ctx.imageSmoothingEnabled =
        true;


    ctx.imageSmoothingQuality =
        "high";


    ctx.drawImage(

        fullCanvas,

        x,
        y,

        cropWidth,
        cropHeight,

        0,
        0,

        lrnCanvas.width,
        lrnCanvas.height

    );


    /*
     * Stronger contrast.
     */

    preprocessCanvas(
        lrnCanvas,
        1.6
    );


    console.log(
        "Running targeted LRN OCR..."
    );


    const result =
        await Tesseract.recognize(

            lrnCanvas,

            "eng",

            {

                logger:
                    function(info) {

                        console.log(
                            "LRN OCR:",
                            info
                        );

                    },


                tessedit_pageseg_mode:
                    7,


                tessedit_char_whitelist:
                    "LRN:0123456789"

            }

        );


    const text =
        result.data.text;


    console.log(
        "TARGETED LRN RESULT:",
        text
    );


    return extractBestLRN(
        text
    );

}


/* =========================================================
   OCR PARSING
========================================================= */

function parseOCR(
    text
) {

    /*
     * Clear fields.
     */

    nameField.value =
        "";

    gradeField.value =
        "";

    sectionField.value =
        "";

    lrnField.value =
        "";

    idField.value =
        "";


    const lines =
        text
            .split(/\r?\n/)
            .map(
                line =>
                    line.trim()
            )
            .filter(
                line =>
                    line.length > 0
            );


    /* =====================================================
       LRN
    ===================================================== */

    const lrn =
        extractBestLRN(
            text
        );


    if (
        isValidLRN(lrn)
    ) {

        lrnField.value =
            lrn;

    }


    /* =====================================================
       ID NUMBER
    ===================================================== */

    let idMatch =
        text.match(

            /ID\s*(?:NO|NUMBER)?\s*[:#.\-]?\s*([0-9]{3,})\s*[-–—]\s*([0-9]{2,})\s*[-–—]?\s*([A-Za-z]{0,5})/i

        );


    if (idMatch) {

        let id =
            idMatch[1] +
            "-" +
            idMatch[2];


        if (
            idMatch[3]
        ) {

            id +=
                "-" +
                idMatch[3]
                    .toUpperCase();

        }


        idField.value =
            id;

    }

    else {

        const fallbackID =
            text.match(

                /\b([0-9]{5,})\s*[-–—]\s*([0-9]{2,})\s*[-–—]?\s*(SHS|JHS)?\b/i

            );


        if (
            fallbackID
        ) {

            idField.value =
                fallbackID[1] +
                "-" +
                fallbackID[2];


            if (
                fallbackID[3]
            ) {

                idField.value +=
                    "-" +
                    fallbackID[3]
                        .toUpperCase();

            }

        }

    }


    /* =====================================================
       GRADE + SECTION
    ===================================================== */

    let gradeMatch =
        text.match(

            /GRADE\s*(?:LEVEL)?\s*(7|8|9|10|11|12)\s*[-–—:]?\s*([A-Za-z0-9][A-Za-z0-9 .'-]*)/i

        );


    if (
        gradeMatch
    ) {

        gradeField.value =
            gradeMatch[1];


        sectionField.value =
            cleanSection(
                gradeMatch[2]
            );

    }


    /*
     * Fallback for OCR mistakes.
     */

    if (
        !gradeField.value
    ) {

        const fallbackGrade =
            text.match(

                /\b(?:G[A-Z]*R[A-Z]*D[A-Z]*E?)\s*[^0-9]{0,3}(7|8|9|10|11|12)\s*[-–—:]?\s*([A-Za-z0-9 .'-]+)/i

            );


        if (
            fallbackGrade
        ) {

            gradeField.value =
                fallbackGrade[1];


            sectionField.value =
                cleanSection(
                    fallbackGrade[2]
                );

        }

    }


    /* =====================================================
       NAME
    ===================================================== */

    for (
        const line of lines
    ) {

        const upper =
            line.toUpperCase();


        if (

            upper.includes("LRN") ||
            upper.includes("ID NO") ||
            upper.includes("ID NUMBER") ||
            upper.includes("GRADE") ||
            upper.includes("SECTION")

        ) {

            continue;

        }


        /*
         * Remove obvious OCR garbage.
         */

        const cleaned =
            line

                .replace(
                    /[^A-Za-zÀ-ÿ.' -]/g,
                    ""
                )

                .replace(
                    /\s+/g,
                    " "
                )

                .trim();


        const words =
            cleaned
                .split(" ")
                .filter(
                    word =>
                        word.length > 0
                );


        /*
         * Names usually have
         * at least two words.
         */

        if (

            words.length >= 2 &&
            cleaned.length >= 5

        ) {

            nameField.value =
                cleaned;

            break;

        }

    }


    console.log(
        "PARSED NAME:",
        nameField.value
    );


    console.log(
        "PARSED GRADE:",
        gradeField.value
    );


    console.log(
        "PARSED SECTION:",
        sectionField.value
    );


    console.log(
        "PARSED LRN:",
        lrnField.value
    );


    console.log(
        "PARSED ID:",
        idField.value
    );

}


/* =========================================================
   LRN EXTRACTION
========================================================= */

function extractBestLRN(
    text
) {

    /*
     * Normal LRN pattern.
     */

    let match =
        text.match(

            /LRN\s*[:#=\-]?\s*([0-9][0-9\s]{10,18})/i

        );


    if (
        match
    ) {

        const digits =
            cleanDigits(
                match[1]
            );


        if (
            isValidLRN(
                digits
            )
        ) {

            return digits;

        }

    }


    /*
     * OCR may confuse LRN with
     * another label.
     */

    match =
        text.match(

            /\b[A-Z]{2,4}\s*[:#=\-]?\s*([0-9][0-9\s]{10,18})\b/i

        );


    if (
        match
    ) {

        const digits =
            cleanDigits(
                match[1]
            );


        if (
            isValidLRN(
                digits
            )
        ) {

            return digits;

        }

    }


    /*
     * Last fallback:
     * any 12-digit sequence.
     */

    const digitGroups =
        text.match(
            /[0-9][0-9\s]{10,18}/g
        );


    if (
        digitGroups
    ) {

        for (
            const group of digitGroups
        ) {

            const digits =
                cleanDigits(
                    group
                );


            if (
                isValidLRN(
                    digits
                )
            ) {

                return digits;

            }

        }

    }


    return "";

}


/* =========================================================
   CLEAN LRN
========================================================= */

function cleanDigits(
    value
) {

    return String(
        value
    )

        .replace(
            /[OoQq]/g,
            "0"
        )

        .replace(
            /[IiLl|]/g,
            "1"
        )

        .replace(
            /[Ss]/g,
            "5"
        )

        .replace(
            /[Bb]/g,
            "8"
        )

        .replace(
            /[Gg]/g,
            "6"
        )

        .replace(
            /[^0-9]/g,
            ""
        );

}


/* =========================================================
   LRN VALIDATION
========================================================= */

function isValidLRN(
    lrn
) {

    return /^\d{12}$/.test(
        String(lrn).trim()
    );

}


/* =========================================================
   CLEAN SECTION
========================================================= */

function cleanSection(
    section
) {

    return String(
        section
    )

        .replace(
            /\s+/g,
            " "
        )

        .replace(
            /^[\-–—:\s]+/,
            ""
        )

        .trim();

}


/* =========================================================
   DATABASE CHECK
========================================================= */

async function checkDatabase() {

    const lrn =
        lrnField.value
            .trim();


    if (
        !isValidLRN(
            lrn
        )
    ) {

        status.textContent =
            "No valid 12-digit LRN was detected.";


        databaseButton.disabled =
            false;


        return;

    }


    if (
        DATABASE_URL.includes(
            "PASTE_YOUR"
        )
    ) {

        alert(
            "Apps Script URL has not been entered."
        );


        databaseButton.disabled =
            false;


        return;

    }


    status.textContent =
        "Checking Google Sheets...";


    databaseButton.disabled =
        true;


    databaseResult.style.display =
        "none";


    try {

        const url =
            DATABASE_URL +
            "?lrn=" +
            encodeURIComponent(
                lrn
            );


        console.log(
            "DATABASE REQUEST:",
            url
        );


        const response =
            await fetch(
                url
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP error: " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "DATABASE RESULT:",
            result
        );


        /*
         * STUDENT FOUND
         */

        if (
            result.match === true
        ) {

            databaseResult.style.display =
                "block";


            databaseResult.className =
                "database-result valid";


            databaseStatus.textContent =
                "🟢 VALID STUDENT";


            databaseDetails.innerHTML =

                "<strong>Name:</strong> " +
                escapeHTML(
                    result.student.name
                ) +

                "<br><br>" +

                "<strong>LRN:</strong> " +
                escapeHTML(
                    result.student.lrn
                ) +

                "<br><br>" +

                "<strong>ID Number:</strong> " +
                escapeHTML(
                    result.student.idNumber
                ) +

                "<br><br>" +

                "<strong>Grade:</strong> " +
                escapeHTML(
                    result.student.grade
                ) +

                "<br><br>" +

                "<strong>Section:</strong> " +
                escapeHTML(
                    result.student.section
                );


            status.textContent =
                "Student identified successfully.";

        }


        /*
         * STUDENT NOT FOUND
         */

        else {

            databaseResult.style.display =
                "block";


            databaseResult.className =
                "database-result invalid";


            databaseStatus.textContent =
                "🔴 STUDENT NOT FOUND";


            databaseDetails.innerHTML =

                "<strong>Scanned LRN:</strong> " +
                escapeHTML(
                    lrn
                ) +

                "<br><br>" +

                "This LRN was not found " +
                "in the student database.";


            status.textContent =
                "No matching student.";

        }

    }


    catch (error) {

        console.error(
            "DATABASE ERROR:",
            error
        );


        databaseResult.style.display =
            "block";


        databaseResult.className =
            "database-result invalid";


        databaseStatus.textContent =
            "⚠️ DATABASE CONNECTION FAILED";


        databaseDetails.innerHTML =

            "Could not connect to Google Apps Script." +

            "<br><br>" +

            "<small>" +

            escapeHTML(
                error.message
            ) +

            "</small>";


        status.textContent =
            "Database connection failed.";

    }


    finally {

        databaseButton.disabled =
            false;

    }

}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(
    value
) {

    return String(
        value
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
