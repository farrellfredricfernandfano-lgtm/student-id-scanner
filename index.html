/* =========================================================
   START CAMERA

async function startCamera() {

        status.textContent =
            "Starting camera...";

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                audio: false,

                video: {

                    facingMode: {

                        ideal: 1080

            await track.applyConstraints({

                width: {
                    ideal: 1920
                },

                height: {
                    ideal: 1080
                },

                frameRate: {
                    ideal: 30
                }

/* =========================================================

function stopCamera() {

        cameraStream = null;

    video.srcObject = null;

    startButton.disabled = false;
    scanButton.disabled = true;
    stopButton.disabled = true;

    status.textContent =

}


/* =========================================================
   CAPTURE + SCAN
========================================================= */

async function captureAndScan() {

    if (!cameraStream) {

        alert(
            "Please start the camera first."
        );

        return;

    }

    scanButton.disabled = true;
    databaseButton.disabled = true;

    const scanStartTime =
        performance.now();

        performance.now();

    const elapsedSeconds =
        (scanEndTime - scanStartTime) / 1000;

    scanTime.textContent =
        "⏱ Scan Time: " +
        elapsedSeconds.toFixed(2) +
        " seconds";

    scanButton.disabled = false;

}


/* =========================================================
   IMAGE PREPROCESSING
   STRONGER CHARACTER / BACKGROUND CONTRAST
========================================================= */

function preprocessCanvas(
    sourceCanvas,
    contrast = 1.55

) {

    const ctx =
        sourceCanvas.getContext(
            "2d",
            {
                willReadFrequently:
                    true
            }
        );


    const imageData =
        ctx.getImageData(
            0,
            0,
            sourceCanvas.width,
            sourceCanvas.height
        );


    const data =
        imageData.data;


    /*
     * Stronger contrast formula.
     *
     * This increases the difference between
     * dark characters and lighter backgrounds.
     */

    const factor =
        (
            259 *
            (contrast + 255)
        ) /
        (
            255 *
            (259 - contrast)
        );


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r =
            data[i];

        const g =
            data[i + 1];

        const b =
            data[i + 2];


        /*
         * Convert RGB to grayscale.
         *
         * This removes color information that
         * can interfere with OCR.
         */

        let gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;


        /*
         * Apply stronger contrast.
         */

        gray =
            factor *
            (gray - 128) +
            128;


        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );


        /*
         * STRONG CHARACTER / BACKGROUND SEPARATION
         *
         * Very dark pixels become pure black.
         * Very bright pixels become pure white.
         *
         * The middle range is preserved so that
         * thin/anti-aliased characters aren't
         * completely destroyed.
         */

        if (
            gray <= 70
        ) {

            gray = 0;

        }

        else if (
            gray >= 215
        ) {

            gray = 255;

        }

        else {

            /*
             * Stretch the remaining middle range
             * between black and white.
             */

            gray =
                (
                    (gray - 70) /
                    (215 - 70)
                ) * 255;

        }


        /*
         * Keep the image grayscale.
         */

        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );

}


/* =========================================================
   MAIN OCR PASS 1 + PASS 2 ONLY
========================================================= */

async function performOCR() {

    status.textContent =
        "Preparing ID image...";

    const videoWidth =
        video.videoWidth;

    const videoHeight =
        video.videoHeight;

    if (
        !videoWidth ||
        !videoHeight
    ) {

        throw new Error(
            "Camera image is not ready."
        );

    }


    /* =====================================================
       1850 × 617 CROP
    ===================================================== */

    const targetWidth = 1850;
    const targetHeight = 617;

    const targetRatio =
        targetWidth /
        targetHeight;

    let finalCropWidth;
    let finalCropHeight;

    if (
        videoWidth /
        videoHeight >
        targetRatio
    ) {

        finalCropHeight =
            videoHeight * 0.92;

        finalCropWidth =
            finalCropHeight *
            targetRatio;

    } else {

        finalCropWidth =
            videoWidth * 0.92;

        finalCropHeight =
            finalCropWidth /
            targetRatio;

    }

    const cropX =
        (videoWidth -
        finalCropWidth) / 2;

    const cropY =
        (videoHeight -
        finalCropHeight) / 2;


    /* =====================================================
       EXACT 1850 × 617 OUTPUT
    ===================================================== */

    canvas.width =
        targetWidth;

    canvas.height =
        targetHeight;

    const ctx =
        canvas.getContext("2d");

    ctx.imageSmoothingEnabled =
        true;

    ctx.imageSmoothingQuality =
        "high";

    ctx.drawImage(

        video,

        cropX,
        cropY,
        finalCropWidth,
        finalCropHeight,

        0,
        0,
        targetWidth,
        targetHeight

    );


    status.textContent =
        "Enhancing image...";

    preprocessCanvas(
        canvas,
        1.55
    );

    processedImage.src =
        canvas.toDataURL(
            "image/png"
        );

    processedImage.style.display =
        "block";


    /* =====================================================
       OCR PASS 1
    ===================================================== */

    status.textContent =
        "Reading ID information...";

    const result1 =
        await Tesseract.recognize(
            canvas,
            "eng",
            {

                logger: function(info) {

                    console.log(
                        "TESSERACT PASS 1:",
                        info
                    );

                    if (
                        info.progress !==
                        undefined
                    ) {

                        progressBar.style.width =
                            (info.progress * 40) +
                            "%";

                    }

                    if (info.status) {

                        status.textContent =
                            info.status;

                    }

                },

                tessedit_pageseg_mode: 6,

                preserve_interword_spaces: 1

            }
        );

    const textPass1 =
        result1.data.text;

    console.log(
        "OCR PASS 1:",
        textPass1
    );

    const pass1Results =
        parseOCR(textPass1);

    let bestResults = {

        name:
            pass1Results.name,

        grade:
            pass1Results.grade,

        section:
            pass1Results.section,

        lrn:
            pass1Results.lrn,

        id:
            pass1Results.id

    };


    /* =====================================================
       OCR PASS 2 SHARPENED
    ===================================================== */

    status.textContent =
        "Running second OCR pass...";

    const sharpenCanvas =
        document.createElement(
            "canvas"
        );

    sharpenCanvas.width =
        canvas.width;

    sharpenCanvas.height =
        canvas.height;

    const sharpenCtx =
        sharpenCanvas.getContext(
            "2d"
        );

    sharpenCtx.drawImage(
        canvas,
        0,
        0
    );

    const imageData =
        sharpenCtx.getImageData(
            0,
            0,
            sharpenCanvas.width,
            sharpenCanvas.height
        );

    const data =
        imageData.data;

    const original =
        new Uint8ClampedArray(
            data
        );

    const w =
        sharpenCanvas.width;

    const h =
        sharpenCanvas.height;

    for (
        let y = 1;
        y < h - 1;
        y++
    ) {

        for (
            let x = 1;
            x < w - 1;
            x++
        ) {

            const index =
                (y * w + x) * 4;

            for (
                let c = 0;
                c < 3;
                c++
            ) {

                const center =
                    original[
                        index + c
                    ];

                const top =
                    original[
                        index -
                        w * 4 +
                        c
                    ];

                const bottom =
                    original[
                        index +
                        w * 4 +
                        c
                    ];

                const left =
                    original[
                        index -
                        4 +
                        c
                    ];

                const right =
                    original[
                        index +
                        4 +
                        c
                    ];

                const sharpened =
                    (
                        5 * center -
                        top -
                        bottom -
                        left -
                        right
                    );

                data[
                    index + c
                ] =
                    Math.max(
                        0,
                        Math.min(
                            255,
                            sharpened
                        )
                    );

            }

        }

    }

    sharpenCtx.putImageData(
        imageData,
        0,
        0
    );


    const result2 =
        await Tesseract.recognize(
            sharpenCanvas,
            "eng",
            {

                logger: function(info) {

                    console.log(
                        "TESSERACT PASS 2:",
                        info
                    );

                    if (
                        info.progress !==
                        undefined
                    ) {

                        progressBar.style.width =
                            (
                                40 +
                                info.progress * 40
                            ) +
                            "%";

                    }

                },

                tessedit_pageseg_mode: 6,

                preserve_interword_spaces: 1

            }
        );

    const textPass2 =
        result2.data.text;

    console.log(
        "OCR PASS 2:",
        textPass2
    );

    const pass2Results =
        parseOCR(textPass2);

    bestResults =
        mergeOCRResults(
            bestResults,
            pass2Results
        );


    /* =====================================================
       SHOW RAW OCR
    ===================================================== */

    rawOCR.textContent =
        "[OCR PASS 1]\n" +
        textPass1 +
        "\n\n" +
        "[OCR PASS 2]\n" +
        textPass2;


    /* =====================================================
       INITIAL RESULTS
    ===================================================== */

    nameField.value =
        bestResults.name;

    gradeField.value =
        bestResults.grade;

    sectionField.value =
        bestResults.section;

    lrnField.value =
        bestResults.lrn;

    idField.value =
        bestResults.id;

    console.log(
        "MERGED OCR RESULTS:",
        bestResults
    );


    /* =====================================================
       DATABASE IDENTIFICATION
    ===================================================== */

    const hasLRN =
        isValidLRN(
            bestResults.lrn
        );

    const hasID =
        normalizeIDNumber(
            bestResults.id
        ).length > 0;

    const hasName =
        bestResults.name
            .trim()
            .length >= 5;

    const hasSupportingInfo =
        (
            bestResults.grade
                .trim()
                .length > 0
        ) ||
        (
            bestResults.section
                .trim()
                .length > 0
        );

    if (
        hasLRN ||
        hasID ||
        (
            hasName &&
            hasSupportingInfo
        )
    ) {

        status.textContent =
            "OCR complete. Identifying student...";

        await checkDatabase();

    } else {

        progressBar.style.width =
            "100%";

        status.textContent =
            "OCR complete. No usable identifier was detected.";

        databaseButton.disabled =
            false;

    }

}


/* =========================================================
   TARGETED LRN OCR
========================================================= */

async function performTargetedLRNOCR(
    fullCanvas
) {

    const width =
        fullCanvas.width;

    const height =
        fullCanvas.height;


    /*
     * LRN area remains based on your
     * 1850 × 617 processed image.
     */

    const x =
        width * 0.05;

    const y =
        height * 0.25;

    const cropWidth =
        width * 0.90;

    const cropHeight =
        height * 0.18;

    const scale = 3;

    lrnCanvas.width =
        Math.round(
            cropWidth * scale
        );

    lrnCanvas.height =
        Math.round(
            cropHeight * scale
        );

    const ctx =
        lrnCanvas.getContext(
            "2d"
        );

    ctx.imageSmoothingEnabled =
        true;

    ctx.imageSmoothingQuality =
        "high";

    ctx.drawImage(

        fullCanvas,

        x,
        y,
        cropWidth,
        cropHeight,

        0,
        0,
        lrnCanvas.width,
        lrnCanvas.height

    );

    preprocessCanvas(
        lrnCanvas,
        1.6
    );

    console.log(
        "Running targeted LRN OCR..."
    );

    const result =
        await Tesseract.recognize(

            lrnCanvas,

            "eng",

            {

                logger:
                    function(info) {

                        console.log(
                            "LRN OCR:",
                            info
                        );

                    },

                tessedit_pageseg_mode: 7,

                tessedit_char_whitelist:
                    "LRN:0123456789"

            }

        );

    const text =
        result.data.text;

    console.log(
        "TARGETED LRN RESULT:",
        text
    );

    return extractBestLRN(
        text
    );

}


/* =========================================================
   OCR PARSING
========================================================= */

function parseOCR(text) {

    const result = {

        name: "",
        grade: "",
        section: "",
        lrn: "",
        id: ""

    };


    const lines =
        String(text)
            .split(/\r?\n/)
            .map(
                line => line.trim()
            )
            .filter(
                line => line.length > 0
            );


    /* =====================================================
       LRN
    ===================================================== */

    const lrn =
        extractBestLRN(text);

    if (
        isValidLRN(lrn)
    ) {

        result.lrn =
            lrn;

    }


    /* =====================================================
       ID NUMBER
    ===================================================== */

    let idMatch =
        text.match(

            /ID\s*(?:NO|NUMBER)?\s*[:#.\-]?\s*([0-9OoQq]{3,})\s*[-–—\s]\s*([0-9OoQq]{2,})\s*[-–—\s]?\s*([A-Za-z0-9]{2,5})?/i

        );


    if (idMatch) {

        let part1 =
            cleanIDDigits(
                idMatch[1]
            );

        let part2 =
            cleanIDDigits(
                idMatch[2]
            );

        let id =
            part1 +
            "-" +
            part2;

        if (idMatch[3]) {

            id +=
                "-" +
                normalizeIDSuffix(
                    idMatch[3]
                );

        }

        result.id =
            id;

    } else {

        const fallbackID =
            text.match(

                /\b([0-9OoQq]{5,})\s*[-–—\s]\s*([0-9OoQq]{2,})\s*[-–—\s]?\s*(SHS|JHS|5H5|JH5)?\b/i

            );

        if (fallbackID) {

            result.id =
                cleanIDDigits(
                    fallbackID[1]
                ) +
                "-" +
                cleanIDDigits(
                    fallbackID[2]
                );

            if (fallbackID[3]) {

                result.id +=
                    "-" +
                    normalizeIDSuffix(
                        fallbackID[3]
                    );

            }

        }

    }


    /* =====================================================
       GRADE + SECTION
    ===================================================== */

    let gradeMatch =
        text.match(

            /GRADE\s*(?:LEVEL)?\s*(7|8|9|10|11|12|I2|l2)\s*[-–—:]?\s*([A-Za-z0-9][A-Za-z0-9 .'-]*)/i

        );


    if (gradeMatch) {

        result.grade =
            normalizeGrade(
                gradeMatch[1]
            );

        result.section =
            cleanSection(
                gradeMatch[2]
            );

    }


    if (!result.grade) {

        const fallbackGrade =
            text.match(

                /\b(?:G[A-Z]*R[A-Z]*D[A-Z]*E?)\s*[^0-9]{0,3}(7|8|9|10|11|12|I2|l2)\s*[-–—:]?\s*([A-Za-z0-9 .'-]+)/i

            );

        if (fallbackGrade) {

            result.grade =
                normalizeGrade(
                    fallbackGrade[1]
                );

            result.section =
                cleanSection(
                    fallbackGrade[2]
                );

        }

    }


    /* =====================================================
       NAME
    ===================================================== */

    for (
        const line of lines
    ) {

        const upper =
            line.toUpperCase();

        if (
            upper.includes("LRN") ||
            upper.includes("ID NO") ||
            upper.includes("ID NUMBER") ||
            upper.includes("GRADE") ||
            upper.includes("SECTION")
        ) {

            continue;

        }

        const cleaned =
            line
                .replace(
                    /[^A-Za-zÀ-ÿ.' -]/g,
                    ""
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();

        const words =
            cleaned
                .split(" ")
                .filter(
                    word =>
                        word.length > 0
                );

        const letterCount =
            (
                cleaned.match(
                    /[A-Za-zÀ-ÿ]/g
                ) || []
            ).length;

        if (
            words.length >= 2 &&
            cleaned.length >= 5 &&
            letterCount >= 4
        ) {

            result.name =
                cleaned;

            break;

        }

    }


    console.log(
        "PARSED OCR PASS:",
        result
    );

    return result;

}


/* =========================================================
   MERGE OCR RESULTS
========================================================= */

function mergeOCRResults(
    bestResults,
    newResults
) {

    if (
        !bestResults.name &&
        newResults.name
    ) {

        bestResults.name =
            newResults.name;

    }

    if (
        !bestResults.grade &&
        newResults.grade
    ) {

        bestResults.grade =
            newResults.grade;

    }

    if (
        !bestResults.section &&
        newResults.section
    ) {

        bestResults.section =
            newResults.section;

    }


    /*
     * A valid LRN is never replaced
     * by an invalid LRN.
     */

    if (
        !isValidLRN(
            bestResults.lrn
        ) &&
        isValidLRN(
            newResults.lrn
        )
    ) {

        bestResults.lrn =
            newResults.lrn;

    }


    if (
        !bestResults.id &&
        newResults.id
    ) {

        bestResults.id =
            newResults.id;

    }

    return bestResults;

}


/* =========================================================
   LRN EXTRACTION
========================================================= */

function extractBestLRN(text) {

    const source =
        String(text);


    /*
     * -----------------------------------------------------
     * 1. Look for an LRN label first.
     * -----------------------------------------------------
     */

    let match =
        source.match(

            /LRN\s*[:#=\-]?\s*([0-9OoQqIiLl|SsBbGg\s]{8,30})/i

        );


    if (match) {

        const candidates =
            getLRNCandidates(
                match[1]
            );

        if (
            candidates.length > 0
        ) {

            return candidates[0];

        }

    }


    /*
     * -----------------------------------------------------
     * 2. Look for a long digit-like OCR sequence.
     * -----------------------------------------------------
     */

    const digitGroups =
        source.match(

            /[0-9OoQqIiLl|SsBbGg][0-9OoQqIiLl|SsBbGg\s]{7,30}/g

        );


    if (digitGroups) {

        for (
            const group of digitGroups
        ) {

            const candidates =
                getLRNCandidates(
                    group
                );

            if (
                candidates.length > 0
            ) {

                return candidates[0];

            }

        }

    }

    return "";

}


function getLRNCandidates(value) {

    const cleaned =
        cleanDigits(value);

    const candidates = [];


    /*
     * -----------------------------------------------------
     * EXACT 12 DIGITS
     * -----------------------------------------------------
     */

    if (
        cleaned.length === 12
    ) {

        candidates.push(
            cleaned
        );

        return candidates;

    }


    /*
     * -----------------------------------------------------
     * MORE THAN 12 DIGITS
     *
     * Example:
     *
     * 1341021302248
     *
     * Possible LRNs:
     *
     * 134102130224
     * 341021302248
     * -----------------------------------------------------
     */

    if (
        cleaned.length > 12
    ) {

        for (
            let i = 0;
            i <= cleaned.length - 12;
            i++
        ) {

            const candidate =
                cleaned.substring(
                    i,
                    i + 12
                );

            if (
                /^\d{12}$/.test(
                    candidate
                )
            ) {

                if (
                    !candidates.includes(
                        candidate
                    )
                ) {

                    candidates.push(
                        candidate
                    );

                }

            }

        }

    }

    return candidates;

}


/* =========================================================
   CLEAN LRN
========================================================= */

function cleanDigits(value) {

    return String(value)

        .replace(
            /[OoQq]/g,
            "0"
        )

        .replace(
            /[IiLl|]/g,
            "1"
        )

        .replace(
            /[Ss]/g,
            "5"
        )

        .replace(
            /[Bb]/g,
            "8"
        )

        .replace(
            /[Gg]/g,
            "6"
        )

        .replace(
            /[^0-9]/g,
            ""
        );

}


/* =========================================================
   ID NUMBER NORMALIZATION
========================================================= */

function cleanIDDigits(value) {

    return String(value)

        .toUpperCase()

        .replace(
            /[OoQq]/g,
            "0"
        )

        .replace(
            /[IiLl]/g,
            "1"
        )

        .replace(
            /[Bb]/g,
            "8"
        )

        .replace(
            /[Gg]/g,
            "6"
        )

        .replace(
            /[^0-9]/g,
            ""
        );

}


function normalizeIDSuffix(value) {

    return String(value)

        .toUpperCase()

        .replace(
            /5H5/g,
            "SHS"
        )

        .replace(
            /JH5/g,
            "JHS"
        )

        .replace(
            /[^A-Z0-9]/g,
            ""
        );

}


function normalizeIDNumber(value) {

    const source =
        String(value)
            .toUpperCase()
            .trim();

    const match =
        source.match(

            /^([0-9OoQq]{3,})[\s\-._]*([0-9OoQq]{2,})[\s\-._]*([A-Z0-9]{2,5})?$/

        );


    if (match) {

        let result =
            cleanIDDigits(
                match[1]
            ) +
            cleanIDDigits(
                match[2]
            );

        if (match[3]) {

            result +=
                normalizeIDSuffix(
                    match[3]
                );

        }

        return result;

    }


    return source
        .replace(
            /[^A-Z0-9]/g,
            ""
        );

}


/* =========================================================
   GRADE NORMALIZATION
========================================================= */

function normalizeGrade(value) {

    const source =
        String(value)
            .toUpperCase()
            .replace(
                /[IiLl]/g,
                "1"
            )
            .replace(
                /[OoQ]/g,
                "0"
            );

    const match =
        source.match(
            /7|8|9|10|11|12/
        );

    return match
        ? match[0]
        : "";

}


/* =========================================================
   SECTION CLEANING
========================================================= */

function cleanSection(section) {

    return String(section)

        .replace(
            /\s+/g,
            " "
        )

        .replace(
            /^[\-–—:\s]+/,
            ""
        )

        .trim();

}


/* =========================================================
   LRN VALIDATION
========================================================= */

function isValidLRN(lrn) {

    return /^\d{12}$/.test(
        String(lrn).trim()
    );

}


/* =========================================================

async function checkDatabase() {

        nameField.value.trim();

    const grade =
        gradeField.value.trim();

    ) {

        status.textContent =
            "No usable student identifier was detected.";

        databaseButton.disabled =

        )
    ) {

        );

            false;

        return;

    }


    status.textContent =
        "Identifying student...";

    databaseButton.disabled =
        true;

    databaseResult.style.display =
        "none";


    try {

        const params =
            new URLSearchParams({

                lrn: lrn,

                id: idNumber,

                name: name,

                grade: grade,

                section: section

            });


        const url =
            DATABASE_URL +
            "?" +
            params.toString();


        console.log(

            url
        );


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "HTTP error: " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "DATABASE RESULT:",
            result
        );


        if (
            result.match === true
        ) {

            databaseResult.style.display =
                "block";

            databaseResult.className =
                "database-result valid";

            databaseStatus.textContent =
                "🟢 VALID STUDENT";


            let similarityText =
                "";


            if (

            ) {

                similarityText +=
                    "<br><strong>Name similarity:</strong> " +
                    escapeHTML(
                        String(
                            result.nameSimilarity
                        )
                    ) +
                    "%";

            }


            if (
                result.sectionSimilarity !==
                undefined
            ) {

                similarityText +=
                    "<br><strong>Section similarity:</strong> " +
                    escapeHTML(
                        String(
                            result.sectionSimilarity
                        )
                    ) +
                    "%";

            }


            databaseDetails.innerHTML =

                "<strong>Identification method:</strong> " +
                escapeHTML(
                    result.method ||
                    "Database match"
                ) +

                similarityText +

                "<br><br>" +

                "<strong>Name:</strong> " +
                escapeHTML(
                    result.student.name
                ) +

                "<br><br>" +

                "<strong>LRN:</strong> " +
                escapeHTML(
                    result.student.lrn
                ) +

                "<br><br>" +

                "<strong>ID Number:</strong> " +
                escapeHTML(

                ) +

                "<br><br>" +

                "<strong>Grade:</strong> " +
                escapeHTML(

                ) +

                "<br><br>" +

                "<strong>Section:</strong> " +
                escapeHTML(
                    result.student.section
                );


            /*
             * Once identified, replace
             * imperfect OCR with database data.
             */

            nameField.value =
                result.student.name ||
                "";

            gradeField.value =
                result.student.grade ||
                "";

            sectionField.value =
                result.student.section ||
                "";

            lrnField.value =

                "";

            idField.value =
                result.student.idNumber ||
                "";


            status.textContent =
                "Student identified successfully.";

        }


        else if (

        ) {

            databaseResult.style.display =
                "block";

            databaseStatus.textContent =
                "🟠 MATCH IS AMBIGUOUS";


            databaseDetails.innerHTML =
                "The scanned information was not unique " +

            status.textContent =

        else {

            databaseDetails.innerHTML =

                ) +

                ) +

        );


        databaseResult.style.display =

        databaseStatus.textContent =
            "⚠️ DATABASE CONNECTION FAILED";


        databaseDetails.innerHTML =

            "<small>" +

            ) +

        status.textContent =

    } finally {

}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
