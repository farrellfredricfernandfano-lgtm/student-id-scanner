
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student ID Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 20px;
}

.camera-container {
    position: relative;
    width: 100%;
    max-width: 700px;
    margin: auto;
    background: black;
    overflow: hidden;
    border-radius: 12px;
}

video {
    display: block;
    width: 100%;
    height: auto;
}

.scan-guide {
    position: absolute;
    width: 88%;
    aspect-ratio: 1850 / 617;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border: 3px solid #00ff66;
    border-radius: 10px;
    box-shadow: 0 0 10px #00ff66,
                inset 0 0 10px rgba(0, 255, 102, 0.2);
    pointer-events: none;
}

.scan-guide::after {
    content: "ALIGN ENTIRE ID CARD HERE";
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #00ff66;
    white-space: nowrap;
}

.controls {
    max-width: 700px;
    margin: 20px auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

#startButton {
    background: #00c853;
    color: white;
}

#scanButton {
    background: #2196f3;
    color: white;
}

#stopButton {
    background: #f44336;
    color: white;
}

#databaseButton {
    background: #9c27b0;
    color: white;
}

.status {
    max-width: 700px;
    margin: 15px auto;
    padding: 12px;
    background: #222;
    border-radius: 8px;
    color: #ddd;
}

.progress-container {
    max-width: 700px;
    margin: 15px auto;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
    height: 12px;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #00ff66;
    transition: width 0.2s;
}

.image-container {
    max-width: 700px;
    margin: 20px auto;
}

.image-container h3 {
    margin-bottom: 10px;
}

#processedImage {
    max-width: 100%;
    border-radius: 8px;
    display: none;
}

.results {
    max-width: 700px;
    margin: 20px auto;
    text-align: left;
}

.results h2 {
    text-align: center;
}

.field {
    margin: 10px 0;
}

.field label {
    display: block;
    color: #aaa;
    font-size: 13px;
    margin-bottom: 4px;
}

.field input {
    width: 100%;
    padding: 11px;
    background: #222;
    color: white;
    border: 1px solid #444;
    border-radius: 6px;
    font-size: 15px;
}

.database-result {
    display: none;
    max-width: 700px;
    margin: 20px auto;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

.database-result.valid {
    background: #123d20;
    border: 2px solid #00c853;
}

.database-result.invalid {
    background: #421414;
    border: 2px solid #f44336;
}

#databaseStatus {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

#databaseDetails {
    text-align: left;
    line-height: 1.5;
}

.ocr-debug {
    max-width: 700px;
    margin: 20px auto;
    text-align: left;
}

.ocr-debug h3 {
    text-align: center;
}

#rawOCR {
    width: 100%;
    min-height: 150px;
    padding: 12px;
    background: #080808;
    color: #00ff66;
    border: 1px solid #333;
    border-radius: 8px;
    font-family: monospace;
    font-size: 14px;
    white-space: pre-wrap;
    overflow-wrap: break-word;
}
</style>
</head>

<body>

<h1>Student ID Scanner</h1>

<div class="subtitle">
    OCR-Based Student Identification System
</div>

<div class="camera-container">
    <video id="video" autoplay playsinline></video>
    <div class="scan-guide"></div>
</div>

<div class="controls">

    <button id="startButton">
        📷 Start Camera
    </button>

    <button id="scanButton" disabled>
        🔍 Scan & Verify
    </button>

    <button id="stopButton" disabled>
        ⛔ Stop Camera
    </button>

    <button id="databaseButton" disabled>
        🔎 Check Database
    </button>

</div>

<div class="status" id="status">
    Camera not started.
</div>

<div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
</div>

<div id="scanTime" style="
    max-width: 700px;
    margin: 10px auto;
    padding: 10px;
    background: #222;
    border-radius: 8px;
    color: #00ff66;
    font-size: 16px;
    font-weight: bold;
">
    ⏱ Scan Time: —
</div>

<div class="image-container">
    <h3>Captured ID Image — Original Color</h3>
    <img id="processedImage" alt="Captured ID">
</div>

<div class="results">

    <h2>Scanned Information</h2>

    <div class="field">
        <label>NAME</label>
        <input id="nameField" type="text" readonly>
    </div>

    <div class="field">
        <label>GRADE LEVEL</label>
        <input id="gradeField" type="text" readonly>
    </div>

    <div class="field">
        <label>SECTION</label>
        <input id="sectionField" type="text" readonly>
    </div>

    <div class="field">
        <label>LRN</label>
        <input id="lrnField" type="text" readonly>
    </div>

    <div class="field">
        <label>ID NUMBER</label>
        <input id="idField" type="text" readonly>
    </div>

</div>

<div class="database-result" id="databaseResult">
    <div id="databaseStatus"></div>
    <div id="databaseDetails"></div>
</div>

<div class="ocr-debug">

    <h3>Raw OCR Result</h3>

    <div id="rawOCR">
        No OCR result yet.
    </div>

</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");

const processedImage =
    document.getElementById("processedImage");

const startButton =
    document.getElementById("startButton");

const scanButton =
    document.getElementById("scanButton");

const stopButton =
    document.getElementById("stopButton");

const databaseButton =
    document.getElementById("databaseButton");

const status =
    document.getElementById("status");

const progressBar =
    document.getElementById("progressBar");

const scanTime =
    document.getElementById("scanTime");

const nameField =
    document.getElementById("nameField");

const gradeField =
    document.getElementById("gradeField");

const sectionField =
    document.getElementById("sectionField");

const lrnField =
    document.getElementById("lrnField");

const idField =
    document.getElementById("idField");

const databaseResult =
    document.getElementById("databaseResult");

const databaseStatus =
    document.getElementById("databaseStatus");

const databaseDetails =
    document.getElementById("databaseDetails");

const rawOCR =
    document.getElementById("rawOCR");


/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */

const DATABASE_URL =
    "https://script.google.com/macros/s/AKfycby8SQH20dz2PK6Covm_GOy4sG1WigvDaxZr8a--gbrI_LBKE1KJoQO7AMzaKZR_3mQ/exec";


/* =========================================================
   OCR WORKER
========================================================= */

let ocrWorker = null;
let ocrWorkerLoading = null;


/* Initialize only once and reuse between scans */

async function getOCRWorker() {

    if (ocrWorker) {
        return ocrWorker;
    }

    if (ocrWorkerLoading) {
        return await ocrWorkerLoading;
    }

    ocrWorkerLoading = (async function() {

        status.textContent =
            "Initializing OCR engine...";

        const worker =
            await Tesseract.createWorker(
                "eng",
                1,
                {
                    logger: function(info) {

                        if (
                            info.status &&
                            info.progress !== undefined
                        ) {

                            const percent =
                                Math.round(info.progress * 100);

                            status.textContent =
                                info.status +
                                " (" + percent + "%)";

                        }

                    }
                }
            );

        await worker.setParameters({
            tessedit_pageseg_mode: "7",
            preserve_interword_spaces: "1"
        });

        ocrWorker = worker;

        return worker;

    })();

    try {

        return await ocrWorkerLoading;

    } finally {

        ocrWorkerLoading = null;

    }

}


/* =========================================================
   CAMERA
========================================================= */

let cameraStream = null;

startButton.addEventListener("click", startCamera);
stopButton.addEventListener("click", stopCamera);
scanButton.addEventListener("click", captureAndScan);
databaseButton.addEventListener("click", checkDatabase);


/* START CAMERA */

async function startCamera() {

    try {

        status.textContent = "Starting camera...";

        cameraStream =
            await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 },
                    frameRate: { ideal: 30 }
                }
            });

        video.srcObject = cameraStream;

        await video.play();

        const track =
            cameraStream.getVideoTracks()[0];

        try {

            await track.applyConstraints({
                width: { ideal: 1920 },
                height: { ideal: 1080 },
                frameRate: { ideal: 30 }
            });

        } catch (constraintError) {

            console.log(
                "Could not apply extra camera constraints:",
                constraintError
            );

        }

        startButton.disabled = true;
        scanButton.disabled = false;
        stopButton.disabled = false;

        status.textContent =
            "Camera ready. Align the entire ID inside the green guide.";

    } catch (error) {

        console.error("CAMERA ERROR:", error);

        status.textContent =
            "Could not access camera: " + error.message;

    }

}


/* STOP CAMERA */

function stopCamera() {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(track => track.stop());

        cameraStream = null;

    }

    video.srcObject = null;

    startButton.disabled = false;
    scanButton.disabled = true;
    stopButton.disabled = true;

    status.textContent = "Camera stopped.";

}


/* =========================================================
   CAPTURE AND SCAN
========================================================= */

async function captureAndScan() {

    if (!cameraStream) {

        alert("Please start the camera first.");

        return;

    }

    const scanStartTime = performance.now();

    scanTime.textContent =
        "⏱ Scan Time: Scanning...";

    scanButton.disabled = true;
    databaseButton.disabled = true;

    databaseResult.style.display = "none";

    progressBar.style.width = "0%";

    status.textContent = "Capturing ID...";

    try {

        await performOCR();

    } catch (error) {

        console.error("SCAN ERROR:", error);

        status.textContent =
            "Scanning failed: " + error.message;

        rawOCR.textContent =
            "OCR ERROR: " + error.message;

    }

    const scanEndTime = performance.now();

    const elapsedSeconds =
        (scanEndTime - scanStartTime) / 1000;

    scanTime.textContent =
        "⏱ Scan Time: " +
        elapsedSeconds.toFixed(2) +
        " seconds";

    scanButton.disabled = false;

}


/* =========================================================
   CAPTURE IMAGE USING THE GREEN GUIDE
   WITH ADDITIONAL MARGINS
========================================================= */

function captureIDImage() {

    const videoWidth = video.videoWidth;
    const videoHeight = video.videoHeight;

    if (!videoWidth || !videoHeight) {

        throw new Error("Camera image is not ready.");

    }

    const videoRect =
        video.getBoundingClientRect();

    const guide =
        document.querySelector(".scan-guide");

    const guideRect =
        guide.getBoundingClientRect();

    if (
        !videoRect.width ||
        !videoRect.height ||
        !guideRect.width ||
        !guideRect.height
    ) {

        throw new Error("Could not calculate the scan area.");

    }


    /*
       Convert the green guide's screen coordinates
       into the original camera image coordinates.
    */

    const scaleX =
        videoWidth / videoRect.width;

    const scaleY =
        videoHeight / videoRect.height;


    /*
       Add margins around the guide.

       This prevents characters close to the edges
       from being removed by the crop.
    */

    const marginX =
        guideRect.width * 0.07;

    const marginY =
        guideRect.height * 0.12;


    let cropX =
        (guideRect.left - videoRect.left - marginX) * scaleX;

    let cropY =
        (guideRect.top - videoRect.top - marginY) * scaleY;

    let cropWidth =
        (guideRect.width + marginX * 2) * scaleX;

    let cropHeight =
        (guideRect.height + marginY * 2) * scaleY;


    /* Keep crop within the actual camera frame */

    cropX = Math.max(0, cropX);
    cropY = Math.max(0, cropY);

    cropWidth =
        Math.min(cropWidth, videoWidth - cropX);

    cropHeight =
        Math.min(cropHeight, videoHeight - cropY);


    if (cropWidth <= 0 || cropHeight <= 0) {

        throw new Error("Invalid camera crop dimensions.");

    }


    /*
       Preserve the crop's aspect ratio.

       The output is enlarged without stretching.
    */

    const outputWidth = 2400;

    const outputHeight =
        Math.round(
            outputWidth * (cropHeight / cropWidth)
        );

    canvas.width = outputWidth;
    canvas.height = outputHeight;

    const ctx =
        canvas.getContext("2d");

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";


    /*
       ORIGINAL COLOR CAPTURE.

       No grayscale.
       No thresholding.
       No binarization.
       No forced 1850 × 617 crop.
       No aggressive sharpening.
       No inversion.
    */

    ctx.drawImage(
        video,
        cropX,
        cropY,
        cropWidth,
        cropHeight,
        0,
        0,
        outputWidth,
        outputHeight
    );


    /* Display captured image */

    processedImage.src =
        canvas.toDataURL("image/png");

    processedImage.style.display = "block";


    /*
       Calculate the green guide's position
       inside the captured image.

       The four text rows are then cropped
       relative to the guide, not the whole image.
    */

    const guideTop =
        (
            (guideRect.top - videoRect.top) * scaleY -
            cropY
        ) / cropHeight * outputHeight;

    const guideHeight =
        guideRect.height * scaleY /
        cropHeight * outputHeight;

    return {
        guideTop: guideTop,
        guideHeight: guideHeight,
        width: outputWidth,
        height: outputHeight
    };

}


/* =========================================================
   CREATE INDIVIDUAL TEXT LINE IMAGES
========================================================= */

function createLineCanvas(
    captureInfo,
    startPercent,
    endPercent
) {

    const guideTop =
        captureInfo.guideTop;

    const guideHeight =
        captureInfo.guideHeight;

    const startY =
        Math.floor(
            guideTop +
            guideHeight * startPercent
        );

    const endY =
        Math.ceil(
            guideTop +
            guideHeight * endPercent
        );

    const y =
        Math.max(0, startY);

    const bottom =
        Math.min(canvas.height, endY);

    const height =
        bottom - y;

    if (height <= 0) {

        throw new Error("Invalid text-line crop.");

    }

    const lineCanvas =
        document.createElement("canvas");

    lineCanvas.width = canvas.width;
    lineCanvas.height = height;

    const ctx =
        lineCanvas.getContext("2d");

    ctx.drawImage(
        canvas,
        0,
        y,
        canvas.width,
        height,
        0,
        0,
        lineCanvas.width,
        lineCanvas.height
    );

    return lineCanvas;

}


/* =========================================================
   RECOGNIZE ONE TEXT LINE
========================================================= */

async function recognizeLine(
    worker,
    lineCanvas,
    whitelist,
    label
) {

    status.textContent =
        "Reading " + label + "...";

    await worker.setParameters({

        tessedit_pageseg_mode: "7",

        preserve_interword_spaces: "1",

        tessedit_char_whitelist: whitelist

    });

    const result =
        await worker.recognize(lineCanvas);

    return {
        text: result.data.text || "",
        confidence: result.data.confidence || 0
    };

}


/* =========================================================
   MAIN OCR PROCESS
========================================================= */

async function performOCR() {

    status.textContent =
        "Capturing ID image with margins...";

    const captureInfo =
        captureIDImage();


    /* Initialize or reuse OCR worker */

    const worker =
        await getOCRWorker();


    /*
       Each text line is processed independently.

       The percentages refer to the green guide area:

       NAME:         6% - 36%
       LRN:         36% - 56%
       ID NUMBER:   55% - 76%
       GRADE:       73% - 98%
    */


    const nameCanvas =
        createLineCanvas(
            captureInfo,
            0.06,
            0.36
        );

    const lrnCanvas =
        createLineCanvas(
            captureInfo,
            0.36,
            0.56
        );

    const idCanvas =
        createLineCanvas(
            captureInfo,
            0.55,
            0.76
        );

    const gradeCanvas =
        createLineCanvas(
            captureInfo,
            0.73,
            0.98
        );


    /* NAME */

    const nameOCR =
        await recognizeLine(
            worker,
            nameCanvas,
            "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz.'- ",
            "student name"
        );


    /* LRN */

    const lrnOCR =
        await recognizeLine(
            worker,
            lrnCanvas,
            "0123456789OQIlLSBGlq ",
            "LRN"
        );


    /* ID NUMBER */

    const idOCR =
        await recognizeLine(
            worker,
            idCanvas,
            "0123456789OQIlLSBGSHJ- ",
            "ID number"
        );


    /* GRADE AND SECTION */

    const gradeOCR =
        await recognizeLine(
            worker,
            gradeCanvas,
            "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-' ",
            "grade and section"
        );


    /*
       Combine the separate results.

       The labels are included to make
       the raw OCR easier to inspect.
    */

    const recognizedText =

        "NAME:\n" +
        nameOCR.text.trim() +

        "\n\nLRN:\n" +
        lrnOCR.text.trim() +

        "\n\nID NUMBER:\n" +
        idOCR.text.trim() +

        "\n\nGRADE AND SECTION:\n" +
        gradeOCR.text.trim();


    console.log(
        "INDIVIDUAL OCR RESULTS:",
        {
            nameOCR,
            lrnOCR,
            idOCR,
            gradeOCR
        }
    );


    rawOCR.textContent =
        recognizedText;


    /* Parse individual fields */

    const bestResults =
        parseOCRLines({
            name: nameOCR.text,
            lrn: lrnOCR.text,
            id: idOCR.text,
            grade: gradeOCR.text
        });


    console.log(
        "FINAL OCR RESULTS:",
        bestResults
    );


    /* Display fields */

    nameField.value =
        bestResults.name;

    gradeField.value =
        bestResults.grade;

    sectionField.value =
        bestResults.section;

    lrnField.value =
        bestResults.lrn;

    idField.value =
        bestResults.id;


    /* Database identification */

    const hasLRN =
        isValidLRN(bestResults.lrn);

    const hasID =
        isValidIDNumber(bestResults.id);

    const hasName =
        bestResults.name.trim().length >= 5;

    const hasGrade =
        bestResults.grade.trim().length > 0;

    if (
        hasLRN ||
        hasID ||
        (hasName && hasGrade)
    ) {

        status.textContent =
            "OCR complete. Identifying student...";

        await checkDatabase();

    } else {

        progressBar.style.width = "100%";

        status.textContent =
            "OCR complete. Some information could not be recognized.";

        databaseButton.disabled = false;

    }

}


/* =========================================================
   FIELD EXTRACTION
========================================================= */

function parseOCRLines(lines) {

    const result = {
        name: "",
        grade: "",
        section: "",
        lrn: "",
        id: ""
    };


    /* NAME */

    result.name =
        cleanName(lines.name);


    /* LRN */

    result.lrn =
        extractLRNFromLine(lines.lrn);


    /* ID NUMBER */

    result.id =
        extractIDFromLine(lines.id);


    /* GRADE AND SECTION */

    const gradeInfo =
        extractGradeAndSection(lines.grade);

    result.grade =
        gradeInfo.grade;

    result.section =
        gradeInfo.section;


    return result;

}


/* =========================================================
   NAME EXTRACTION
========================================================= */

function cleanName(value) {

    let text =
        String(value || "")
            .replace(/\r?\n/g, " ")
            .replace(/\s+/g, " ")
            .trim();

    text =
        text.replace(
            /^(NAME|STUDENT NAME)\s*[:\-]?\s*/i,
            ""
        );

    text =
        text.replace(
            /[^A-Za-zÀ-ÿ.' -]/g,
            ""
        );

    text =
        text.replace(/\s+/g, " ").trim();

    const words =
        text.split(" ").filter(Boolean);

    if (words.length < 2) {
        return "";
    }

    const letterCount =
        (text.match(/[A-Za-zÀ-ÿ]/g) || []).length;

    if (letterCount < 5) {
        return "";
    }

    return text;

}


/* =========================================================
   LRN EXTRACTION
========================================================= */

function extractLRNFromLine(value) {

    let text =
        String(value || "")
            .toUpperCase()
            .trim();

    text =
        text.replace(
            /^.*?\bLRN\b\s*[:#=\-]?\s*/i,
            ""
        );

    /*
       Convert common OCR substitutions.

       These conversions are only applied to
       the LRN line, not to names or sections.
    */

    const cleaned =
        text
            .replace(/[OQ]/g, "0")
            .replace(/[IL|]/g, "1")
            .replace(/S/g, "5")
            .replace(/B/g, "8")
            .replace(/G/g, "6")
            .replace(/[^0-9]/g, "");


    if (cleaned.length === 12) {
        return cleaned;
    }


    /*
       Do not invent missing digits.

       If OCR reads fewer or more than 12 digits,
       leave the field empty rather than guessing.
    */

    return "";

}


/* =========================================================
   ID NUMBER EXTRACTION
========================================================= */

function extractIDFromLine(value) {

    let text =
        String(value || "")
            .toUpperCase()
            .trim();

    text =
        text.replace(
            /^.*?\bID\s*(?:NO|NUMBER)?\s*[:#.\-]?\s*/i,
            ""
        );


    /*
       Expected format:

       305015-397-SHS

       The first and second numeric groups
       are preserved separately.
    */

    const match =
        text.match(
            /([0-9OQILSBG]{3,})\s*[-–— ]\s*([0-9OQILSBG]{2,})\s*[-–— ]?\s*(SHS|JHS|5H5|JH5)?/i
        );

    if (!match) {
        return "";
    }

    const first =
        cleanIDDigits(match[1]);

    const second =
        cleanIDDigits(match[2]);

    if (
        first.length < 3 ||
        second.length < 2
    ) {
        return "";
    }

    let suffix = "";

    if (match[3]) {

        suffix =
            normalizeIDSuffix(match[3]);

    }

    return first + "-" + second +
        (suffix ? "-" + suffix : "");

}


/* =========================================================
   GRADE AND SECTION EXTRACTION
========================================================= */

function extractGradeAndSection(value) {

    let text =
        String(value || "")
            .toUpperCase()
            .replace(/\s+/g, " ")
            .trim();


    /*
       Correct common OCR errors in the grade number.
    */

    text =
        text.replace(
            /\b[I|L]2\b/g,
            "12"
        );

    text =
        text.replace(
            /\bO([0-9])\b/g,
            "0$1"
        );


    const match =
        text.match(
            /GRADE\s*(?:LEVEL)?\s*(7|8|9|10|11|12)\s*[-–—:]?\s*(.*)/i
        );

    if (!match) {

        /*
           Also accept the line when OCR misses
           the word GRADE but recognizes the number.
        */

        const fallback =
            text.match(
                /\b(7|8|9|10|11|12)\s*[-–—:]\s*([A-Z][A-Z0-9 -]*)/i
            );

        if (!fallback) {

            return {
                grade: "",
                section: ""
            };

        }

        return {
            grade: fallback[1],
            section: cleanSection(fallback[2])
        };

    }

    return {

        grade: match[1],

        section: cleanSection(match[2])

    };

}


/* =========================================================
   SECTION CLEANING
========================================================= */

function cleanSection(value) {

    let text =
        String(value || "")
            .toUpperCase()
            .replace(/[^A-Z0-9 -]/g, "")
            .replace(/\s+/g, " ")
            .trim();

    text =
        text.replace(/^[-–—:\s]+/, "");

    text =
        text.replace(/[-–—:\s]+$/, "");

    return text;

}


/* =========================================================
   DIGIT CLEANING
========================================================= */

function cleanIDDigits(value) {

    return String(value)
        .toUpperCase()
        .replace(/[OQ]/g, "0")
        .replace(/[IL|]/g, "1")
        .replace(/B/g, "8")
        .replace(/G/g, "6")
        .replace(/[^0-9]/g, "");

}


/* =========================================================
   ID SUFFIX NORMALIZATION
========================================================= */

function normalizeIDSuffix(value) {

    return String(value)
        .toUpperCase()
        .replace(/5H5/g, "SHS")
        .replace(/JH5/g, "JHS")
        .replace(/[^A-Z]/g, "");

}


/* =========================================================
   ID NUMBER NORMALIZATION
========================================================= */

function normalizeIDNumber(value) {

    const source =
        String(value || "")
            .toUpperCase()
            .trim();

    const match =
        source.match(
            /^([0-9OQILSBG]{3,})[\s\-._]*([0-9OQILSBG]{2,})[\s\-._]*(SHS|JHS|5H5|JH5)?$/
        );

    if (!match) {
        return "";
    }

    const first =
        cleanIDDigits(match[1]);

    const second =
        cleanIDDigits(match[2]);

    if (
        first.length < 3 ||
        second.length < 2
    ) {
        return "";
    }

    const suffix =
        normalizeIDSuffix(match[3] || "");

    return first + second + suffix;

}


/* =========================================================
   VALIDATION
========================================================= */

function isValidLRN(value) {

    return /^\d{12}$/.test(
        String(value || "").trim()
    );

}


function isValidIDNumber(value) {

    return normalizeIDNumber(value).length >= 5;

}


/* =========================================================
   DATABASE CHECK
========================================================= */

async function checkDatabase() {

    const lrn =
        lrnField.value.trim();

    const idNumber =
        idField.value.trim();

    const name =
        nameField.value.trim();

    const grade =
        gradeField.value.trim();

    const section =
        sectionField.value.trim();


    if (
        !isValidLRN(lrn) &&
        !isValidIDNumber(idNumber) &&
        name.length < 5
    ) {

        status.textContent =
            "No usable student information was detected.";

        databaseButton.disabled = false;

        return;

    }


    status.textContent =
        "Identifying student...";

    databaseButton.disabled = true;

    databaseResult.style.display = "none";


    try {

        const params =
            new URLSearchParams({

                lrn: lrn,

                id: idNumber,

                name: name,

                grade: grade,

                section: section

            });


        const url =
            DATABASE_URL + "?" + params.toString();


        console.log(
            "DATABASE REQUEST:",
            url
        );


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "HTTP error: " + response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "DATABASE RESULT:",
            result
        );


        /* SUCCESSFUL DATABASE MATCH */

        if (
            result.success === true &&
            result.match === true &&
            result.student
        ) {

            const student =
                result.student;


            nameField.value =
                String(student.name || "");

            gradeField.value =
                String(student.grade || "");

            sectionField.value =
                String(student.section || "");

            lrnField.value =
                String(student.lrn || "");

            idField.value =
                String(student.idNumber || "");


            databaseResult.style.display =
                "block";

            databaseResult.className =
                "database-result valid";

            databaseStatus.textContent =
                "🟢 VALID STUDENT";


            databaseDetails.innerHTML =

                "<strong>Name:</strong> " +
                escapeHTML(student.name || "") +

                "<br><br>" +

                "<strong>LRN:</strong> " +
                escapeHTML(student.lrn || "") +

                "<br><br>" +

                "<strong>ID Number:</strong> " +
                escapeHTML(student.idNumber || "") +

                "<br><br>" +

                "<strong>Grade:</strong> " +
                escapeHTML(student.grade || "") +

                "<br><br>" +

                "<strong>Section:</strong> " +
                escapeHTML(student.section || "");


            status.textContent =
                "Student identified successfully.";

            progressBar.style.width =
                "100%";

        } else {


            /* STUDENT NOT FOUND */

            databaseResult.style.display =
                "block";

            databaseResult.className =
                "database-result invalid";

            databaseStatus.textContent =
                "🔴 STUDENT NOT FOUND";


            databaseDetails.innerHTML =

                "<strong>Name:</strong> " +
                escapeHTML(name || "Not detected") +

                "<br>" +

                "<strong>LRN:</strong> " +
                escapeHTML(lrn || "Not detected") +

                "<br>" +

                "<strong>ID Number:</strong> " +
                escapeHTML(idNumber || "Not detected") +

                "<br>" +

                "<strong>Grade:</strong> " +
                escapeHTML(grade || "Not detected") +

                "<br>" +

                "<strong>Section:</strong> " +
                escapeHTML(section || "Not detected");


            status.textContent =
                "No matching student.";

        }


    } catch (error) {

        console.error(
            "DATABASE ERROR:",
            error
        );


        databaseResult.style.display =
            "block";

        databaseResult.className =
            "database-result invalid";

        databaseStatus.textContent =
            "⚠️ DATABASE CONNECTION FAILED";


        databaseDetails.innerHTML =

            "Could not connect to Google Apps Script." +

            "<br><br><small>" +

            escapeHTML(error.message) +

            "</small>";


        status.textContent =
            "Database connection failed.";

    } finally {

        databaseButton.disabled = false;

    }

}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
