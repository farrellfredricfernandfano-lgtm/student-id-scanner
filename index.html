<script>


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const lrnCanvas =
    document.getElementById("lrnCanvas");

const sharpenCanvas =
    document.getElementById("sharpenCanvas");

const colorCanvas =
    document.getElementById("colorCanvas");

const processedImage =
    document.getElementById("processedImage");

const startButton =
    document.getElementById("startButton");

const scanButton =
    document.getElementById("scanButton");

const stopButton =
    document.getElementById("stopButton");

const databaseButton =
    document.getElementById("databaseButton");

const status =
    document.getElementById("status");

const progressBar =
    document.getElementById("progressBar");

const nameField =
    document.getElementById("nameField");

const gradeField =
    document.getElementById("gradeField");

const sectionField =
    document.getElementById("sectionField");

const lrnField =
    document.getElementById("lrnField");

const idField =
    document.getElementById("idField");

const databaseResult =
    document.getElementById("databaseResult");

const databaseStatus =
    document.getElementById("databaseStatus");

const databaseDetails =
    document.getElementById("databaseDetails");

const rawOCR =
    document.getElementById("rawOCR");


/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */

const DATABASE_URL =
    "https://script.google.com/macros/s/AKfycby8SQH20dz2PK6Covm_GOy4sG1WigvDaxZr8a--gbrI_LBKE1KJoQO7AMzaKZR_3mQ/exec";


/* =========================================================
   CAMERA
========================================================= */

let cameraStream = null;


startButton.addEventListener(
    "click",
    startCamera
);

stopButton.addEventListener(
    "click",
    stopCamera
);

scanButton.addEventListener(
    "click",
    captureAndScan
);

databaseButton.addEventListener(
    "click",
    checkDatabase
);


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

    try {

        status.textContent =
            "Starting camera...";


        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                audio: false,

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    },

                    frameRate: {
                        ideal: 30
                    }

                }

            });


        video.srcObject =
            cameraStream;


        const track =
            cameraStream.getVideoTracks()[0];


        try {

            await track.applyConstraints({

                width: {
                    ideal: 1920
                },

                height: {
                    ideal: 1080
                }

            });

        }

        catch (constraintError) {

            console.log(
                "Could not apply extra camera constraints:",
                constraintError
            );

        }


        startButton.disabled =
            true;

        scanButton.disabled =
            false;

        stopButton.disabled =
            false;


        status.textContent =
            "Camera ready. Align the entire ID inside the green guide.";

    }

    catch (error) {

        console.error(
            "CAMERA ERROR:",
            error
        );

        status.textContent =
            "Could not access camera: " +
            error.message;

    }

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera() {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        cameraStream = null;

    }


    video.srcObject =
        null;


    startButton.disabled =
        false;

    scanButton.disabled =
        true;

    stopButton.disabled =
        true;


    status.textContent =
        "Camera stopped.";

}


/* =========================================================
   CAPTURE + SCAN
========================================================= */

async function captureAndScan() {

    if (!cameraStream) {

        alert(
            "Please start the camera first."
        );

        return;

    }


    scanButton.disabled =
        true;

    databaseButton.disabled =
        true;


    databaseResult.style.display =
        "none";


    progressBar.style.width =
        "0%";


    status.textContent =
        "Capturing ID...";


    try {

        await performOCR();

    }

    catch (error) {

        console.error(
            "SCAN ERROR:",
            error
        );

        status.textContent =
            "Scanning failed: " +
            error.message;

    }


    scanButton.disabled =
        false;

}


/* =========================================================
   IMAGE PREPROCESSING
   ORIGINAL WORKING VERSION
========================================================= */

function preprocessCanvas(
    sourceCanvas,
    contrast = 1.35
) {

    const ctx =
        sourceCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    const imageData =
        ctx.getImageData(
            0,
            0,
            sourceCanvas.width,
            sourceCanvas.height
        );


    const data =
        imageData.data;


    const factor =
        (259 * (contrast + 255)) /
        (255 * (259 - contrast));


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r =
            data[i];

        const g =
            data[i + 1];

        const b =
            data[i + 2];


        /*
         * Grayscale
         */

        let gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;


        /*
         * Contrast
         */

        gray =
            factor *
            (gray - 128) +
            128;


        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );


        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );

}


/* =========================================================
   CREATE COPY OF CANVAS
========================================================= */

function copyCanvas(
    sourceCanvas,
    destinationCanvas
) {

    destinationCanvas.width =
        sourceCanvas.width;

    destinationCanvas.height =
        sourceCanvas.height;


    const ctx =
        destinationCanvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        destinationCanvas.width,
        destinationCanvas.height
    );

    ctx.drawImage(
        sourceCanvas,
        0,
        0
    );

}


/* =========================================================
   MILD SHARPENING
   ONLY FOR OCR PASS 2
========================================================= */

function applyMildSharpen(
    sourceCanvas,
    destinationCanvas
) {

    destinationCanvas.width =
        sourceCanvas.width;

    destinationCanvas.height =
        sourceCanvas.height;


    const sourceCtx =
        sourceCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    const destinationCtx =
        destinationCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    const imageData =
        sourceCtx.getImageData(
            0,
            0,
            sourceCanvas.width,
            sourceCanvas.height
        );


    const source =
        imageData.data;


    const output =
        destinationCtx.createImageData(
            sourceCanvas.width,
            sourceCanvas.height
        );


    const target =
        output.data;


    const width =
        sourceCanvas.width;

    const height =
        sourceCanvas.height;


    /*
     * VERY LIGHT sharpening kernel.
     *
     * This is intentionally much weaker
     * than the previous aggressive version.
     */

    const kernel = [
        0, -1, 0,
       -1,  5, -1,
        0, -1, 0
    ];


    for (
        let y = 1;
        y < height - 1;
        y++
    ) {

        for (
            let x = 1;
            x < width - 1;
            x++
        ) {

            let sum =
                0;


            for (
                let ky = -1;
                ky <= 1;
                ky++
            ) {

                for (
                    let kx = -1;
                    kx <= 1;
                    kx++
                ) {

                    const index =
                        (
                            (y + ky) *
                            width +
                            (x + kx)
                        ) * 4;


                    const weight =
                        kernel[
                            (ky + 1) * 3 +
                            (kx + 1)
                        ];


                    sum +=
                        source[index] *
                        weight;

                }

            }


            const outputIndex =
                (
                    y * width +
                    x
                ) * 4;


            const value =
                Math.max(
                    0,
                    Math.min(
                        255,
                        sum
                    )
                );


            target[outputIndex] =
                value;

            target[outputIndex + 1] =
                value;

            target[outputIndex + 2] =
                value;

            target[outputIndex + 3] =
                255;

        }

    }


    /*
     * Copy border pixels unchanged.
     */

    for (
        let x = 0;
        x < width;
        x++
    ) {

        for (
            const y of [0, height - 1]
        ) {

            const index =
                (
                    y * width +
                    x
                ) * 4;


            target[index] =
                source[index];

            target[index + 1] =
                source[index + 1];

            target[index + 2] =
                source[index + 2];

            target[index + 3] =
                255;

        }

    }


    for (
        let y = 0;
        y < height;
        y++
    ) {

        for (
            const x of [0, width - 1]
        ) {

            const index =
                (
                    y * width +
                    x
                ) * 4;


            target[index] =
                source[index];

            target[index + 1] =
                source[index + 1];

            target[index + 2] =
                source[index + 2];

            target[index + 3] =
                255;

        }

    }


    destinationCtx.putImageData(
        output,
        0,
        0
    );

}


/* =========================================================
   OCR FUNCTION
========================================================= */

async function runOCR(
    sourceCanvas,
    passName,
    progressStart,
    progressEnd
) {

    console.log(
        "================================="
    );

    console.log(
        "STARTING OCR:",
        passName
    );

    console.log(
        "================================="
    );


    status.textContent =
        "OCR " + passName + "...";


    const result =
        await Tesseract.recognize(

            sourceCanvas,

            "eng",

            {

                logger: function(info) {

                    console.log(
                        passName,
                        info
                    );


                    if (
                        info.progress !== undefined
                    ) {

                        const progress =
                            progressStart +
                            (
                                info.progress *
                                (
                                    progressEnd -
                                    progressStart
                                )
                            );


                        progressBar.style.width =
                            progress + "%";

                    }


                    if (
                        info.status
                    ) {

                        status.textContent =
                            passName +
                            ": " +
                            info.status;

                    }

                },

                tessedit_pageseg_mode: 6,

                preserve_interword_spaces: 1

            }

        );


    const text =
        result.data.text || "";


    console.log(
        passName + " RESULT:",
        text
    );


    return text;

}


/* =========================================================
   MAIN OCR
========================================================= */

async function performOCR() {

    status.textContent =
        "Preparing ID image...";


    const videoWidth =
        video.videoWidth;

    const videoHeight =
        video.videoHeight;


    if (
        !videoWidth ||
        !videoHeight
    ) {

        throw new Error(
            "Camera image is not ready."
        );

    }


    /* =====================================================
       CARD CROP
    ===================================================== */

    const cropWidth =
        videoWidth * 0.88;


    const cropHeight =
        cropWidth / 1.586;


    let finalCropWidth =
        cropWidth;

    let finalCropHeight =
        cropHeight;


    if (
        finalCropHeight >
        videoHeight * 0.92
    ) {

        finalCropHeight =
            videoHeight * 0.92;

        finalCropWidth =
            finalCropHeight * 1.586;

    }


    const cropX =
        (videoWidth -
            finalCropWidth) / 2;


    const cropY =
        (videoHeight -
            finalCropHeight) / 2;


    /* =====================================================
       UPSCALE
    ===================================================== */

    const scale =
        2;


    canvas.width =
        Math.round(
            finalCropWidth * scale
        );

    canvas.height =
        Math.round(
            finalCropHeight * scale
        );


    const ctx =
        canvas.getContext("2d");


    ctx.imageSmoothingEnabled =
        true;

    ctx.imageSmoothingQuality =
        "high";


    /*
     * Draw original color image.
     */

    ctx.drawImage(

        video,

        cropX,
        cropY,

        finalCropWidth,
        finalCropHeight,

        0,
        0,

        canvas.width,
        canvas.height

    );


    /*
     * =====================================================
     * SAVE ORIGINAL COLOR CROP
     * =====================================================
     */

    copyCanvas(
        canvas,
        colorCanvas
    );


    /*
     * =====================================================
     * PASS 1 IMAGE
     * =====================================================
     *
     * This is your ORIGINAL working
     * preprocessing.
     */

    preprocessCanvas(
        canvas,
        1.35
    );


    /*
     * Show the original working
     * processed image.
     */

    processedImage.src =
        canvas.toDataURL(
            "image/png"
        );

    processedImage.style.display =
        "block";


    /* =====================================================
       OCR PASS 1
    ===================================================== */

    const textPass1 =
        await runOCR(
            canvas,
            "Pass 1 — Original",
            0,
            30
        );


    /*
     * Parse Pass 1 first.
     */

    parseOCR(
        textPass1
    );


    /*
     * Save whatever Pass 1 successfully
     * detected.
     */

    let bestResults = {

        name:
            nameField.value,

        grade:
            gradeField.value,

        section:
            sectionField.value,

        lrn:
            lrnField.value,

        id:
            idField.value

    };


    /* =====================================================
       OCR PASS 2
    ===================================================== */

    status.textContent =
        "Preparing second OCR pass...";


    applyMildSharpen(
        canvas,
        sharpenCanvas
    );


    const textPass2 =
        await runOCR(
            sharpenCanvas,
            "Pass 2 — Mild Sharpen",
            30,
            60
        );


    /*
     * Parse Pass 2 temporarily.
     */

    parseOCR(
        textPass2
    );


    /*
     * Only use Pass 2 to fill
     * missing information.
     */

    bestResults =
        mergeOCRResults(
            bestResults
        );


    /* =====================================================
       OCR PASS 3
    ===================================================== */

    const textPass3 =
        await runOCR(
            colorCanvas,
            "Pass 3 — Original Color",
            60,
            90
        );


    /*
     * Parse Pass 3 temporarily.
     */

    parseOCR(
        textPass3
    );


    /*
     * Again, only fill fields
     * that are still missing.
     */

    bestResults =
        mergeOCRResults(
            bestResults
        );


    /* =====================================================
       RESTORE BEST RESULTS
    ===================================================== */

    nameField.value =
        bestResults.name;

    gradeField.value =
        bestResults.grade;

    sectionField.value =
        bestResults.section;

    lrnField.value =
        bestResults.lrn;

    idField.value =
        bestResults.id;


    /* =====================================================
       RAW OCR DISPLAY
    ===================================================== */

    rawOCR.textContent =

        "[OCR PASS 1 — ORIGINAL]\n\n" +

        (
            textPass1 ||
            "No text detected."
        ) +

        "\n\n" +

        "====================================\n\n" +

        "[OCR PASS 2 — MILD SHARPEN]\n\n" +

        (
            textPass2 ||
            "No text detected."
        ) +

        "\n\n" +

        "====================================\n\n" +

        "[OCR PASS 3 — ORIGINAL COLOR]\n\n" +

        (
            textPass3 ||
            "No text detected."
        );


    /* =====================================================
       TARGETED LRN OCR
    ===================================================== */

    /*
     * If all three passes failed to
     * produce a valid LRN, use the
     * targeted LRN scan.
     */

    if (
        !isValidLRN(
            lrnField.value
        )
    ) {

        status.textContent =
            "Improving LRN recognition...";


        const targetedLRN =
            await performTargetedLRNOCR(
                canvas
            );


        if (
            isValidLRN(
                targetedLRN
            )
        ) {

            lrnField.value =
                targetedLRN;


            rawOCR.textContent +=

                "\n\n" +

                "====================================\n\n" +

                "[TARGETED LRN OCR]\n\n" +

                targetedLRN;

        }

    }


    progressBar.style.width =
        "100%";


    /* =====================================================
       DATABASE
    ===================================================== */

    if (
        isValidLRN(
            lrnField.value
        )
    ) {

        status.textContent =
            "OCR complete. Checking database...";


        await checkDatabase();

    }

    else {

        status.textContent =
            "OCR complete. LRN could not be confidently detected.";


        databaseButton.disabled =
            false;

    }

}


/* =========================================================
   MERGE OCR RESULTS
========================================================= */

function mergeOCRResults(
    bestResults
) {

    /*
     * At this point parseOCR()
     * has already populated the
     * normal fields using the
     * current OCR pass.
     *
     * We only copy a result when
     * the previous best result was
     * empty.
     */


    if (
        !bestResults.name &&
        nameField.value
    ) {

        bestResults.name =
            nameField.value;

    }


    if (
        !bestResults.grade &&
        gradeField.value
    ) {

        bestResults.grade =
            gradeField.value;

    }


    if (
        !bestResults.section &&
        sectionField.value
    ) {

        bestResults.section =
            sectionField.value;

    }


    /*
     * LRN gets special protection.
     *
     * A valid LRN from an earlier
     * pass should never be replaced
     * by a questionable result.
     */

    if (
        !isValidLRN(
            bestResults.lrn
        ) &&
        isValidLRN(
            lrnField.value
        )
    ) {

        bestResults.lrn =
            lrnField.value;

    }


    if (
        !bestResults.id &&
        idField.value
    ) {

        bestResults.id =
            idField.value;

    }


    return bestResults;

}


/* =========================================================
   TARGETED LRN OCR
========================================================= */

async function performTargetedLRNOCR(
    fullCanvas
) {

    const width =
        fullCanvas.width;

    const height =
        fullCanvas.height;


    /*
     * The LRN is normally the
     * second line on the ID.
     */

    const x =
        width * 0.05;


    const y =
        height * 0.25;


    const cropWidth =
        width * 0.90;


    const cropHeight =
        height * 0.18;


    /*
     * Extra enlargement for digits.
     */

    const scale =
        3;


    lrnCanvas.width =
        Math.round(
            cropWidth * scale
        );

    lrnCanvas.height =
        Math.round(
            cropHeight * scale
        );


    const ctx =
        lrnCanvas.getContext("2d");


    ctx.imageSmoothingEnabled =
        true;

    ctx.imageSmoothingQuality =
        "high";


    ctx.drawImage(

        fullCanvas,

        x,
        y,

        cropWidth,
        cropHeight,

        0,
        0,

        lrnCanvas.width,
        lrnCanvas.height

    );


    /*
     * Stronger contrast specifically
     * for the LRN.
     */

    preprocessCanvas(
        lrnCanvas,
        1.6
    );


    console.log(
        "Running targeted LRN OCR..."
    );


    const result =
        await Tesseract.recognize(

            lrnCanvas,

            "eng",

            {

                logger: function(info) {

                    console.log(
                        "LRN OCR:",
                        info
                    );

                },

                tessedit_pageseg_mode: 7,

                tessedit_char_whitelist:
                    "LRN:0123456789"

            }

        );


    const text =
        result.data.text;


    console.log(
        "TARGETED LRN RESULT:",
        text
    );


    return extractBestLRN(
        text
    );

}


/* =========================================================
   OCR PARSING
========================================================= */

function parseOCR(text) {

    /*
     * Clear fields.
     */

    nameField.value =
        "";

    gradeField.value =
        "";

    sectionField.value =
        "";

    lrnField.value =
        "";

    idField.value =
        "";


    const lines =
        text
            .split(/\r?\n/)
            .map(
                line =>
                    line.trim()
            )
            .filter(
                line =>
                    line.length > 0
            );


    /* =====================================================
       LRN
    ===================================================== */

    const lrn =
        extractBestLRN(text);


    if (
        isValidLRN(lrn)
    ) {

        lrnField.value =
            lrn;

    }


    /* =====================================================
       ID NUMBER
    ===================================================== */

    let idMatch =
        text.match(

            /ID\s*(?:NO|NUMBER)?\s*[:#.\\-]?\s*([0-9]{3,})\s*[-–—]\s*([0-9]{2,})\s*[-–—]?\s*([A-Za-z]{0,5})/i

        );


    if (idMatch) {

        let id =
            idMatch[1] +
            "-" +
            idMatch[2];


        if (
            idMatch[3]
        ) {

            id +=
                "-" +
                idMatch[3]
                    .toUpperCase();

        }


        idField.value =
            id;

    }

    else {

        const fallbackID =
            text.match(

                /\b([0-9]{5,})\s*[-–—]\s*([0-9]{2,})\s*[-–—]?\s*(SHS|JHS)?\b/i

            );


        if (fallbackID) {

            idField.value =
                fallbackID[1] +
                "-" +
                fallbackID[2];


            if (
                fallbackID[3]
            ) {

                idField.value +=
                    "-" +
                    fallbackID[3]
                        .toUpperCase();

            }

        }

    }


    /* =====================================================
       GRADE + SECTION
    ===================================================== */

    let gradeMatch =
        text.match(

            /GRADE\s*(?:LEVEL)?\s*(7|8|9|10|11|12)\s*[-–—:]?\s*([A-Za-z0-9][A-Za-z0-9 .'-]*)/i

        );


    if (gradeMatch) {

        gradeField.value =
            gradeMatch[1];


        sectionField.value =
            cleanSection(
                gradeMatch[2]
            );

    }


    /*
     * Fallback for OCR mistakes such as:
     *
     * GRADEE
     * GIRADDE
     * GRADE2
     */

    if (
        !gradeField.value
    ) {

        const fallbackGrade =
            text.match(

                /\b(?:G[A-Z]*R[A-Z]*D[A-Z]*E?)\s*[^0-9]{0,3}(7|8|9|10|11|12)\s*[-–—:]?\s*([A-Za-z0-9 .'-]+)/i

            );


        if (fallbackGrade) {

            gradeField.value =
                fallbackGrade[1];


            sectionField.value =
                cleanSection(
                    fallbackGrade[2]
                );

        }

    }


    /* =====================================================
       NAME
    ===================================================== */

    for (
        const line of lines
    ) {

        const upper =
            line.toUpperCase();


        if (
            upper.includes("LRN") ||
            upper.includes("ID NO") ||
            upper.includes("ID NUMBER") ||
            upper.includes("GRADE") ||
            upper.includes("SECTION")
        ) {

            continue;

        }


        const cleaned =
            line

                .replace(
                    /[^A-Za-zÀ-ÿ.' -]/g,
                    ""
                )

                .replace(
                    /\s+/g,
                    " "
                )

                .trim();


        const words =
            cleaned
                .split(" ")
                .filter(
                    word =>
                        word.length > 0
                );


        if (
            words.length >= 2 &&
            cleaned.length >= 5
        ) {

            nameField.value =
                cleaned;

            break;

        }

    }


    console.log(
        "PARSED NAME:",
        nameField.value
    );

    console.log(
        "PARSED GRADE:",
        gradeField.value
    );

    console.log(
        "PARSED SECTION:",
        sectionField.value
    );

    console.log(
        "PARSED LRN:",
        lrnField.value
    );

    console.log(
        "PARSED ID:",
        idField.value
    );

}


/* =========================================================
   LRN EXTRACTION
========================================================= */

function extractBestLRN(text) {

    /*
     * First try the normal LRN pattern.
     */

    let match =
        text.match(

            /LRN\s*[:#=\-]?\s*([0-9][0-9\s]{10,18})/i

        );


    if (match) {

        const digits =
            cleanDigits(
                match[1]
            );


        if (
            isValidLRN(digits)
        ) {

            return digits;

        }

    }


    /*
     * OCR sometimes reads:
     *
     * LRN -> TRN
     * LRN -> RNN
     * LRN -> LNN
     */

    match =
        text.match(

            /\b[A-Z]{2,4}\s*[:#=\-]?\s*([0-9][0-9\s]{10,18})\b/i

        );


    if (match) {

        const digits =
            cleanDigits(
                match[1]
            );


        if (
            isValidLRN(digits)
        ) {

            return digits;

        }

    }


    /*
     * Last fallback:
     *
     * Search for any 12-digit sequence.
     */

    const digitGroups =
        text.match(
            /[0-9][0-9\s]{10,18}/g
        );


    if (
        digitGroups
    ) {

        for (
            const group of digitGroups
        ) {

            const digits =
                cleanDigits(
                    group
                );


            if (
                isValidLRN(digits)
            ) {

                return digits;

            }

        }

    }


    return "";

}


/* =========================================================
   CLEAN LRN
========================================================= */

function cleanDigits(value) {

    return String(value)

        .replace(
            /[OoQq]/g,
            "0"
        )

        .replace(
            /[IiLl|]/g,
            "1"
        )

        .replace(
            /[Ss]/g,
            "5"
        )

        .replace(
            /[Bb]/g,
            "8"
        )

        .replace(
            /[Gg]/g,
            "6"
        )

        .replace(
            /[^0-9]/g,
            ""
        );

}


/* =========================================================
   LRN VALIDATION
========================================================= */

function isValidLRN(lrn) {

    return /^\d{12}$/.test(
        String(lrn).trim()
    );

}


/* =========================================================
   CLEAN SECTION
========================================================= */

function cleanSection(section) {

    return String(section)

        .replace(
            /\s+/g,
            " "
        )

        .replace(
            /^[\-–—:\s]+/,
            ""
        )

        .trim();

}


/* =========================================================
   DATABASE CHECK
========================================================= */

async function checkDatabase() {

    const lrn =
        lrnField.value
            .trim();


    if (
        !isValidLRN(lrn)
    ) {

        status.textContent =
            "No valid 12-digit LRN was detected.";

        databaseButton.disabled =
            false;

        return;

    }


    if (
        DATABASE_URL.includes(
            "PASTE_YOUR"
        )
    ) {

        alert(
            "Apps Script URL has not been entered."
        );

        databaseButton.disabled =
            false;

        return;

    }


    status.textContent =
        "Checking Google Sheets...";


    databaseButton.disabled =
        true;


    databaseResult.style.display =
        "none";


    try {

        const url =
            DATABASE_URL +
            "?lrn=" +
            encodeURIComponent(
                lrn
            );


        console.log(
            "DATABASE REQUEST:",
            url
        );


        const response =
            await fetch(url);


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP error: " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "DATABASE RESULT:",
            result
        );


        /*
         * STUDENT FOUND
         */

        if (
            result.match === true
        ) {

            databaseResult.style.display =
                "block";

            databaseResult.className =
                "database-result valid";


            databaseStatus.textContent =
                "🟢 VALID STUDENT";


            databaseDetails.innerHTML =

                "<strong>Name:</strong> " +
                escapeHTML(
                    result.student.name
                ) +

                "<br><br>" +

                "<strong>LRN:</strong> " +
                escapeHTML(
                    result.student.lrn
                ) +

                "<br><br>" +

                "<strong>ID Number:</strong> " +
                escapeHTML(
                    result.student.idNumber
                ) +

                "<br><br>" +

                "<strong>Grade:</strong> " +
                escapeHTML(
                    result.student.grade
                ) +

                "<br><br>" +

                "<strong>Section:</strong> " +
                escapeHTML(
                    result.student.section
                );


            status.textContent =
                "Student identified successfully.";

        }


        /*
         * STUDENT NOT FOUND
         */

        else {

            databaseResult.style.display =
                "block";

            databaseResult.className =
                "database-result invalid";


            databaseStatus.textContent =
                "🔴 STUDENT NOT FOUND";


            databaseDetails.innerHTML =

                "<strong>Scanned LRN:</strong> " +
                escapeHTML(
                    lrn
                ) +

                "<br><br>" +

                "This LRN was not found " +
                "in the student database.";


            status.textContent =
                "No matching student.";

        }

    }


    catch (error) {

        console.error(
            "DATABASE ERROR:",
            error
        );


        databaseResult.style.display =
            "block";

        databaseResult.className =
            "database-result invalid";


        databaseStatus.textContent =
            "⚠️ DATABASE CONNECTION FAILED";


        databaseDetails.innerHTML =

            "Could not connect to Google Apps Script." +

            "<br><br>" +

            "<small>" +

            escapeHTML(
                error.message
            ) +

            "</small>";


        status.textContent =
            "Database connection failed.";

    }


    finally {

        databaseButton.disabled =
            false;

    }

}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
