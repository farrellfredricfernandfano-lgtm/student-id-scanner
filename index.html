<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Student ID Scanner</title>


<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: #111;

    color: white;

    font-family: Arial, sans-serif;

    text-align: center;

}


header {

    padding: 15px;

    background: #1b1b1b;

}


header h1 {

    margin: 0;

    font-size: 22px;

}


header p {

    margin: 5px 0;

    color: #aaa;

}


/* =========================================
   CAMERA
========================================= */

#cameraContainer {

    position: relative;

    width: 100%;

    height: 60vh;

    min-height: 350px;

    background: black;

    overflow: hidden;

}


#video {

    width: 100%;

    height: 100%;

    object-fit: cover;

}


#scanGuide {

    position: absolute;

    width: 88%;

    max-width: 520px;

    aspect-ratio: 1.586 / 1;

    top: 50%;

    left: 50%;

    transform: translate(-50%, -50%);

    border: 3px solid #00ff88;

    border-radius: 12px;

    box-shadow:
        0 0 0 9999px
        rgba(0,0,0,0.45);

    pointer-events: none;

}


#guideText {

    position: absolute;

    top: calc(50% + 130px);

    left: 50%;

    transform: translateX(-50%);

    width: 100%;

    font-size: 14px;

    text-shadow:
        0 1px 4px black;

    pointer-events: none;

}


/* =========================================
   BUTTONS
========================================= */

#controls {

    padding: 15px;

    background: #1b1b1b;

}


button {

    border: none;

    border-radius: 10px;

    padding: 14px 20px;

    margin: 5px;

    font-size: 16px;

    font-weight: bold;

}


#startButton {

    background: #2196f3;

    color: white;

}


#scanButton {

    background: #00c853;

    color: white;

}


#stopButton {

    background: #f44336;

    color: white;

}


#databaseButton {

    background: #ff9800;

    color: white;

}


button:disabled {

    background: #555;

    color: #999;

}


#status {

    margin: 10px;

    color: #00ff88;

}


/* =========================================
   PROGRESS
========================================= */

#progressContainer {

    display: none;

    width: 90%;

    max-width: 500px;

    height: 10px;

    margin: 10px auto;

    background: #333;

    border-radius: 10px;

    overflow: hidden;

}


#progressBar {

    width: 0%;

    height: 100%;

    background: #00ff88;

}


/* =========================================
   RESULTS
========================================= */

#results {

    background: #f4f4f4;

    color: #111;

    padding: 20px;

}


#processedImage {

    display: none;

    width: 100%;

    max-width: 700px;

    margin: 10px auto;

    border-radius: 10px;

}


#ocrResult {

    background: white;

    padding: 15px;

    border-radius: 10px;

    text-align: left;

    white-space: pre-wrap;

    word-break: break-word;

}


/* =========================================
   FIELDS
========================================= */

.field {

    background: white;

    margin: 10px 0;

    padding: 12px;

    border-radius: 8px;

    text-align: left;

}


.field label {

    display: block;

    font-size: 12px;

    color: #777;

    margin-bottom: 5px;

}


.field input {

    width: 100%;

    border: none;

    outline: none;

    font-size: 17px;

    background: transparent;

    color: #111;

}


/* =========================================
   DATABASE RESULT
========================================= */

#databaseResult {

    margin-top: 20px;

    padding: 20px;

    border-radius: 12px;

    background: white;

    text-align: left;

    display: none;

}


.valid {

    border: 4px solid #00c853;

}


.invalid {

    border: 4px solid #f44336;

}


#databaseResult h2 {

    margin-top: 0;

}


#databaseStatus {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 15px;

}


/* =========================================
   CANVAS
========================================= */

#canvas {

    display: none;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    #cameraContainer {

        height: 60vh;

    }


    button {

        width: 90%;

        max-width: 400px;

    }

}

</style>

</head>


<body>


<header>

<h1>Student ID Scanner</h1>

<p>Place the ID inside the guide</p>

</header>


<!-- =========================================
     CAMERA
========================================= -->

<div id="cameraContainer">

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>


    <div id="scanGuide"></div>


    <div id="guideText">

        Align the entire ID inside the box

    </div>

</div>


<!-- =========================================
     CONTROLS
========================================= -->

<div id="controls">

    <button id="startButton">

        📷 Start Camera

    </button>


    <button
        id="scanButton"
        disabled>

        🔍 Scan ID

    </button>


    <button
        id="stopButton"
        disabled>

        ⛔ Stop Camera

    </button>


    <button
        id="databaseButton"
        disabled>

        🔎 Check Database

    </button>


    <div id="status">

        Camera not started.

    </div>


    <div id="progressContainer">

        <div id="progressBar"></div>

    </div>

</div>


<!-- =========================================
     RESULTS
========================================= -->

<div id="results">


<h2>Processed Image</h2>


<img
    id="processedImage">


<h2>OCR Result</h2>


<div id="ocrResult">

    Nothing scanned yet.

</div>


<h2>Extracted Information</h2>


<div class="field">

<label>NAME</label>

<input
    id="nameField"
    type="text"
    placeholder="Not detected">

</div>


<div class="field">

<label>GRADE LEVEL</label>

<input
    id="gradeField"
    type="text"
    placeholder="Not detected">

</div>


<div class="field">

<label>SECTION</label>

<input
    id="sectionField"
    type="text"
    placeholder="Not detected">

</div>


<div class="field">

<label>LRN</label>

<input
    id="lrnField"
    type="text"
    placeholder="Not detected">

</div>


<div class="field">

<label>ID NUMBER</label>

<input
    id="idField"
    type="text"
    placeholder="Not detected">

</div>


<!-- =========================================
     DATABASE RESULT
========================================= -->

<div id="databaseResult">

    <div id="databaseStatus"></div>

    <div id="databaseDetails"></div>

</div>


</div>


<canvas id="canvas"></canvas>


<script>


/* =========================================
   GOOGLE APPS SCRIPT URL
=========================================

   REPLACE THIS WITH YOUR WEB APP URL.

========================================= */

const DATABASE_URL =
    "https://script.google.com/macros/s/AKfycbwq3oERBG-sxPTa45MfKwvTIvIoV5efkLLJQEYxzHQ-ei-cuiVANNSgt0RDX6esPZpP/exec";



/* =========================================
   ELEMENTS
========================================= */

const video =
    document.getElementById("video");


const canvas =
    document.getElementById("canvas");


const startButton =
    document.getElementById("startButton");


const scanButton =
    document.getElementById("scanButton");


const stopButton =
    document.getElementById("stopButton");


const databaseButton =
    document.getElementById(
        "databaseButton"
    );


const status =
    document.getElementById("status");


const processedImage =
    document.getElementById(
        "processedImage"
    );


const ocrResult =
    document.getElementById(
        "ocrResult"
    );


const progressContainer =
    document.getElementById(
        "progressContainer"
    );


const progressBar =
    document.getElementById(
        "progressBar"
    );


const nameField =
    document.getElementById(
        "nameField"
    );


const gradeField =
    document.getElementById(
        "gradeField"
    );


const sectionField =
    document.getElementById(
        "sectionField"
    );


const lrnField =
    document.getElementById(
        "lrnField"
    );


const idField =
    document.getElementById(
        "idField"
    );


const databaseResult =
    document.getElementById(
        "databaseResult"
    );


const databaseStatus =
    document.getElementById(
        "databaseStatus"
    );


const databaseDetails =
    document.getElementById(
        "databaseDetails"
    );



/* =========================================
   CAMERA
========================================= */

let cameraStream = null;

let scanning = false;



startButton.addEventListener(
    "click",
    startCamera
);



async function startCamera() {

    try {

        status.textContent =
            "Requesting camera permission...";


        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio: false,

                    video: {

                        facingMode: {
                            ideal: "environment"
                        },

                        width: {
                            ideal: 1920
                        },

                        height: {
                            ideal: 1080
                        }

                    }

                });


        video.srcObject =
            cameraStream;


        await video.play();


        status.textContent =
            "Camera ready. Align the ID.";


        startButton.disabled =
            true;


        scanButton.disabled =
            false;


        stopButton.disabled =
            false;

    }


    catch (error) {

        console.error(error);


        status.textContent =
            "Camera error: " +
            error.name;


        alert(
            "Camera error:\n\n" +
            error.name +
            "\n\n" +
            error.message
        );

    }

}



/* =========================================
   STOP CAMERA
========================================= */

stopButton.addEventListener(
    "click",
    stopCamera
);



function stopCamera() {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

    }


    cameraStream =
        null;


    video.srcObject =
        null;


    startButton.disabled =
        false;


    scanButton.disabled =
        true;


    stopButton.disabled =
        true;


    status.textContent =
        "Camera stopped.";

}



/* =========================================
   SCAN
========================================= */

scanButton.addEventListener(
    "click",
    captureAndScan
);



async function captureAndScan() {

    if (
        !cameraStream ||
        scanning
    ) {

        return;

    }


    scanning =
        true;


    scanButton.disabled =
        true;


    databaseButton.disabled =
        true;


    databaseResult.style.display =
        "none";


    status.textContent =
        "Capturing image...";


    try {

        const videoWidth =
            video.videoWidth;


        const videoHeight =
            video.videoHeight;


        if (
            !videoWidth ||
            !videoHeight
        ) {

            throw new Error(
                "Camera image is not ready."
            );

        }


        /*
         * Crop center area.
         */

        const cropWidth =
            Math.floor(
                videoWidth * 0.88
            );


        const cropHeight =
            Math.floor(
                cropWidth / 1.586
            );


        const cropX =
            Math.floor(
                (videoWidth -
                    cropWidth) / 2
            );


        const cropY =
            Math.floor(
                (videoHeight -
                    cropHeight) / 2
            );


        /*
         * Upscale image.
         */

        const scale =
            2;


        canvas.width =
            cropWidth * scale;


        canvas.height =
            cropHeight * scale;


        const ctx =
            canvas.getContext("2d");


        ctx.drawImage(

            video,

            cropX,
            cropY,

            cropWidth,
            cropHeight,

            0,
            0,

            canvas.width,
            canvas.height

        );


        status.textContent =
            "Improving image...";


        preprocessImage(

            ctx,

            canvas.width,

            canvas.height

        );


        /*
         * Show processed image.
         */

        processedImage.src =
            canvas.toDataURL(
                "image/jpeg",
                0.95
            );


        processedImage.style.display =
            "block";


        /*
         * OCR
         */

        await performOCR();

    }


    catch (error) {

        console.error(error);


        status.textContent =
            "Scan failed.";


        ocrResult.textContent =
            "Scan Error:\n\n" +
            error.message;

    }


    scanButton.disabled =
        false;


    scanning =
        false;

}



/* =========================================
   IMAGE PREPROCESSING
========================================= */

function preprocessImage(
    ctx,
    width,
    height
) {

    const imageData =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    const data =
        imageData.data;


    /*
     * Grayscale.
     */

    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r =
            data[i];


        const g =
            data[i + 1];


        const b =
            data[i + 2];


        const gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;


        data[i] =
            gray;


        data[i + 1] =
            gray;


        data[i + 2] =
            gray;

    }


    /*
     * Contrast.
     */

    const contrast =
        1.5;


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        let value =
            data[i];


        value =
            (
                value - 128
            ) *
            contrast +
            128;


        value =
            Math.max(
                0,
                Math.min(
                    255,
                    value
                )
            );


        data[i] =
            value;


        data[i + 1] =
            value;


        data[i + 2] =
            value;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );

}



/* =========================================
   OCR
========================================= */

async function performOCR() {

    status.textContent =
        "Starting OCR...";


    ocrResult.textContent =
        "Reading ID...";


    progressContainer.style.display =
        "block";


    progressBar.style.width =
        "0%";


    try {

        const result =
            await Tesseract.recognize(

                canvas,

                "eng",

                {

                    logger:
                    function(info) {

                        console.log(info);


                        if (
                            info.status ===
                            "recognizing text"
                        ) {

                            const percent =
                                Math.round(
                                    info.progress *
                                    100
                                );


                            progressBar.style.width =
                                percent + "%";


                            status.textContent =
                                "Reading ID: " +
                                percent +
                                "%";

                        }

                    },

                    tessedit_pageseg_mode: 6

                }

            );


        const text =
            result.data.text;


        console.log(
            "========== RAW OCR =========="
        );


        console.log(text);


        console.log(
            "=============================="
        );


        if (
            text &&
            text.trim().length > 0
        ) {

            ocrResult.textContent =
                text.trim();

        }

        else {

            ocrResult.textContent =
                "No text detected.";

        }


        /*
         * Extract fields.
         */

        extractFields(text);


        progressBar.style.width =
            "100%";


        status.textContent =
            "Scan complete.";


        /*
         * Enable database button
         * if an LRN was detected.
         */

        if (
            lrnField.value.trim()
        ) {

            databaseButton.disabled =
                false;

        }

    }


    catch (error) {

        console.error(
            "OCR ERROR:",
            error
        );


        status.textContent =
            "OCR failed.";


        ocrResult.textContent =
            "OCR Error:\n\n" +
            error.message;

    }


    setTimeout(
        function() {

            progressContainer.style.display =
                "none";

        },
        1000
    );

}



/* =========================================
   EXTRACT FIELDS
========================================= */

function extractFields(text) {

    if (!text) {

        return;

    }


    const lines =
        text
            .split(/\r?\n/)
            .map(
                line =>
                    line.trim()
            )
            .filter(
                line =>
                    line.length > 0
            );


    console.log(
        "OCR LINES:",
        lines
    );


    let name = "";

    let grade = "";

    let section = "";

    let lrn = "";

    let idNumber = "";


    /*
     * ======================================
     * NAME
     * ======================================
     */

    for (
        const line of lines
    ) {

        const upper =
            line.toUpperCase();


        if (
            upper.includes("LRN") ||
            upper.includes("ID NO") ||
            upper.includes("IDNO") ||
            upper.includes("GRADE")
        ) {

            continue;

        }


        const cleaned =
            line
                .replace(
                    /[^A-Za-zÀ-ÿ.' -]/g,
                    ""
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();


        const words =
            cleaned
                .split(/\s+/)
                .filter(
                    word =>
                        word.length > 0
                );


        if (
            words.length >= 2 &&
            cleaned.length >= 5
        ) {

            name =
                cleaned;

            break;

        }

    }


    /*
     * ======================================
     * LRN
     * ======================================
     */

    const lrnMatch =
        text.match(
            /LRN\s*[:\-]?\s*([0-9]{8,20})/i
        );


    if (lrnMatch) {

        lrn =
            lrnMatch[1];

    }


    /*
     * LRN FALLBACK
     */

    if (!lrn) {

        for (
            const line of lines
        ) {

            if (
                /LRN/i.test(line)
            ) {

                const number =
                    line.match(
                        /\d{8,20}/
                    );


                if (number) {

                    lrn =
                        number[0];

                    break;

                }

            }

        }

    }


    /*
     * ======================================
     * ID NUMBER
     * ======================================
     */

    const idMatch =
        text.match(
            /ID\s*(?:NO|NUMBER)?\s*[:#\-]?\s*([0-9]+)\s*[-–—]\s*([0-9]+)/i
        );


    if (idMatch) {

        idNumber =
            idMatch[1] +
            "-" +
            idMatch[2];

    }


    /*
     * ID FALLBACK
     */

    if (!idNumber) {

        const generalID =
            text.match(
                /\b([0-9]{4,8})\s*[-–—]\s*([0-9]{2,6})\b/
            );


        if (generalID) {

            idNumber =
                generalID[1] +
                "-" +
                generalID[2];

        }

    }


    /*
     * ======================================
     * GRADE + SECTION
     * ======================================
     */

    const gradeMatch =
        text.match(
            /GRADE\s*(?:LEVEL)?\s*(7|8|9|10|11|12)\s*[-–—:]?\s*([A-Za-z0-9][A-Za-z0-9 .'-]*)/i
        );


    if (gradeMatch) {

        grade =
            gradeMatch[1];


        section =
            gradeMatch[2]
                .trim();


        section =
            section
                .replace(
                    /^[\s\-:]+/,
                    ""
                )
                .replace(
                    /[\s\-:]+$/,
                    ""
                );

    }


    /*
     * GRADE FALLBACK
     */

    if (!grade) {

        const gradeOnly =
            text.match(
                /GRADE\s*(?:LEVEL)?\s*(7|8|9|10|11|12)\b/i
            );


        if (gradeOnly) {

            grade =
                gradeOnly[1];

        }

    }


    /*
     * ======================================
     * DISPLAY
     * ======================================
     */

    nameField.value =
        name;


    gradeField.value =
        grade;


    sectionField.value =
        section;


    lrnField.value =
        lrn;


    idField.value =
        idNumber;


    console.log(
        "EXTRACTED INFORMATION"
    );


    console.log(
        "Name:",
        name
    );


    console.log(
        "Grade:",
        grade
    );


    console.log(
        "Section:",
        section
    );


    console.log(
        "LRN:",
        lrn
    );


    console.log(
        "ID:",
        idNumber
    );

}



/* =========================================
   DATABASE BUTTON
========================================= */

databaseButton.addEventListener(
    "click",
    checkDatabase
);



function checkDatabase() {

    const lrn =
        lrnField.value.trim();

    const name =
        nameField.value.trim();

    const idNumber =
        idField.value.trim();

    const grade =
        gradeField.value.trim();

    const section =
        sectionField.value.trim();


    if (!lrn) {

        alert(
            "No LRN was detected.\n\n" +
            "Please scan the ID again."
        );

        return;

    }


    if (
        DATABASE_URL.includes(
            "PASTE_YOUR"
        )
    ) {

        alert(
            "Apps Script URL has not been entered."
        );

        return;

    }


    status.textContent =
        "Checking Google Sheets...";


    databaseButton.disabled =
        true;


    /*
     * Create a unique callback name.
     */

    const callbackName =
        "studentDatabaseCallback_" +
        Date.now();


    /*
     * Create the callback function.
     */

    window[callbackName] =
        function(result) {

            console.log(
                "DATABASE RESULT:",
                result
            );


            /*
             * Remove callback.
             */

            delete window[callbackName];


            /*
             * Remove script tag.
             */

            if (script.parentNode) {

                script.parentNode.removeChild(
                    script
                );

            }


            /*
             * =================================
             * STUDENT FOUND
             * =================================
             */

            if (
                result.match === true
            ) {

                databaseResult.style.display =
                    "block";


                databaseResult.className =
                    "valid";


                databaseStatus.textContent =
                    "🟢 VALID STUDENT";


                databaseDetails.innerHTML =

                    "<strong>Name:</strong> " +
                    escapeHTML(
                        result.student.name
                    ) +

                    "<br><br>" +

                    "<strong>LRN:</strong> " +
                    escapeHTML(
                        result.student.lrn
                    ) +

                    "<br><br>" +

                    "<strong>ID Number:</strong> " +
                    escapeHTML(
                        result.student.idNumber
                    ) +

                    "<br><br>" +

                    "<strong>Grade:</strong> " +
                    escapeHTML(
                        result.student.grade
                    ) +

                    "<br>" +

                    "<strong>Section:</strong> " +
                    escapeHTML(
                        result.student.section
                    );


                status.textContent =
                    "Student identified successfully.";

            }


            /*
             * =================================
             * STUDENT NOT FOUND
             * =================================
             */

            else {

                databaseResult.style.display =
                    "block";


                databaseResult.className =
                    "invalid";


                databaseStatus.textContent =
                    "🔴 STUDENT NOT FOUND";


                databaseDetails.innerHTML =

                    "<strong>Scanned LRN:</strong> " +

                    escapeHTML(lrn) +

                    "<br><br>" +

                    "This LRN was not found " +
                    "in the student database.";


                status.textContent =
                    "No matching student.";

            }


            databaseButton.disabled =
                false;

        };


    /*
     * =================================
     * BUILD REQUEST
     * =================================
     */

    const params =
        new URLSearchParams();


    params.append(
        "lrn",
        lrn
    );


    params.append(
        "name",
        name
    );


    params.append(
        "idNumber",
        idNumber
    );


    params.append(
        "grade",
        grade
    );


    params.append(
        "section",
        section
    );


    params.append(
        "callback",
        callbackName
    );


    /*
     * =================================
     * CREATE SCRIPT REQUEST
     * =================================
     */

    const script =
        document.createElement(
            "script"
        );


    script.src =
        DATABASE_URL +
        "?" +
        params.toString();


    /*
     * Error handling
     */

    script.onerror =
        function() {

            console.error(
                "Could not connect to Apps Script."
            );


            delete window[callbackName];


            if (script.parentNode) {

                script.parentNode.removeChild(
                    script
                );

            }


            databaseResult.style.display =
                "block";


            databaseResult.className =
                "invalid";


            databaseStatus.textContent =
                "⚠️ DATABASE CONNECTION FAILED";


            databaseDetails.textContent =
                "Could not connect to Google Apps Script.";


            status.textContent =
                "Database connection failed.";


            databaseButton.disabled =
                false;

        };


    /*
     * Send request.
     */

    document.body.appendChild(
        script
    );

}


/* =========================================
   SECURITY
========================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================
   CLEANUP
========================================= */

window.addEventListener(
    "beforeunload",
    stopCamera
);
