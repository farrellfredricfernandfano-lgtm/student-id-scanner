<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>Student ID Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    padding: 15px;
    background: #1b1b1b;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

header p {
    margin: 5px 0 0;
    color: #aaa;
}

#cameraContainer {
    position: relative;
    width: 100%;
    height: 60vh;
    min-height: 350px;
    background: black;
    overflow: hidden;
}

#video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#scanGuide {
    position: absolute;
    width: 88%;
    max-width: 520px;
    aspect-ratio: 1.586 / 1;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: 3px solid #00ff88;
    border-radius: 12px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
    pointer-events: none;
}

#guideText {
    position: absolute;
    top: calc(50% + 130px);
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    font-size: 14px;
    text-shadow: 0 1px 4px black;
    pointer-events: none;
}

#controls {
    padding: 15px;
    background: #1b1b1b;
}

button {
    border: none;
    border-radius: 10px;
    padding: 14px 20px;
    margin: 5px;
    font-size: 16px;
    font-weight: bold;
}

#startButton {
    background: #2196f3;
    color: white;
}

#scanButton {
    background: #00c853;
    color: white;
}

#stopButton {
    background: #f44336;
    color: white;
}

button:disabled {
    background: #555;
    color: #999;
}

#status {
    margin: 10px;
    color: #00ff88;
}

#progressContainer {
    display: none;
    width: 90%;
    max-width: 500px;
    height: 10px;
    margin: 10px auto;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
}

#progressBar {
    width: 0%;
    height: 100%;
    background: #00ff88;
}

#results {
    background: #f4f4f4;
    color: #111;
    padding: 20px;
}

#processedImage {
    display: none;
    width: 100%;
    max-width: 700px;
    margin: 10px auto;
    border-radius: 10px;
}

#ocrResult {
    background: white;
    padding: 15px;
    border-radius: 10px;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-word;
}

.field {
    background: white;
    margin: 10px 0;
    padding: 12px;
    border-radius: 8px;
    text-align: left;
}

.field label {
    display: block;
    font-size: 12px;
    color: #777;
    margin-bottom: 5px;
}

.field input {
    width: 100%;
    border: none;
    outline: none;
    font-size: 17px;
    background: transparent;
    color: #111;
}

#canvas {
    display: none;
}

@media (max-width: 600px) {

    #cameraContainer {
        height: 60vh;
    }

    button {
        width: 90%;
        max-width: 400px;
    }

}

</style>

</head>

<body>

<header>

<h1>Student ID Scanner</h1>

<p>Place the ID inside the guide</p>

</header>

<div id="cameraContainer">

<video
 id="video"
 autoplay
 muted
 playsinline> </video>

<div id="scanGuide"></div>

<div id="guideText">
    Align the entire ID inside the box
</div>

</div>

<div id="controls">

<button id="startButton">
    📷 Start Camera
</button>

<button id="scanButton" disabled>
    🔍 Scan ID
</button>

<button id="stopButton" disabled>
    ⛔ Stop Camera
</button>

<div id="status">
    Camera not started.
</div>

<div id="progressContainer">

<div id="progressBar"></div>

</div>

</div>

<div id="results">

<h2>Processed Image</h2>

<img id="processedImage">

<h2>OCR Result</h2>

<div id="ocrResult">
    Nothing scanned yet.
</div>

<h2>Extracted Information</h2>

<div class="field">

<label>NAME</label>

<input
 id="nameField"
 type="text"
 placeholder="Not detected">

</div>

<div class="field">

<label>GRADE LEVEL</label>

<input
 id="gradeField"
 type="text"
 placeholder="Not detected">

</div>

<div class="field">

<label>SECTION</label>

<input
 id="sectionField"
 type="text"
 placeholder="Not detected">

</div>

<div class="field">

<label>LRN</label>

<input
 id="lrnField"
 type="text"
 placeholder="Not detected">

</div>

<div class="field">

<label>ID NUMBER</label>

<input
 id="idField"
 type="text"
 placeholder="Not detected">

</div>

</div>

<canvas id="canvas"></canvas>

<script>


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const startButton =
    document.getElementById("startButton");

const scanButton =
    document.getElementById("scanButton");

const stopButton =
    document.getElementById("stopButton");

const status =
    document.getElementById("status");

const processedImage =
    document.getElementById("processedImage");

const ocrResult =
    document.getElementById("ocrResult");

const progressContainer =
    document.getElementById("progressContainer");

const progressBar =
    document.getElementById("progressBar");

const nameField =
    document.getElementById("nameField");

const gradeField =
    document.getElementById("gradeField");

const sectionField =
    document.getElementById("sectionField");

const lrnField =
    document.getElementById("lrnField");

const idField =
    document.getElementById("idField");



/* =====================================================
   CAMERA
===================================================== */

let cameraStream = null;

let scanning = false;



startButton.addEventListener(
    "click",
    startCamera
);



async function startCamera() {

    try {

        status.textContent =
            "Requesting camera permission...";


        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                audio: false,

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    }

                }

            });


        video.srcObject =
            cameraStream;


        await video.play();


        status.textContent =
            "Camera ready. Align the ID.";


        startButton.disabled =
            true;

        scanButton.disabled =
            false;

        stopButton.disabled =
            false;


    }

    catch (error) {

        console.error(error);

        status.textContent =
            "Camera error: " +
            error.name;


        alert(
            "Camera error:\n\n" +
            error.name +
            "\n\n" +
            error.message
        );

    }

}



/* =====================================================
   STOP CAMERA
===================================================== */

stopButton.addEventListener(
    "click",
    stopCamera
);



function stopCamera() {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

    }


    cameraStream =
        null;

    video.srcObject =
        null;


    startButton.disabled =
        false;

    scanButton.disabled =
        true;

    stopButton.disabled =
        true;


    status.textContent =
        "Camera stopped.";

}



/* =====================================================
   SCAN BUTTON
===================================================== */

scanButton.addEventListener(
    "click",
    captureAndScan
);



async function captureAndScan() {

    if (
        !cameraStream ||
        scanning
    ) {
        return;
    }


    scanning = true;

    scanButton.disabled = true;


    status.textContent =
        "Capturing image...";


    try {

        const videoWidth =
            video.videoWidth;

        const videoHeight =
            video.videoHeight;


        if (
            !videoWidth ||
            !videoHeight
        ) {

            throw new Error(
                "Camera image is not ready."
            );

        }


        /*
         * Crop the center area
         * where the green guide is.
         */

        const cropWidth =
            Math.floor(
                videoWidth * 0.88
            );


        const cropHeight =
            Math.floor(
                cropWidth / 1.586
            );


        const cropX =
            Math.floor(
                (videoWidth - cropWidth) / 2
            );


        const cropY =
            Math.floor(
                (videoHeight - cropHeight) / 2
            );


        /*
         * Upscale.
         */

        const scale = 2;


        canvas.width =
            cropWidth * scale;

        canvas.height =
            cropHeight * scale;


        const ctx =
            canvas.getContext("2d");


        ctx.drawImage(

            video,

            cropX,
            cropY,

            cropWidth,
            cropHeight,

            0,
            0,

            canvas.width,
            canvas.height

        );


        status.textContent =
            "Improving image...";


        preprocessImage(
            ctx,
            canvas.width,
            canvas.height
        );


        /*
         * Show processed image.
         */

        processedImage.src =
            canvas.toDataURL(
                "image/jpeg",
                0.95
            );

        processedImage.style.display =
            "block";


        /*
         * Start OCR.
         */

        await performOCR();

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "Scan failed.";

        ocrResult.textContent =
            "Scan Error:\n\n" +
            error.message;

    }


    scanButton.disabled =
        false;

    scanning =
        false;

}



/* =====================================================
   IMAGE PREPROCESSING
===================================================== */

function preprocessImage(
    ctx,
    width,
    height
) {

    const imageData =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    const data =
        imageData.data;


    /*
     * Grayscale
     */

    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r = data[i];

        const g = data[i + 1];

        const b = data[i + 2];


        const gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;


        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;

    }


    /*
     * Contrast
     */

    const contrast = 1.5;


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        let value =
            data[i];


        value =
            (
                value - 128
            ) *
            contrast +
            128;


        value =
            Math.max(
                0,
                Math.min(
                    255,
                    value
                )
            );


        data[i] =
            value;

        data[i + 1] =
            value;

        data[i + 2] =
            value;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );

}



/* =====================================================
   OCR
===================================================== */

async function performOCR() {

    status.textContent =
        "Starting OCR...";


    ocrResult.textContent =
        "Reading ID...";


    progressContainer.style.display =
        "block";


    progressBar.style.width =
        "0%";


    try {

        const result =
            await Tesseract.recognize(
                canvas,
                "eng",
                {

                    logger: function(info) {

                        console.log(info);


                        if (
                            info.status ===
                            "recognizing text"
                        ) {

                            const percent =
                                Math.round(
                                    info.progress *
                                    100
                                );


                            progressBar.style.width =
                                percent + "%";


                            status.textContent =
                                "Reading ID: " +
                                percent +
                                "%";

                        }

                    },

                    tessedit_pageseg_mode: 6

                }
            );


        const text =
            result.data.text;


        console.log(
            "RAW OCR RESULT:"
        );

        console.log(text);


        if (
            text &&
            text.trim().length > 0
        ) {

            ocrResult.textContent =
                text.trim();

        }

        else {

            ocrResult.textContent =
                "No text detected.";

        }


        /*
         * Extract information.
         */

        extractFields(text);


        progressBar.style.width =
            "100%";


        status.textContent =
            "Scan complete.";

    }

    catch (error) {

        console.error(
            "OCR ERROR:",
            error
        );


        status.textContent =
            "OCR failed.";


        ocrResult.textContent =
            "OCR Error:\n\n" +
            error.message;

    }


    setTimeout(
        function() {

            progressContainer.style.display =
                "none";

        },
        1000
    );

}



/* =====================================================
   EXTRACT INFORMATION
===================================================== */

function extractFields(text) {

    if (!text) {
        return;
    }


    /*
     * Split OCR into lines.
     */

    const lines =
        text
            .split(/\r?\n/)
            .map(
                line => line.trim()
            )
            .filter(
                line => line.length > 0
            );


    console.log(
        "OCR LINES:",
        lines
    );


    let name = "";

    let grade = "";

    let section = "";

    let lrn = "";

    let idNumber = "";



    /* =================================================
       NAME
    ================================================= */

    for (
        const line of lines
    ) {

        const upper =
            line.toUpperCase();


        /*
         * Ignore known information lines.
         */

        if (
            upper.includes("LRN") ||
            upper.includes("ID NO") ||
            upper.includes("IDNO") ||
            upper.includes("GRADE")
        ) {

            continue;

        }


        /*
         * Keep letters, spaces,
         * periods and apostrophes.
         */

        const cleaned =
            line
                .replace(
                    /[^A-Za-zÀ-ÿ.' -]/g,
                    ""
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();


        const words =
            cleaned
                .split(/\s+/)
                .filter(
                    word =>
                        word.length > 0
                );


        /*
         * A person's name should
         * contain at least 2 words.
         */

        if (
            words.length >= 2 &&
            cleaned.length >= 5
        ) {

            name =
                cleaned;

            break;

        }

    }



    /* =================================================
       LRN
    ================================================= */

    const lrnMatch =
        text.match(
            /LRN\s*[:\-]?\s*([0-9]{8,20})/i
        );


    if (lrnMatch) {

        lrn =
            lrnMatch[1];

    }


    /*
     * Fallback if Tesseract
     * separates the LRN label.
     */

    if (!lrn) {

        for (
            const line of lines
        ) {

            if (
                /LRN/i.test(line)
            ) {

                const number =
                    line.match(
                        /\d{8,20}/
                    );


                if (number) {

                    lrn =
                        number[0];

                    break;

                }

            }

        }

    }



    /* =================================================
       ID NUMBER
    ================================================= */

    const idMatch =
        text.match(
            /ID\s*(?:NO|NUMBER)?\s*[:#\-]?\s*([0-9]+)\s*[-–—]\s*([0-9]+)/i
        );


    if (idMatch) {

        idNumber =
            idMatch[1] +
            "-" +
            idMatch[2];

    }


    /*
     * Fallback for:

       123456 -123
    */

    if (!idNumber) {

        const generalID =
            text.match(
                /\b([0-9]{4,8})\s*[-–—]\s*([0-9]{2,6})\b/
            );


        if (generalID) {

            idNumber =
                generalID[1] +
                "-" +
                generalID[2];

        }

    }



    /* =================================================
       GRADE + SECTION
    ================================================= */

    /*
     * Expected:

       GRADE 12- ROENTGEN
    */

    const gradeMatch =
        text.match(
            /GRADE\s*(?:LEVEL)?\s*(7|8|9|10|11|12)\s*[-–—:]?\s*([A-Za-z0-9][A-Za-z0-9 .'-]*)/i
        );


    if (gradeMatch) {

        grade =
            gradeMatch[1];


        section =
            gradeMatch[2]
                .trim();


        section =
            section
                .replace(
                    /^[\s\-:]+/,
                    ""
                )
                .replace(
                    /[\s\-:]+$/,
                    ""
                );

    }



    /* =================================================
       GRADE FALLBACK
    ================================================= */

    if (!grade) {

        const gradeOnly =
            text.match(
                /GRADE\s*(?:LEVEL)?\s*(7|8|9|10|11|12)\b/i
            );


        if (gradeOnly) {

            grade =
                gradeOnly[1];

        }

    }



    /* =================================================
       DISPLAY
    ================================================= */

    nameField.value =
        name;

    gradeField.value =
        grade;

    sectionField.value =
        section;

    lrnField.value =
        lrn;

    idField.value =
        idNumber;



    /*
     * Debug.
     */

    console.log(
        "------------------------------"
    );

    console.log(
        "NAME:",
        name
    );

    console.log(
        "GRADE:",
        grade
    );

    console.log(
        "SECTION:",
        section
    );

    console.log(
        "LRN:",
        lrn
    );

    console.log(
        "ID NUMBER:",
        idNumber
    );

    console.log(
        "------------------------------"
    );

}



/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    stopCamera
);

</script>

</body>

</html>
