<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        text-align: center;
    }

    h1 {
        margin-bottom: 5px;
    }

    .subtitle {
        color: #aaa;
        margin-bottom: 20px;
    }

    .camera-container {
        position: relative;
        width: 100%;
        max-width: 700px;
        margin: auto;
        background: black;
        overflow: hidden;
        border-radius: 12px;
    }

    video {
        display: block;
        width: 100%;
        height: auto;
    }

    .scan-guide {
        position: absolute;
        width: 88%;
        aspect-ratio: 1.586 / 1;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);

        border: 3px solid #00ff66;
        border-radius: 10px;

        box-shadow:
            0 0 10px #00ff66,
            inset 0 0 10px rgba(0,255,102,0.2);

        pointer-events: none;
    }

    .scan-guide::after {
        content: "ALIGN ID CARD HERE";
        position: absolute;

        top: -30px;
        left: 50%;

        transform: translateX(-50%);

        font-size: 13px;
        color: #00ff66;

        white-space: nowrap;
    }

    .controls {
        max-width: 700px;
        margin: 20px auto;

        display: flex;
        flex-wrap: wrap;

        justify-content: center;

        gap: 10px;
    }

    button {
        padding: 12px 18px;

        border: none;
        border-radius: 8px;

        font-size: 15px;
        font-weight: bold;

        cursor: pointer;
    }

    button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    #startButton {
        background: #00c853;
        color: white;
    }

    #scanButton {
        background: #2196f3;
        color: white;
    }

    #stopButton {
        background: #f44336;
        color: white;
    }

    #databaseButton {
        background: #9c27b0;
        color: white;
    }

    .status {
        max-width: 700px;
        margin: 15px auto;

        padding: 12px;

        background: #222;

        border-radius: 8px;

        color: #ddd;
    }

    .progress-container {
        max-width: 700px;
        margin: 15px auto;

        background: #333;

        border-radius: 10px;

        overflow: hidden;

        height: 12px;
    }

    .progress-bar {
        width: 0%;
        height: 100%;

        background: #00ff66;

        transition: width 0.2s;
    }

    .image-container {
        max-width: 700px;
        margin: 20px auto;
    }

    .image-container h3 {
        margin-bottom: 10px;
    }

    #processedImage {
        max-width: 100%;

        border-radius: 8px;

        display: none;
    }

    .results {
        max-width: 700px;

        margin: 20px auto;

        text-align: left;
    }

    .results h2 {
        text-align: center;
    }

    .field {
        margin: 10px 0;
    }

    .field label {
        display: block;

        color: #aaa;

        font-size: 13px;

        margin-bottom: 4px;
    }

    .field input {
        width: 100%;

        padding: 11px;

        background: #222;

        color: white;

        border: 1px solid #444;

        border-radius: 6px;

        font-size: 15px;
    }

    .database-result {
        display: none;

        max-width: 700px;

        margin: 20px auto;

        padding: 20px;

        border-radius: 10px;

        text-align: center;
    }

    .database-result.valid {
        background: #123d20;
        border: 2px solid #00c853;
    }

    .database-result.invalid {
        background: #421414;
        border: 2px solid #f44336;
    }

    #databaseStatus {
        font-size: 22px;

        font-weight: bold;

        margin-bottom: 15px;
    }

    #databaseDetails {
        text-align: left;

        line-height: 1.5;
    }

    .ocr-debug {
        max-width: 700px;

        margin: 20px auto;

        text-align: left;
    }

    .ocr-debug h3 {
        text-align: center;
    }

    #rawOCR {
        width: 100%;

        min-height: 150px;

        padding: 12px;

        background: #080808;

        color: #00ff66;

        border: 1px solid #333;

        border-radius: 8px;

        font-family: monospace;

        font-size: 14px;

        white-space: pre-wrap;

        overflow-wrap: break-word;
    }

</style>
