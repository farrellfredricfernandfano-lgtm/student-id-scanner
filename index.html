<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student ID Scanner</title>

    <!-- Tesseract.js -->
    <script
        src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 20px;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 700px;
            margin: auto;
            background: black;
            overflow: hidden;
            border-radius: 12px;
        }

        video {
            display: block;
            width: 100%;
            height: auto;
        }

        /* ID CARD GUIDE */

        .scan-guide {
            position: absolute;
            width: 88%;
            aspect-ratio: 1.586 / 1;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            border: 3px solid #00ff66;
            border-radius: 10px;

            box-shadow:
                0 0 10px #00ff66,
                inset 0 0 10px rgba(0,255,102,0.2);

            pointer-events: none;
        }

        .scan-guide::after {
            content: "ALIGN ID CARD HERE";
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);

            font-size: 13px;
            color: #00ff66;
            white-space: nowrap;
        }

        .controls {
            max-width: 700px;
            margin: 20px auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #startButton {
            background: #00c853;
            color: white;
        }

        #scanButton {
            background: #2196f3;
            color: white;
        }

        #stopButton {
            background: #f44336;
            color: white;
        }

        #databaseButton {
            background: #9c27b0;
            color: white;
        }

        .status {
            max-width: 700px;
            margin: 15px auto;
            padding: 12px;
            background: #222;
            border-radius: 8px;
            color: #ddd;
        }

        .progress-container {
            max-width: 700px;
            margin: 15px auto;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            height: 12px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #00ff66;
            transition: width 0.2s;
        }

        .image-container {
            max-width: 700px;
            margin: 20px auto;
        }

        .image-container h3 {
            margin-bottom: 10px;
        }

        #processedImage {
            max-width: 100%;
            border-radius: 8px;
            display: none;
        }

        .results {
            max-width: 700px;
            margin: 20px auto;
            text-align: left;
        }

        .results h2 {
            text-align: center;
        }

        .field {
            margin: 10px 0;
        }

        .field label {
            display: block;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .field input {
            width: 100%;
            padding: 11px;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 15px;
        }

        .database-result {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .database-result.valid {
            background: #123d20;
            border: 2px solid #00c853;
        }

        .database-result.invalid {
            background: #421414;
            border: 2px solid #f44336;
        }

        #databaseStatus {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        #databaseDetails {
            text-align: left;
            line-height: 1.5;
        }

        /* TEMPORARY OCR DEBUG BOX */

        .ocr-debug {
            max-width: 700px;
            margin: 20px auto;
            text-align: left;
        }

        .ocr-debug h3 {
            text-align: center;
        }

        #rawOCR {
            width: 100%;
            min-height: 150px;
            padding: 12px;

            background: #080808;
            color: #00ff66;

            border: 1px solid #333;
            border-radius: 8px;

            font-family: monospace;
            font-size: 14px;

            white-space: pre-wrap;
            overflow-wrap: break-word;
        }

    </style>

</head>

<body>

    <h1>Student ID Scanner</h1>

    <div class="subtitle">
        OCR-Based Student Identification System
    </div>


    <!-- CAMERA -->

    <div class="camera-container">

        <video
            id="video"
            autoplay
            playsinline>
        </video>

        <div class="scan-guide"></div>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            id="startButton">

            📷 Start Camera

        </button>


        <button
            id="scanButton"
            disabled>

            🔍 Scan & Verify

        </button>


        <button
            id="stopButton"
            disabled>

            ⛔ Stop Camera

        </button>


        <button
            id="databaseButton"
            disabled>

            🔎 Check Database

        </button>

    </div>


    <!-- STATUS -->

    <div
        class="status"
        id="status">

        Camera not started.

    </div>


    <!-- PROGRESS -->

    <div class="progress-container">

        <div
            class="progress-bar"
            id="progressBar">
        </div>

    </div>


    <!-- PROCESSED IMAGE -->

    <div class="image-container">

        <h3>Processed Image</h3>

        <img
            id="processedImage"
            alt="Processed ID">

    </div>


    <!-- RESULTS -->

    <div class="results">

        <h2>Scanned Information</h2>


        <div class="field">

            <label>
                NAME
            </label>

            <input
                id="nameField"
                type="text"
                readonly>

        </div>


        <div class="field">

            <label>
                GRADE LEVEL
            </label>

            <input
                id="gradeField"
                type="text"
                readonly>

        </div>


        <div class="field">

            <label>
                SECTION
            </label>

            <input
                id="sectionField"
                type="text"
                readonly>

        </div>


        <div class="field">

            <label>
                LRN
            </label>

            <input
                id="lrnField"
                type="text"
                readonly>

        </div>


        <div class="field">

            <label>
                ID NUMBER
            </label>

            <input
                id="idField"
                type="text"
                readonly>

        </div>

    </div>


    <!-- DATABASE RESULT -->

    <div
        class="database-result"
        id="databaseResult">

        <div id="databaseStatus"></div>

        <div id="databaseDetails"></div>

    </div>


    <!-- TEMPORARY OCR DEBUG -->

    <div class="ocr-debug">

        <h3>Raw OCR Result</h3>

        <div id="rawOCR">
            No OCR result yet.
        </div>

    </div>


    <!-- HIDDEN CANVAS -->

    <canvas
        id="canvas"
        style="display:none;">
    </canvas>


<script>


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const processedImage =
    document.getElementById("processedImage");

const startButton =
    document.getElementById("startButton");

const scanButton =
    document.getElementById("scanButton");

const stopButton =
    document.getElementById("stopButton");

const databaseButton =
    document.getElementById("databaseButton");

const status =
    document.getElementById("status");

const progressBar =
    document.getElementById("progressBar");

const nameField =
    document.getElementById("nameField");

const gradeField =
    document.getElementById("gradeField");

const sectionField =
    document.getElementById("sectionField");

const lrnField =
    document.getElementById("lrnField");

const idField =
    document.getElementById("idField");

const databaseResult =
    document.getElementById("databaseResult");

const databaseStatus =
    document.getElementById("databaseStatus");

const databaseDetails =
    document.getElementById("databaseDetails");

const rawOCR =
    document.getElementById("rawOCR");


/* =========================================================
   GOOGLE APPS SCRIPT DATABASE URL
========================================================= */

const DATABASE_URL =
    "https://script.google.com/macros/s/AKfycby8SQH20dz2PK6Covm_GOy4sG1WigvDaxZr8a--gbrI_LBKE1KJoQO7AMzaKZR_3mQ/exec";


/* =========================================================
   CAMERA
========================================================= */

let cameraStream = null;


startButton.addEventListener(
    "click",
    startCamera
);


stopButton.addEventListener(
    "click",
    stopCamera
);


scanButton.addEventListener(
    "click",
    captureAndScan
);


databaseButton.addEventListener(
    "click",
    checkDatabase
);


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

    try {

        status.textContent =
            "Starting camera...";

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                audio: false,

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    }

                }

            });


        video.srcObject =
            cameraStream;


        startButton.disabled =
            true;

        scanButton.disabled =
            false;

        stopButton.disabled =
            false;


        status.textContent =
            "Camera ready. Align the ID inside the green guide.";

    }

    catch (error) {

        console.error(
            "CAMERA ERROR:",
            error
        );

        status.textContent =
            "Could not access camera: " +
            error.message;

    }

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera() {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        cameraStream = null;

    }


    video.srcObject = null;


    startButton.disabled =
        false;

    scanButton.disabled =
        true;

    stopButton.disabled =
        true;


    status.textContent =
        "Camera stopped.";

}


/* =========================================================
   CAPTURE + OCR
========================================================= */

async function captureAndScan() {

    if (!cameraStream) {

        alert(
            "Please start the camera first."
        );

        return;

    }


    scanButton.disabled =
        true;

    databaseButton.disabled =
        true;


    databaseResult.style.display =
        "none";


    progressBar.style.width =
        "0%";


    status.textContent =
        "Capturing ID...";


    try {

        await performOCR();

    }

    catch (error) {

        console.error(
            "SCAN ERROR:",
            error
        );

        status.textContent =
            "Scanning failed: " +
            error.message;

    }


    scanButton.disabled =
        false;

}


/* =========================================================
   OCR
========================================================= */

async function performOCR() {

    status.textContent =
        "Processing image...";


    /*
       ID CARD RATIO

       1.586 : 1
    */

    const videoWidth =
        video.videoWidth;

    const videoHeight =
        video.videoHeight;


    if (
        !videoWidth ||
        !videoHeight
    ) {

        throw new Error(
            "Camera image is not ready."
        );

    }


    /*
       Crop approximately 88% of
       the video width.
    */

    const cropWidth =
        videoWidth * 0.88;


    const cropHeight =
        cropWidth / 1.586;


    const cropX =
        (videoWidth - cropWidth) / 2;


    const cropY =
        (videoHeight - cropHeight) / 2;


    /*
       Upscale image
    */

    const scale = 2;


    canvas.width =
        cropWidth * scale;

    canvas.height =
        cropHeight * scale;


    const ctx =
        canvas.getContext("2d");


    /*
       Draw camera image
    */

    ctx.drawImage(

        video,

        cropX,
        cropY,
        cropWidth,
        cropHeight,

        0,
        0,
        canvas.width,
        canvas.height

    );


    status.textContent =
        "Enhancing image...";


    /*
       PREPROCESSING
    */

    const imageData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


    const data =
        imageData.data;


    /*
       Grayscale + contrast
    */

    const contrast =
        1.5;


    const factor =
        (259 * (contrast + 255)) /
        (255 * (259 - contrast));


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r =
            data[i];

        const g =
            data[i + 1];

        const b =
            data[i + 2];


        /*
           Grayscale
        */

        let gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;


        /*
           Contrast
        */

        gray =
            factor *
            (gray - 128) +
            128;


        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );


        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    /*
       Show processed image
    */

    processedImage.src =
        canvas.toDataURL(
            "image/png"
        );

    processedImage.style.display =
        "block";


    status.textContent =
        "Running OCR...";


    /*
       TESSERACT
    */

    const result =
        await Tesseract.recognize(

            canvas,

            "eng",

            {

                logger: function(info) {

                    console.log(
                        "TESSERACT:",
                        info
                    );


                    if (
                        info.progress !== undefined
                    ) {

                        progressBar.style.width =
                            (
                                info.progress * 100
                            ) + "%";

                    }


                    if (
                        info.status
                    ) {

                        status.textContent =
                            info.status;

                    }

                },

                tessedit_pageseg_mode: 6

            }

        );


    progressBar.style.width =
        "100%";


    /*
       RAW OCR TEXT
    */

    const text =
        result.data.text;


    console.log(
        "OCR RESULT:",
        text
    );


    /*
       TEMPORARY DEBUG DISPLAY

       This lets us see exactly what
       Tesseract is reading.
    */

    rawOCR.textContent =
        text ||
        "Tesseract returned no text.";


    /*
       Parse OCR
    */

    parseOCR(text);


    /*
       AUTOMATIC DATABASE CHECK
    */

    if (
        lrnField.value.trim()
    ) {

        status.textContent =
            "OCR complete. Checking database...";


        databaseButton.disabled =
            true;


        await checkDatabase();

    }

    else {

        status.textContent =
            "OCR complete, but LRN was not detected.";

    }

}


/* =========================================================
   OCR PARSING
========================================================= */

function parseOCR(text) {

    /*
       Normalize line breaks
    */

    const lines =
        text
            .split(/\r?\n/)
            .map(
                line =>
                    line.trim()
            )
            .filter(
                line =>
                    line.length > 0
            );


    /*
       Clear previous values
    */

    nameField.value =
        "";

    gradeField.value =
        "";

    sectionField.value =
        "";

    lrnField.value =
        "";

    idField.value =
        "";


    /* =====================================================
       LRN
    ===================================================== */

    let lrnMatch =
        text.match(
            /LRN\s*[:\-]?\s*([0-9]{8,20})/i
        );


    /*
       Sometimes OCR may put spaces
       between digits.
    */

    if (!lrnMatch) {

        const normalizedText =
            text.replace(
                /(\d)\s+(?=\d)/g,
                "$1"
            );


        lrnMatch =
            normalizedText.match(
                /LRN\s*[:\-]?\s*([0-9]{8,20})/i
            );

    }


    if (lrnMatch) {

        lrnField.value =
            lrnMatch[1];

    }


    /* =====================================================
       ID NUMBER
    ===================================================== */

    let idMatch =
        text.match(

            /ID\s*(?:NO|NUMBER)?\s*[:#\-]?\s*([0-9]+)\s*[-–—]\s*([0-9]+)/i

        );


    if (idMatch) {

        idField.value =
            idMatch[1] +
            "-" +
            idMatch[2];

    }

    else {

        /*
           General number-number fallback
        */

        const fallbackID =
            text.match(
                /\b([0-9]{3,})\s*[-–—]\s*([0-9]{2,})\b/
            );


        if (fallbackID) {

            idField.value =
                fallbackID[1] +
                "-" +
                fallbackID[2];

        }

    }


    /* =====================================================
       GRADE + SECTION
    ===================================================== */

    let gradeMatch =
        text.match(

            /GRADE\s*(?:LEVEL)?\s*(7|8|9|10|11|12)\s*[-–—:]?\s*([A-Za-z0-9][A-Za-z0-9 .'-]*)/i

        );


    if (gradeMatch) {

        gradeField.value =
            gradeMatch[1];

        sectionField.value =
            gradeMatch[2]
                .trim();

    }


    /* =====================================================
       NAME
    ===================================================== */

    /*
       Find the first line that looks like
       a person's name.
    */

    for (
        const line of lines
    ) {

        const upper =
            line.toUpperCase();


        /*
           Skip lines containing known
           labels.
        */

        if (
            upper.includes("LRN") ||
            upper.includes("ID NO") ||
            upper.includes("ID NUMBER") ||
            upper.includes("GRADE") ||
            upper.includes("SECTION")
        ) {

            continue;

        }


        /*
           Clean OCR characters
        */

        const cleaned =
            line
                .replace(
                    /[^A-Za-zÀ-ÿ.' -]/g,
                    ""
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();


        const words =
            cleaned
                .split(" ")
                .filter(
                    word =>
                        word.length > 0
                );


        /*
           A name should have
           at least two words.
        */

        if (
            words.length >= 2 &&
            cleaned.length >= 5
        ) {

            nameField.value =
                cleaned;

            break;

        }

    }


    console.log(
        "PARSED NAME:",
        nameField.value
    );

    console.log(
        "PARSED GRADE:",
        gradeField.value
    );

    console.log(
        "PARSED SECTION:",
        sectionField.value
    );

    console.log(
        "PARSED LRN:",
        lrnField.value
    );

    console.log(
        "PARSED ID:",
        idField.value
    );

}


/* =========================================================
   DATABASE CHECK
========================================================= */

async function checkDatabase() {

    const lrn =
        lrnField.value
            .trim();


    if (!lrn) {

        status.textContent =
            "No LRN was detected.";

        databaseButton.disabled =
            false;

        return;

    }


    if (
        DATABASE_URL.includes(
            "PASTE_YOUR"
        )
    ) {

        alert(
            "Apps Script URL has not been entered."
        );

        databaseButton.disabled =
            false;

        return;

    }


    status.textContent =
        "Checking Google Sheets...";


    databaseButton.disabled =
        true;


    databaseResult.style.display =
        "none";


    try {

        const url =
            DATABASE_URL +
            "?lrn=" +
            encodeURIComponent(
                lrn
            );


        console.log(
            "DATABASE REQUEST:",
            url
        );


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "HTTP error: " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "DATABASE RESULT:",
            result
        );


        /*
           STUDENT FOUND
        */

        if (
            result.match === true
        ) {

            databaseResult.style.display =
                "block";

            databaseResult.className =
                "database-result valid";


            databaseStatus.textContent =
                "🟢 VALID STUDENT";


            databaseDetails.innerHTML =

                "<strong>Name:</strong> " +
                escapeHTML(
                    result.student.name
                ) +

                "<br><br>" +

                "<strong>LRN:</strong> " +
                escapeHTML(
                    result.student.lrn
                ) +

                "<br><br>" +

                "<strong>ID Number:</strong> " +
                escapeHTML(
                    result.student.idNumber
                ) +

                "<br><br>" +

                "<strong>Grade:</strong> " +
                escapeHTML(
                    result.student.grade
                ) +

                "<br><br>" +

                "<strong>Section:</strong> " +
                escapeHTML(
                    result.student.section
                );


            status.textContent =
                "Student identified successfully.";

        }


        /*
           STUDENT NOT FOUND
        */

        else {

            databaseResult.style.display =
                "block";

            databaseResult.className =
                "database-result invalid";


            databaseStatus.textContent =
                "🔴 STUDENT NOT FOUND";


            databaseDetails.innerHTML =

                "<strong>Scanned LRN:</strong> " +
                escapeHTML(
                    lrn
                ) +

                "<br><br>" +

                "This LRN was not found " +
                "in the student database.";


            status.textContent =
                "No matching student.";

        }

    }


    catch (error) {

        console.error(
            "DATABASE ERROR:",
            error
        );


        databaseResult.style.display =
            "block";

        databaseResult.className =
            "database-result invalid";


        databaseStatus.textContent =
            "⚠️ DATABASE CONNECTION FAILED";


        databaseDetails.innerHTML =

            "Could not connect to Google Apps Script." +

            "<br><br>" +

            "<small>" +

            escapeHTML(
                error.message
            ) +

            "</small>";


        status.textContent =
            "Database connection failed.";

    }


    finally {

        databaseButton.disabled =
            false;

    }

}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


</script>

</body>

</html>
