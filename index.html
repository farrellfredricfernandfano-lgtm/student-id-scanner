<script>

const video = document.getElementById("video");

const canvas = document.getElementById("canvas");

const startButton = document.getElementById("startButton");

const scanButton = document.getElementById("scanButton");

const stopButton = document.getElementById("stopButton");

const databaseButton = document.getElementById("databaseButton");

const progressBar = document.getElementById("progressBar");

const statusText = document.getElementById("status");

const ocrResult = document.getElementById("ocrResult");

const nameField = document.getElementById("nameField");

const gradeField = document.getElementById("gradeField");

const sectionField = document.getElementById("sectionField");

const lrnField = document.getElementById("lrnField");

const idField = document.getElementById("idField");

const databaseText = document.getElementById("databaseText");


let stream = null;


/* =========================================================
   GOOGLE APPS SCRIPT DATABASE
   ========================================================= */

const DATABASE_URL =
"https://script.google.com/macros/s/AKfycby8SQH20dz2PK6Covm_GOy4sG1WigvDaxZr8a--gbrI_LBKE1KJoQO7AMzaKZR_3mQ/exec";


/* =========================================================
   CAMERA
   ========================================================= */

startButton.addEventListener("click", async () => {

    try {

        stream = await navigator.mediaDevices.getUserMedia({

            video: {

                facingMode: {
                    ideal: "environment"
                },

                width: {
                    ideal: 1920
                },

                height: {
                    ideal: 1080
                },

                frameRate: {
                    ideal: 30
                }

            },

            audio: false

        });

        video.srcObject = stream;

        startButton.disabled = true;

        scanButton.disabled = false;

        stopButton.disabled = false;

        statusText.textContent = "Camera ready. Place the ID inside the green box.";

    }

    catch (error) {

        console.error(error);

        statusText.textContent =
            "Camera error: " + error.message;

    }

});


/* =========================================================
   STOP CAMERA
   ========================================================= */

stopButton.addEventListener("click", () => {

    if (stream) {

        stream.getTracks().forEach(track => track.stop());

        stream = null;

    }

    video.srcObject = null;

    startButton.disabled = false;

    scanButton.disabled = true;

    stopButton.disabled = true;

    statusText.textContent = "Camera stopped.";

});


/* =========================================================
   CAPTURE + PREPROCESS IMAGE
   ========================================================= */

function captureAndPreprocess() {

    const videoWidth = video.videoWidth;

    const videoHeight = video.videoHeight;


    let cropWidth = videoWidth * 0.88;

    let cropHeight = cropWidth / 1.586;


    if (cropHeight > videoHeight * 0.92) {

        cropHeight = videoHeight * 0.92;

        cropWidth = cropHeight * 1.586;

    }


    const cropX = (videoWidth - cropWidth) / 2;

    const cropY = (videoHeight - cropHeight) / 2;


    const scale = 2;


    canvas.width = cropWidth * scale;

    canvas.height = cropHeight * scale;


    const ctx = canvas.getContext("2d");


    ctx.drawImage(

        video,

        cropX,
        cropY,
        cropWidth,
        cropHeight,

        0,
        0,
        canvas.width,
        canvas.height

    );


    const imageData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


    const data = imageData.data;


    /* ORIGINAL WORKING PREPROCESSING */

    for (let i = 0; i < data.length; i += 4) {

        const r = data[i];

        const g = data[i + 1];

        const b = data[i + 2];


        let gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;


        /* Contrast 1.35 */

        gray =
            ((gray - 128) * 1.35) + 128;


        gray =
            Math.max(
                0,
                Math.min(255, gray)
            );


        data[i] = gray;

        data[i + 1] = gray;

        data[i + 2] = gray;

    }


    ctx.putImageData(imageData, 0, 0);


    return {

        processedCanvas: canvas,

        colorCanvas: createColorCanvas(
            video,
            cropX,
            cropY,
            cropWidth,
            cropHeight,
            scale
        )

    };

}


/* =========================================================
   COLOR CANVAS
   ========================================================= */

function createColorCanvas(
    videoElement,
    cropX,
    cropY,
    cropWidth,
    cropHeight,
    scale
) {

    const colorCanvas =
        document.createElement("canvas");


    colorCanvas.width =
        cropWidth * scale;


    colorCanvas.height =
        cropHeight * scale;


    const ctx =
        colorCanvas.getContext("2d");


    ctx.drawImage(

        videoElement,

        cropX,
        cropY,
        cropWidth,
        cropHeight,

        0,
        0,
        colorCanvas.width,
        colorCanvas.height

    );


    return colorCanvas;

}


/* =========================================================
   SHARPEN
   ========================================================= */

function createSharpenCanvas(sourceCanvas) {

    const sharpenCanvas =
        document.createElement("canvas");


    sharpenCanvas.width =
        sourceCanvas.width;


    sharpenCanvas.height =
        sourceCanvas.height;


    const ctx =
        sharpenCanvas.getContext("2d");


    ctx.drawImage(
        sourceCanvas,
        0,
        0
    );


    const imageData =
        ctx.getImageData(
            0,
            0,
            sharpenCanvas.width,
            sharpenCanvas.height
        );


    const data = imageData.data;

    const width = sharpenCanvas.width;

    const height = sharpenCanvas.height;


    const copy =
        new Uint8ClampedArray(data);


    for (let y = 1; y < height - 1; y++) {

        for (let x = 1; x < width - 1; x++) {

            const i =
                (y * width + x) * 4;


            const up =
                ((y - 1) * width + x) * 4;

            const down =
                ((y + 1) * width + x) * 4;

            const left =
                (y * width + (x - 1)) * 4;

            const right =
                (y * width + (x + 1)) * 4;


            const value =
                copy[i] * 5
                - copy[up]
                - copy[down]
                - copy[left]
                - copy[right];


            const finalValue =
                Math.max(
                    0,
                    Math.min(
                        255,
                        value
                    )
                );


            data[i] = finalValue;

            data[i + 1] = finalValue;

            data[i + 2] = finalValue;

        }

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return sharpenCanvas;

}


/* =========================================================
   VALID LRN
   ========================================================= */

function isValidLRN(value) {

    if (!value) return false;


    const digits =
        value.replace(/\D/g, "");


    return digits.length === 12;

}


/* =========================================================
   LRN EXTRACTION
   ========================================================= */

function extractBestLRN(text) {

    if (!text) return "";


    let cleaned = text;


    /*
       OCR CHARACTER SUBSTITUTIONS
    */

    cleaned = cleaned
        .replace(/[OoQq]/g, "0")
        .replace(/[IiLl|]/g, "1")
        .replace(/[Ss]/g, "5")
        .replace(/[Bb]/g, "8")
        .replace(/[Gg]/g, "6");


    /*
       FIRST: SEARCH AFTER LRN LABEL
    */

    const lrnMatch =
        cleaned.match(
            /LRN\s*[:.\-]?\s*([0-9\s\-]{8,20})/i
        );


    if (lrnMatch) {

        const digits =
            lrnMatch[1].replace(/\D/g, "");


        if (digits.length === 12) {

            return digits;

        }

    }


    /*
       SECOND: SEARCH ANY 12-DIGIT SEQUENCE
    */

    const allDigits =
        cleaned.match(
            /\d[\d\s\-]{10,18}\d/g
        );


    if (allDigits) {

        for (const candidate of allDigits) {

            const digits =
                candidate.replace(/\D/g, "");


            if (digits.length === 12) {

                return digits;

            }

        }

    }


    return "";

}


/* =========================================================
   ID NUMBER EXTRACTION
   ========================================================= */

function extractID(text) {

    if (!text) return "";


    let cleaned =
        text.replace(
            /ID\s*(?:NO|NUMBER)?\s*[:.\-]?\s*/i,
            ""
        );


    const match =
        text.match(
            /ID\s*(?:NO|NUMBER)?\s*[:.\-]?\s*([A-Z0-9]+(?:[-\s][A-Z0-9]+)*)/i
        );


    if (match) {

        let id =
            match[1]
                .trim()
                .replace(/\s+/g, "-");


        if (
            /SHS|JHS/i.test(id) ||
            /\d{3,}[-\s]\d{3,}/.test(id)
        ) {

            return id;

        }

    }


    /*
       FALLBACK FOR COMMON ID FORMAT
    */

    const fallback =
        text.match(
            /\b\d{3,}[-\s]\d{3,}[-\s]?[A-Z]{2,5}\b/i
        );


    if (fallback) {

        return fallback[0]
            .trim()
            .replace(/\s+/g, "-");

    }


    return "";

}


/* =========================================================
   GRADE + SECTION
   ========================================================= */

function extractGradeSection(text) {

    if (!text) {

        return {
            grade: "",
            section: ""
        };

    }


    const normalized =
        text
            .replace(/GIRADDE/gi, "GRADE")
            .replace(/GRAD[EÉ]/gi, "GRADE")
            .replace(/GRAOE/gi, "GRADE");


    const match =
        normalized.match(
            /GRADE\s*(\d{1,2})\s*[-: ]\s*([A-Z0-9.\- ]+)/i
        );


    if (match) {

        return {

            grade: match[1].trim(),

            section: match[2]
                .trim()
                .replace(/\s+/g, " ")

        };

    }


    return {

        grade: "",

        section: ""

    };

}


/* =========================================================
   NAME EXTRACTION
   ========================================================= */

function extractName(text) {

    if (!text) return "";


    const lines =
        text
            .split(/\r?\n/)
            .map(line => line.trim())
            .filter(line => line.length > 2);


    for (const line of lines) {

        const upper =
            line.toUpperCase();


        if (
            upper.includes("LRN") ||
            upper.includes("ID NO") ||
            upper.includes("ID NUMBER") ||
            upper.includes("GRADE") ||
            upper.includes("SECTION")
        ) {

            continue;

        }


        const words =
            line.split(/\s+/);


        if (words.length >= 2) {

            /*
               Avoid obvious labels
            */

            if (
                /^[A-Z0-9 .,'-]+$/.test(
                    line.toUpperCase()
                )
            ) {

                return line;

            }

        }

    }


    return "";

}


/* =========================================================
   PARSE OCR
   ========================================================= */

function parseOCR(text) {

    const gradeSection =
        extractGradeSection(text);


    return {

        name:
            extractName(text),

        grade:
            gradeSection.grade,

        section:
            gradeSection.section,

        lrn:
            extractBestLRN(text),

        id:
            extractID(text)

    };

}


/* =========================================================
   MERGE OCR RESULTS
   ========================================================= */

function mergeOCRResults(
    current,
    incoming
) {

    if (
        !current.name &&
        incoming.name
    ) {

        current.name =
            incoming.name;

    }


    if (
        !current.grade &&
        incoming.grade
    ) {

        current.grade =
            incoming.grade;

    }


    if (
        !current.section &&
        incoming.section
    ) {

        current.section =
            incoming.section;

    }


    if (
        !isValidLRN(current.lrn) &&
        isValidLRN(incoming.lrn)
    ) {

        current.lrn =
            incoming.lrn;

    }


    if (
        !current.id &&
        incoming.id
    ) {

        current.id =
            incoming.id;

    }


    return current;

}


/* =========================================================
   FAST-FIRST CHECK
   ========================================================= */

/*
   THIS IS THE MAIN NEW PART.

   If we already have:
       VALID 12-DIGIT LRN
       +
       ID NUMBER

   then the database can identify the student.

   There is no reason to spend extra seconds running
   another full OCR pass.
*/

function hasCriticalResults(results) {

    return (
        isValidLRN(results.lrn) &&
        !!results.id
    );

}


/* =========================================================
   OCR OPTIONS
   ========================================================= */

const ocrOptions = {

    tessedit_pageseg_mode: 6,

    preserve_interword_spaces: 1

};


/* =========================================================
   RUN OCR
   ========================================================= */

async function runOCR(image, label, progressStart, progressEnd) {

    const result =
        await Tesseract.recognize(
            image,
            "eng",
            {

                ...ocrOptions,

                logger: message => {

                    if (
                        message.status ===
                        "recognizing text"
                    ) {

                        const localProgress =
                            message.progress || 0;


                        const progress =
                            progressStart +
                            (
                                localProgress *
                                (
                                    progressEnd -
                                    progressStart
                                )
                            );


                        progressBar.style.width =
                            progress + "%";

                    }

                }

            }
        );


    const text =
        result.data.text || "";


    return text;

}


/* =========================================================
   TARGETED LRN OCR
   ========================================================= */

async function performTargetedLRNOCR(
    colorCanvas
) {

    /*
       This remains a fallback only.
       It is NOT run unless the normal OCR passes
       failed to find a valid LRN.
    */

    const width =
        colorCanvas.width;


    const height =
        colorCanvas.height;


    /*
       LRN is normally around the upper/middle
       portion of the ID.

       Use the center portion to avoid unnecessary OCR.
    */

    const cropCanvas =
        document.createElement("canvas");


    cropCanvas.width =
        width;


    cropCanvas.height =
        height * 0.55;


    const ctx =
        cropCanvas.getContext("2d");


    ctx.drawImage(

        colorCanvas,

        0,

        height * 0.15,

        width,

        height * 0.55,

        0,

        0,

        cropCanvas.width,

        cropCanvas.height

    );


    try {

        const result =
            await Tesseract.recognize(

                cropCanvas,

                "eng",

                {

                    ...ocrOptions,

                    logger: message => {

                        if (
                            message.status ===
                            "recognizing text"
                        ) {

                            const progress =
                                95 +
                                (
                                    (message.progress || 0)
                                    * 5
                                );


                            progressBar.style.width =
                                progress + "%";

                        }

                    }

                }

            );


        return extractBestLRN(
            result.data.text || ""
        );

    }

    catch (error) {

        console.error(
            "Targeted LRN OCR error:",
            error
        );

        return "";

    }

}


/* =========================================================
   MAIN SCAN FUNCTION
   ========================================================= */

scanButton.addEventListener(
    "click",
    performOCR
);


async function performOCR() {

    if (!video.srcObject) {

        statusText.textContent =
            "Start the camera first.";

        return;

    }


    scanButton.disabled = true;

    databaseButton.disabled = true;


    progressBar.style.width = "0%";


    statusText.textContent =
        "Capturing ID...";


    ocrResult.value = "";


    /*
       Clear previous values
    */

    nameField.value = "";

    gradeField.value = "";

    sectionField.value = "";

    lrnField.value = "";

    idField.value = "";


    databaseText.textContent =
        "No database check performed.";


    try {

        /*
           Capture image exactly like the
           working version.
        */

        const images =
            captureAndPreprocess();


        const processedCanvas =
            images.processedCanvas;


        const colorCanvas =
            images.colorCanvas;


        /*
           This object stores the best result
           from whichever OCR passes actually run.
        */

        let bestResults = {

            name: "",

            grade: "",

            section: "",

            lrn: "",

            id: ""

        };


        let rawResults = "";


        /* =====================================================
           PASS 1
           ===================================================== */

        statusText.textContent =
            "Scanning...";


        const text1 =
            await runOCR(
                processedCanvas,
                "OCR PASS 1",
                0,
                60
            );


        rawResults +=
            "[OCR PASS 1]\n" +
            text1 +
            "\n";


        const result1 =
            parseOCR(text1);


        bestResults =
            mergeOCRResults(
                bestResults,
                result1
            );


        /*
           FAST-FIRST CHECK
        */

        if (
            hasCriticalResults(bestResults)
        ) {

            console.log(
                "Fast-first success after Pass 1."
            );


            progressBar.style.width =
                "100%";


            statusText.textContent =
                "Scan complete — Pass 1 was enough.";


        }

        else {

            /* =================================================
               PASS 2
               ================================================= */

            statusText.textContent =
                "Improving scan...";


            const sharpenCanvas =
                createSharpenCanvas(
                    processedCanvas
                );


            const text2 =
                await runOCR(
                    sharpenCanvas,
                    "OCR PASS 2",
                    60,
                    85
                );


            rawResults +=
                "\n[OCR PASS 2]\n" +
                text2 +
                "\n";


            const result2 =
                parseOCR(text2);


            bestResults =
                mergeOCRResults(
                    bestResults,
                    result2
                );


            /*
               CHECK AGAIN BEFORE PASS 3
            */

            if (
                hasCriticalResults(
                    bestResults
                )
            ) {

                console.log(
                    "Fast-first success after Pass 2."
                );


                progressBar.style.width =
                    "100%";


                statusText.textContent =
                    "Scan complete — Pass 2 was enough.";

            }

            else {

                /* =============================================
                   PASS 3
                   ============================================= */

                statusText.textContent =
                    "Final OCR pass...";


                const text3 =
                    await runOCR(
                        colorCanvas,
                        "OCR PASS 3",
                        85,
                        95
                    );


                rawResults +=
                    "\n[OCR PASS 3]\n" +
                    text3 +
                    "\n";


                const result3 =
                    parseOCR(text3);


                bestResults =
                    mergeOCRResults(
                        bestResults,
                        result3
                    );

            }

        }


        /* =====================================================
           TARGETED LRN FALLBACK
           ===================================================== */

        if (
            !isValidLRN(
                bestResults.lrn
            )
        ) {

            statusText.textContent =
                "Looking specifically for LRN...";


            const targetedLRN =
                await performTargetedLRNOCR(
                    colorCanvas
                );


            if (
                isValidLRN(targetedLRN)
            ) {

                bestResults.lrn =
                    targetedLRN;


                rawResults +=
                    "\n[TARGETED LRN OCR]\n" +
                    targetedLRN +
                    "\n";

            }

        }


        /* =====================================================
           DISPLAY FINAL RESULTS
           ===================================================== */

        nameField.value =
            bestResults.name || "";


        gradeField.value =
            bestResults.grade || "";


        sectionField.value =
            bestResults.section || "";


        lrnField.value =
            bestResults.lrn || "";


        idField.value =
            bestResults.id || "";


        ocrResult.value =
            rawResults;


        progressBar.style.width =
            "100%";


        /*
           DATABASE CHECK
        */

        if (
            isValidLRN(
                bestResults.lrn
            )
        ) {

            statusText.textContent =
                "Scan complete. Checking database...";


            databaseButton.disabled =
                false;


            /*
               Automatically check database
            */

            await checkDatabase();

        }

        else {

            statusText.textContent =
                "Scan complete, but no valid 12-digit LRN was found.";

        }

    }

    catch (error) {

        console.error(
            "OCR ERROR:",
            error
        );


        statusText.textContent =
            "OCR error: " +
            error.message;

    }


    scanButton.disabled = false;

}


/* =========================================================
   DATABASE BUTTON
   ========================================================= */

databaseButton.addEventListener(
    "click",
    checkDatabase
);


/* =========================================================
   CHECK DATABASE
   ========================================================= */

async function checkDatabase() {

    const lrn =
        lrnField.value.trim();


    if (!isValidLRN(lrn)) {

        databaseText.innerHTML =
            "<span style='color:red'>" +
            "Please scan a valid 12-digit LRN first." +
            "</span>";

        return;

    }


    databaseText.textContent =
        "Checking database...";


    databaseButton.disabled = true;


    try {

        const response =
            await fetch(
                DATABASE_URL +
                "?lrn=" +
                encodeURIComponent(lrn)
            );


        const data =
            await response.json();


        console.log(
            "Database response:",
            data
        );


        if (
            data.status === "success" &&
            data.found
        ) {

            databaseText.innerHTML =

                "<strong style='color:green'>" +
                "STUDENT FOUND" +
                "</strong><br><br>" +

                "<strong>LRN:</strong> " +
                (data.student.lrn || lrn) +
                "<br>" +

                "<strong>Name:</strong> " +
                (data.student.name || "N/A") +
                "<br>" +

                "<strong>ID Number:</strong> " +
                (data.student.idNumber || "N/A") +
                "<br>" +

                "<strong>Grade:</strong> " +
                (data.student.grade || "N/A") +
                "<br>" +

                "<strong>Section:</strong> " +
                (data.student.section || "N/A");


            /*
               Database values can fill in
               missing OCR fields.
            */

            if (
                data.student.name
            ) {

                nameField.value =
                    data.student.name;

            }


            if (
                data.student.grade
            ) {

                gradeField.value =
                    data.student.grade;

            }


            if (
                data.student.section
            ) {

                sectionField.value =
                    data.student.section;

            }


            if (
                data.student.idNumber
            ) {

                idField.value =
                    data.student.idNumber;

            }

        }

        else {

            databaseText.innerHTML =

                "<strong style='color:red'>" +
                "STUDENT NOT FOUND" +
                "</strong><br><br>" +

                "The scanned LRN does not exist " +
                "in the database.";

        }

    }

    catch (error) {

        console.error(
            "DATABASE ERROR:",
            error
        );


        databaseText.innerHTML =

            "<strong style='color:red'>" +
            "DATABASE CONNECTION FAILED" +
            "</strong><br><br>" +

            error.message;

    }


    databaseButton.disabled = false;

}

</script>

</body>

</html>
