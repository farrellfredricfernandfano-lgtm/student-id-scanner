        left: 50%;

        position: absolute;

        top: calc(50% + 150px);

        text-shadow: 0 1px 3px black;

    ================================================= */

        position: absolute;

        width: 100%;

        height: 2px;

        left: 0;

        opacity: 0;

        pointer-events: none;

    }

        opacity: 1;

        animation: scanAnimation 2s linear infinite;

    }

        0% {

            top: 0%;

            top: 100%;

        }

        100% {

            top: 0%;

<script>


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById(
        "video"
    );


const canvas =
    document.getElementById(
        "canvas"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const scanButton =
    document.getElementById(
        "scanButton"
    );


const stopButton =
    document.getElementById(
        "stopButton"
    );


const status =
    document.getElementById(
        "status"
    );


const processedImage =
    document.getElementById(
        "processedImage"
    );


const ocrResult =
    document.getElementById(
        "ocrResult"
    );


const progressContainer =
    document.getElementById(
        "progressContainer"
    );


const progressBar =
    document.getElementById(
        "progressBar"
    );


const scanLine =
    document.getElementById(
        "scanLine"
    );


const nameField =
    document.getElementById(
        "nameField"
    );


const gradeField =
    document.getElementById(
        "gradeField"
    );


const sectionField =
    document.getElementById(
        "sectionField"
    );


const idField =
    document.getElementById(
        "idField"
    );



/* =====================================================
   CAMERA STATE
===================================================== */

let cameraStream = null;

let scanning = false;



/* =====================================================
   CHECK CAMERA SUPPORT
===================================================== */

if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
) {

    status.textContent =
        "Live camera is not supported by this browser.";

}


/* =====================================================
   START CAMERA
===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);


async function startCamera() {

    try {


        status.textContent =
            "Requesting camera...";


        /*
            Make sure we're running
            over HTTPS.
        */

        if (
            location.protocol !==
            "https:" &&
            location.hostname !==
            "localhost"
        ) {

            throw new Error(
                "Camera requires HTTPS."
            );

        }


        /*
            Ask specifically for
            the rear camera.
        */

        const constraints = {

            audio: false,

            video: {

                facingMode: {
                    ideal: "environment"
                },

                width: {
                    ideal: 1920
                },

                height: {
                    ideal: 1080
                },

                frameRate: {
                    ideal: 30
                }

            }

        };


        cameraStream =
            await navigator
                .mediaDevices
                .getUserMedia(
                    constraints
                );


        /*
            Attach camera to video.
        */

        video.srcObject =
            cameraStream;


        await video.play();


        /*
            Get camera information.
        */

        const track =
            cameraStream
                .getVideoTracks()[0];


        console.log(
            "Camera:",
            track.label
        );


        console.log(
            "Camera settings:",
            track.getSettings()
        );


        status.textContent =
            "Camera ready. Align the ID.";


        startButton.disabled =
            true;


        scanButton.disabled =
            false;


        stopButton.disabled =
            false;


    }

    catch (error) {


        console.error(
            error
        );


        status.textContent =
            "Camera error: " +
            error.name;


        /*
            Give useful error information.
        */

        let message =
            "";


        if (
            error.name ===
            "NotAllowedError"
        ) {

            message =
                "Camera permission was denied.\n\n" +
                "Check Chrome's camera permission " +
                "for this website.";

        }

        else if (
            error.name ===
            "NotFoundError"
        ) {

            message =
                "No camera was found.";

        }

        else if (
            error.name ===
            "NotReadableError"
        ) {

            message =
                "The camera is already being used " +
                "by another application.";

        }

        else {

            message =
                error.name +
                "\n\n" +
                error.message;

        }


        alert(
            message
        );

    }

}



/* =====================================================
   STOP CAMERA
===================================================== */

stopButton.addEventListener(
    "click",
    stopCamera
);


function stopCamera() {


    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

    }


    cameraStream =
        null;


    video.srcObject =
        null;


    startButton.disabled =
        false;


    scanButton.disabled =
        true;


    stopButton.disabled =
        true;


    scanLine.classList.remove(
        "active"
    );


    status.textContent =
        "Camera stopped.";

}



/* =====================================================
   SCAN
===================================================== */

scanButton.addEventListener(
    "click",
    captureAndScan
);


async function captureAndScan() {


    if (
        !cameraStream ||
        scanning
    ) {

        return;

    }


    scanning =
        true;


    scanButton.disabled =
        true;


    scanLine.classList.add(
        "active"
    );


    status.textContent =
        "Capturing ID...";


    /*
        Small delay gives the
        camera a moment to stabilize.
    */

    await sleep(200);


    try {


        const videoWidth =
            video.videoWidth;


        const videoHeight =
            video.videoHeight;


        if (
            !videoWidth ||
            !videoHeight
        ) {

            throw new Error(
                "Camera frame is not ready."
            );

        }


        /*
            =================================================
            CROP TO ID GUIDE
            =================================================

            The guide is approximately
            the same aspect ratio as
            a standard ID card.

            We crop the center of
            the camera image instead
            of sending the entire
            camera frame to Tesseract.
        */


        const guideWidthRatio =
            0.88;


        const cropWidth =
            Math.floor(
                videoWidth *
                guideWidthRatio
            );


        const cropHeight =
            Math.floor(
                cropWidth /
                1.586
            );


        const cropX =
            Math.floor(
                (videoWidth -
                    cropWidth) / 2
            );


        const cropY =
            Math.floor(
                (videoHeight -
                    cropHeight) / 2
            );


        /*
            Use a larger canvas
            to upscale the ID.
        */

        const scale =
            2;


        canvas.width =
            cropWidth * scale;


        canvas.height =
            cropHeight * scale;


        const ctx =
            canvas.getContext(
                "2d"
            );


        /*
            Draw only the ID.
        */

        ctx.drawImage(

            video,

            cropX,
            cropY,
            cropWidth,
            cropHeight,

            0,
            0,
            canvas.width,
            canvas.height

        );


        status.textContent =
            "Preprocessing image...";


        /*
            Process the ID.
        */

        preprocessImage(
            ctx,
            canvas.width,
            canvas.height
        );


        /*
            Display processed image.
        */

        processedImage.src =
            canvas.toDataURL(
                "image/jpeg",
                0.95
            );


        processedImage.style.display =
            "block";


        /*
            OCR.
        */

        await performOCR();


    }

    catch (error) {


        console.error(
            error
        );


        status.textContent =
            "Scan failed.";


        ocrResult.textContent =
            error.message;

    }


    scanLine.classList.remove(
        "active"
    );


    scanButton.disabled =
        false;


    scanning =
        false;

}



/* =====================================================
   IMAGE PREPROCESSING
===================================================== */

function preprocessImage(
    ctx,
    width,
    height
) {


    const imageData =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    const data =
        imageData.data;


    /*
        =================================================
        GRAYSCALE
        =================================================
    */

    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {


        const r =
            data[i];


        const g =
            data[i + 1];


        const b =
            data[i + 2];


        const gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;


        data[i] =
            gray;


        data[i + 1] =
            gray;


        data[i + 2] =
            gray;

    }


    /*
        =================================================
        CONTRAST
        =================================================
    */

    const contrast =
        1.7;


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {


        let value =
            data[i];


        value =
            (
                (value - 128) *
                contrast
            ) + 128;


        value =
            Math.max(
                0,
                Math.min(
                    255,
                    value
                )
            );


        data[i] =
            value;


        data[i + 1] =
            value;


        data[i + 2] =
            value;

    }


    /*
        =================================================
        SHARPEN
        =================================================
    */

    const original =
        new Uint8ClampedArray(
            data
        );


    const strength =
        0.3;


    for (
        let y = 1;
        y < height - 1;
        y++
    ) {


        for (
            let x = 1;
            x < width - 1;
            x++
        ) {


            const index =
                (
                    y * width +
                    x
                ) * 4;


            const center =
                original[index];


            const top =
                original[
                    (
                        (y - 1) *
                        width +
                        x
                    ) * 4
                ];


            const bottom =
                original[
                    (
                        (y + 1) *
                        width +
                        x
                    ) * 4
                ];


            const left =
                original[
                    (
                        y *
                        width +
                        x -
                        1
                    ) * 4
                ];


            const right =
                original[
                    (
                        y *
                        width +
                        x +
                        1
                    ) * 4
                ];


            let value =
                center *
                (
                    1 +
                    4 * strength
                )
                -
                strength *
                (
                    top +
                    bottom +
                    left +
                    right
                );


            value =
                Math.max(
                    0,
                    Math.min(
                        255,
                        value
                    )
                );


            data[index] =
                value;


            data[index + 1] =
                value;


            data[index + 2] =
                value;

        }

    }


    /*
        Put processed image
        back on canvas.
    */

    ctx.putImageData(
        imageData,
        0,
        0
    );

}



/* =====================================================
   OCR
===================================================== */

async function performOCR() {


    status.textContent =
        "Starting OCR...";


    ocrResult.textContent =
        "Reading ID...";


    progressContainer.style.display =
        "block";


    progressBar.style.width =
        "0%";


    try {


        const result =
            await Tesseract.recognize(

                canvas,

                "eng",

                {

                    logger:
                        function(info) {


                            console.log(
                                info
                            );


                            if (
                                info.status ===
                                "recognizing text"
                            ) {


                                const percent =
                                    Math.round(
                                        info.progress *
                                        100
                                    );


                                progressBar.style.width =
                                    percent + "%";


                                status.textContent =
                                    "Reading ID: " +
                                    percent +
                                    "%";

                            }

                        },


                    /*
                        Page segmentation mode.

                        6 = assume a single
                        uniform block of text.
                    */

                    tessedit_pageseg_mode:
                        "6"

                }

            );


        const text =
            result.data.text;


        console.log(
            "========== OCR RESULT =========="
        );


        console.log(
            text
        );


        console.log(
            "================================="
        );


        if (
            text &&
            text.trim()
        ) {

            ocrResult.textContent =
                text.trim();

        }

        else {

            ocrResult.textContent =
                "No readable text detected.";

        }


        /*
            Try basic field extraction.
        */

        extractFields(
            text
        );


        progressBar.style.width =
            "100%";


        status.textContent =
            "Scan complete.";

    }

    catch (error) {


        console.error(
            error
        );


        status.textContent =
            "OCR failed.";


        ocrResult.textContent =
            "OCR Error:\n\n" +
            error.message;

    }


    setTimeout(
        function() {

            progressContainer.style.display =
                "none";

        },
        1000
    );

}



/* =====================================================
   BASIC FIELD EXTRACTION
===================================================== */

function extractFields(text) {

```
if (!text) {
    return;
}


/*
    Split OCR result into individual lines.
*/

const lines = text
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(line => line.length > 0);


console.log("OCR LINES:");
console.log(lines);


/*
    =================================================
    NAME
    =================================================

    Based on your ID:

    FARRELL FREDRIC FERNAND F. FANO
    LRN: ...
    ID NO: ...
    GRADE 12- ROENTGEN

    Therefore, the name is most likely
    the first meaningful line.
*/

let name = "";


for (let line of lines) {

    const upper =
        line.toUpperCase();


    /*
        Ignore lines containing
        known labels.
    */

    if (
        upper.includes("LRN") ||
        upper.includes("ID NO") ||
        upper.includes("IDNO") ||
        upper.includes("GRADE")
    ) {
        continue;
    }


    /*
        A name should contain
        mostly letters/spaces.
    */

    const cleaned =
        line.replace(
            /[^A-Za-zÀ-ÿ.' -]/g,
            ""
        ).trim();


    /*
        Require at least two words.
    */

    const words =
        cleaned
            .split(/\s+/)
            .filter(
                word => word.length > 0
            );


    if (
        words.length >= 2 &&
        cleaned.length >= 5
    ) {

        name = cleaned;

        break;

    }

}


/*
    =================================================
    LRN
    =================================================
*/

let lrn = "";


const lrnMatch =
    text.match(
        /LRN\s*[:\-]?\s*([0-9]{8,20})/i
    );


if (lrnMatch) {

    lrn =
        lrnMatch[1];

}


/*
    =================================================
    ID NUMBER
    =================================================

    Example:

    ID NO: 123456 -123

    We keep the format:

    123456-123
*/

let idNumber = "";


const idMatch =
    text.match(
        /ID\s*(?:NO|NUMBER)?\s*[:#\-]?\s*([0-9]+)\s*[-–—]\s*([0-9]+)/i
    );


if (idMatch) {

    idNumber =
        idMatch[1] +
        "-" +
        idMatch[2];

}


/*
    If Tesseract doesn't recognize
    the "ID NO" label correctly,
    try a more general pattern.
*/

if (!idNumber) {

    const generalID =
        text.match(
            /\b([0-9]{4,8})\s*[-–—]\s*([0-9]{2,6})\b/
        );


    if (generalID) {

        idNumber =
            generalID[1] +
            "-" +
            generalID[2];

    }

}


/*
    =================================================
    GRADE + SECTION
    =================================================

    Example:

    GRADE 12- ROENTGEN

    We extract:

    Grade = 12
    Section = ROENTGEN
*/

let grade = "";

let section = "";


const gradeMatch =
    text.match(
        /GRADE\s*(?:LEVEL)?\s*([7-9]|10|11|12)\s*[-–—:]?\s*([A-Za-z0-9][A-Za-z0-9 .'-]*)/i
    );


if (gradeMatch) {

    grade =
        gradeMatch[1];


    section =
        gradeMatch[2]
            .trim();


    /*
        Remove accidental OCR
        punctuation.
    */

    section =
        section
            .replace(
                /^[\s\-:]+/,
                ""
            )
            .replace(
                /[\s\-:]+$/,
                ""
            );

}


/*
    =================================================
    FALLBACK FOR GRADE
    =================================================

    If Tesseract reads:

    GRADE 12

    but misses the section.
*/

if (!grade) {

    const gradeOnly =
        text.match(
            /GRADE\s*(?:LEVEL)?\s*([7-9]|10|11|12)\b/i
        );


    if (gradeOnly) {

        grade =
            gradeOnly[1];

    }

}


/*
    =================================================
    CLEAN SECTION
    =================================================
*/

if (section) {

    /*
        Remove common OCR junk.
    */

    section =
        section
            .replace(
                /^[^A-Za-z0-9]+/,
                ""
            )
            .trim();

}

/* =========================================

function cleanValue(value) {

    return value
        .replace(
            /\s+/g,
            " "
        )
        .trim()
        .replace(
            /^[:\-]+/,
            ""
        )
        .trim();

}


/* =====================================================

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}
