/* =========================================================
   CAMERA

startButton.addEventListener(

/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

    try {

        status.textContent =
            "Starting camera...";

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                audio: false,

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    },

                    frameRate: {
                        ideal: 30
                    }

                }

            });

        video.srcObject =
            cameraStream;

        const track =
            cameraStream
                .getVideoTracks()[0];

        try {

            await track.applyConstraints({

                width: {
                    ideal: 1920
                },

                height: {
                    ideal: 1080
                },

                frameRate: {
                    ideal: 30
                }

            });

        } catch (constraintError) {

            console.log(
                "Could not apply extra camera constraints:",
                constraintError
            );

        }

        startButton.disabled = true;
        scanButton.disabled = false;
        stopButton.disabled = false;

        status.textContent =
            "Camera ready. Align the entire ID inside the green guide.";

    } catch (error) {

        console.error(
            "CAMERA ERROR:",
            error
        );

        status.textContent =
            "Could not access camera: " +
            error.message;

    }

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera() {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        cameraStream = null;

    }

    video.srcObject = null;

    startButton.disabled = false;
    scanButton.disabled = true;
    stopButton.disabled = true;

    status.textContent =
        "Camera stopped.";

}


/* =========================================================
   CAPTURE + SCAN
========================================================= */

async function captureAndScan() {

    if (!cameraStream) {

        alert(
            "Please start the camera first."
        );

        return;

    }

    scanButton.disabled = true;
    databaseButton.disabled = true;

    databaseResult.style.display =
        "none";

    progressBar.style.width =
        "0%";

    status.textContent =
        "Capturing ID...";

    try {

        await performOCR();

    } catch (error) {

        console.error(
            "SCAN ERROR:",
            error
        );

        status.textContent =
            "Scanning failed: " +
            error.message;

    }

    scanButton.disabled = false;

}


/* =========================================================
   IMAGE PREPROCESSING
   STRONGER CHARACTER / BACKGROUND CONTRAST
========================================================= */

function preprocessCanvas(
    sourceCanvas,
    contrast = 1.55

) {

    const ctx =
        sourceCanvas.getContext(
            "2d",
            {
                willReadFrequently:
                    true
            }
        );


    const imageData =
        ctx.getImageData(
            0,
            0,
            sourceCanvas.width,
            sourceCanvas.height
        );


    const data =
        imageData.data;


    /*
     * Stronger contrast formula.
     *
     * This increases the difference between
     * dark characters and lighter backgrounds.
     */

    const factor =
        (
            259 *
            (contrast + 255)
        ) /
        (
            255 *
            (259 - contrast)
        );


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r =
            data[i];

        const g =
            data[i + 1];

        const b =
            data[i + 2];


        /*
         * Convert RGB to grayscale.
         *
         * This removes color information that
         * can interfere with OCR.
         */

        let gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;


        /*
         * Apply stronger contrast.
         */

        gray =
            factor *
            (gray - 128) +
            128;


        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );


        /*
         * STRONG CHARACTER / BACKGROUND SEPARATION
         *
         * Very dark pixels become pure black.
         * Very bright pixels become pure white.
         *
         * The middle range is preserved so that
         * thin/anti-aliased characters aren't
         * completely destroyed.
         */

        if (
            gray <= 70
        ) {

            gray = 0;

        }

        else if (
            gray >= 215
        ) {

            gray = 255;

        }

        else {

            /*
             * Stretch the remaining middle range
             * between black and white.
             */

            gray =
                (
                    (gray - 70) /
                    (215 - 70)
                ) * 255;

        }


        /*
         * Keep the image grayscale.
         */

        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );

}


/* =========================================================
   MAIN OCR PASS 1 + PASS 2 ONLY
========================================================= */

async function performOCR() {

    status.textContent =
        "Preparing ID image...";

    const videoWidth =
        video.videoWidth;

    const videoHeight =
        video.videoHeight;

    if (
        !videoWidth ||
        !videoHeight
    ) {

        throw new Error(
            "Camera image is not ready."
        );

    }


    /* =====================================================
       1850 × 617 CROP
    ===================================================== */

    const targetWidth = 1850;
    const targetHeight = 617;

    const targetRatio =
        targetWidth /
        targetHeight;

    let finalCropWidth;
    let finalCropHeight;

    if (
        videoWidth /
        videoHeight >
        targetRatio
    ) {

        finalCropHeight =
            videoHeight * 0.92;

        finalCropWidth =
            finalCropHeight *
            targetRatio;

    } else {

        finalCropWidth =
            videoWidth * 0.92;

        finalCropHeight =
            finalCropWidth /
            targetRatio;

    }

    const cropX =
        (videoWidth -
        finalCropWidth) / 2;

    const cropY =
        (videoHeight -
        finalCropHeight) / 2;


    /* =====================================================
       EXACT 1850 × 617 OUTPUT
    ===================================================== */

    canvas.width =
        targetWidth;

    canvas.height =
        targetHeight;

    const ctx =
        canvas.getContext("2d");

    ctx.imageSmoothingEnabled =
        true;

    ctx.imageSmoothingQuality =
        "high";

    ctx.drawImage(

        video,

        cropX,
        cropY,
        finalCropWidth,
        finalCropHeight,

        0,
        0,
        targetWidth,
        targetHeight

    );


    status.textContent =
        "Enhancing image...";

    preprocessCanvas(
        canvas,
        1.55
    );


    processedImage.src =
        canvas.toDataURL(
            "image/png"
        );

    processedImage.style.display =
        "block";


    /* =====================================================
       OCR PASS 1
    ===================================================== */

    status.textContent =
        "Reading ID information...";

    const result1 =
        await Tesseract.recognize(
            canvas,
            "eng",
            {

                logger: function(info) {

                    console.log(
                        "TESSERACT PASS 1:",
                        info
                    );

                    if (
                        info.progress !==
                        undefined
                    ) {

                        progressBar.style.width =
                            (info.progress * 40) +
                            "%";

                    }

                    if (info.status) {

                        status.textContent =
                            info.status;

                    }

                },

                tessedit_pageseg_mode: 6,

                preserve_interword_spaces: 1

            }
        );

    const textPass1 =
        result1.data.text;

    console.log(
        "OCR PASS 1:",
        textPass1
    );

    const pass1Results =
        parseOCR(textPass1);

    let bestResults = {

        name:
            pass1Results.name,

        grade:
            pass1Results.grade,

        section:
            pass1Results.section,

        lrn:
            pass1Results.lrn,

        id:
            pass1Results.id

    };


    /* =====================================================
       OCR PASS 2 SHARPENED
    ===================================================== */

    status.textContent =
        "Running second OCR pass...";

    const sharpenCanvas =
        document.createElement(
            "canvas"
        );

    sharpenCanvas.width =
        canvas.width;

    sharpenCanvas.height =
        canvas.height;

    const sharpenCtx =
        sharpenCanvas.getContext(
            "2d"
        );

    sharpenCtx.drawImage(
        canvas,
        0,
        0
    );

    const imageData =
        sharpenCtx.getImageData(
            0,
            0,
            sharpenCanvas.width,
            sharpenCanvas.height
        );

    const data =
        imageData.data;

    const original =
        new Uint8ClampedArray(
            data
        );

    const w =
        sharpenCanvas.width;

    const h =
        sharpenCanvas.height;

    for (
        let y = 1;
        y < h - 1;
        y++
    ) {

        for (
            let x = 1;
            x < w - 1;
            x++
        ) {

            const index =
                (y * w + x) * 4;

            for (
                let c = 0;
                c < 3;
                c++
            ) {

                const center =
                    original[
                        index + c
                    ];

                const top =
                    original[
                        index -
                        w * 4 +
                        c
                    ];

                const bottom =
                    original[
                        index +
                        w * 4 +
                        c
                    ];

                const left =
                    original[
                        index -
                        4 +
                        c
                    ];

                const right =
                    original[
                        index +
                        4 +
                        c
                    ];

                const sharpened =
                    (
                        5 * center -
                        top -
                        bottom -
                        left -
                        right
                    );

                data[
                    index + c
                ] =
                    Math.max(
                        0,
                        Math.min(
                            255,
                            sharpened
                        )
                    );

            }

        }

    }

    sharpenCtx.putImageData(
        imageData,
        0,
        0
    );


    const result2 =
        await Tesseract.recognize(
            sharpenCanvas,
            "eng",
            {

                logger: function(info) {

                    console.log(
                        "TESSERACT PASS 2:",
                        info
                    );

                    if (
                        info.progress !==
                        undefined
                    ) {

                        progressBar.style.width =
                            (
                                40 +
                                info.progress * 40
                            ) +
                            "%";

                    }

                },

                tessedit_pageseg_mode: 6,

                preserve_interword_spaces: 1

            }
        );

    const textPass2 =
        result2.data.text;

    console.log(
        "OCR PASS 2:",
        textPass2
    );

    const pass2Results =
        parseOCR(textPass2);

    bestResults =
        mergeOCRResults(
            bestResults,
            pass2Results
        );


    /* =====================================================
       SHOW RAW OCR
    ===================================================== */

    rawOCR.textContent =
        "[OCR PASS 1]\n" +
        textPass1 +
        "\n\n" +
        "[OCR PASS 2]\n" +
        textPass2;


    /* =====================================================
       INITIAL RESULTS
    ===================================================== */

    nameField.value =
        bestResults.name;

    gradeField.value =
        bestResults.grade;

    sectionField.value =
        bestResults.section;

    lrnField.value =
        bestResults.lrn;

    idField.value =
        bestResults.id;

    console.log(
        "MERGED OCR RESULTS:",
        bestResults
    );


    /* =====================================================
       DATABASE IDENTIFICATION
    ===================================================== */

    const hasLRN =
        isValidLRN(
            bestResults.lrn
        );

    const hasID =
        normalizeIDNumber(
            bestResults.id
        ).length > 0;

    const hasName =
        bestResults.name
            .trim()
            .length >= 5;

    const hasSupportingInfo =
        (
            bestResults.grade
                .trim()
                .length > 0
        ) ||
        (
            bestResults.section
                .trim()
                .length > 0
        );

    if (
        hasLRN ||
        hasID ||
        (
            hasName &&
            hasSupportingInfo
        )
    ) {

        status.textContent =
            "OCR complete. Identifying student...";

        await checkDatabase();

    } else {

        progressBar.style.width =
            "100%";

        status.textContent =
            "OCR complete. No usable identifier was detected.";

        databaseButton.disabled =
            false;

    }

}


/* =========================================================
   TARGETED LRN OCR
========================================================= */

async function performTargetedLRNOCR(
    fullCanvas
) {

    const width =
        fullCanvas.width;

    const height =
        fullCanvas.height;


    const x =
        width * 0.05;

    const y =
        height * 0.25;

    const cropWidth =
        width * 0.90;

    const cropHeight =
        height * 0.18;

    const scale = 3;

    lrnCanvas.width =
        Math.round(
            cropWidth * scale
        );

    lrnCanvas.height =
        Math.round(
            cropHeight * scale
        );

    const ctx =
        lrnCanvas.getContext(
            "2d"
        );

    ctx.imageSmoothingEnabled =
        true;

    ctx.imageSmoothingQuality =
        "high";

    ctx.drawImage(

        fullCanvas,

        x,
        y,
        cropWidth,
        cropHeight,

        0,
        0,
        lrnCanvas.width,
        lrnCanvas.height

    );

    preprocessCanvas(
        lrnCanvas,
        1.6
    );

    console.log(
        "Running targeted LRN OCR..."
    );

    const result =
        await Tesseract.recognize(

            lrnCanvas,

            "eng",

            {

                logger:
                    function(info) {

                        console.log(
                            "LRN OCR:",
                            info
                        );

                    },

                tessedit_pageseg_mode: 7,

                tessedit_char_whitelist:
                    "LRN:0123456789"

            }

        );

    const text =
        result.data.text;

    console.log(
        "TARGETED LRN RESULT:",
        text
    );

    return extractBestLRN(
        text
    );

}


/* =========================================================
   OCR PARSING
   IMPROVED IDENTIFICATION
========================================================= */

function parseOCR(text) {

    const result = {

        name: "",
        grade: "",
        section: "",
        lrn: "",
        id: ""

    };


    const lines =
        String(text)
            .split(/\r?\n/)
            .map(
                line =>
                    line.trim()
            )
            .filter(
                line =>
                    line.length > 0
            );


    /* =====================================================
       LRN
    ===================================================== */

    const lrn =
        extractBestLRN(text);

    if (
        lrn
    ) {

        result.lrn =
            lrn;

    }


    /* =====================================================
       ID NUMBER
    ===================================================== */

    result.id =
        parseIDFromText(text);


    /* =====================================================
       GRADE + SECTION
    ===================================================== */

    const gradeSection =
        parseGradeAndSection(text);

    result.grade =
        gradeSection.grade;

    result.section =
        gradeSection.section;


    /* =====================================================
       NAME
    ===================================================== */

    result.name =
        parseNameFromText(
            lines
        );


    console.log(
        "PARSED OCR PASS:",
        result
    );

    return result;

}


/* =========================================================
   IMPROVED NAME PARSER
========================================================= */

function parseNameFromText(lines) {

    if (
        !Array.isArray(lines)
    ) {

        return "";

    }


    const candidates = [];


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i];

        const upper =
            line.toUpperCase();


        /*
         * Never consider obvious non-name fields.
         */

        if (
            upper.includes("LRN") ||
            upper.includes("ID NO") ||
            upper.includes("ID NUMBER") ||
            upper.includes("GRADE") ||
            upper.includes("SECTION")
        ) {

            continue;

        }


        const cleaned =
            line
                .replace(
                    /[^A-Za-zÀ-ÿ.' -]/g,
                    ""
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();


        if (
            !cleaned
        ) {

            continue;

        }


        const words =
            cleaned
                .split(/\s+/)
                .filter(
                    word =>
                        word.length > 0
                );


        const letterCount =
            (
                cleaned.match(
                    /[A-Za-zÀ-ÿ]/g
                ) || []
            ).length;


        if (
            words.length < 2 ||
            cleaned.length < 5 ||
            letterCount < 4
        ) {

            continue;

        }


        /*
         * Reject lines that look strongly numeric.
         */

        const digits =
            (
                line.match(
                    /[0-9]/g
                ) || []
            ).length;


        if (
            digits > 2
        ) {

            continue;

        }


        let score = 0;


        /*
         * The name is normally near the beginning
         * of the ID.
         */

        if (
            i === 0
        ) {

            score += 5;

        }

        else if (
            i === 1
        ) {

            score += 3;

        }

        else if (
            i === 2
        ) {

            score += 1;

        }


        /*
         * Names commonly contain multiple words.
         */

        if (
            words.length >= 3
        ) {

            score += 3;

        }

        else if (
            words.length === 2
        ) {

            score += 1;

        }


        /*
         * Penalize lines containing obvious
         * field-like characters.
         */

        if (
            /[:=#]/.test(line)
        ) {

            score -= 3;

        }


        /*
         * Penalize lines that are mostly uppercase
         * only when they look like labels.
         */

        if (
            /^[A-Z\s.'-]+$/.test(cleaned) &&
            words.length <= 2
        ) {

            score -= 1;

        }


        candidates.push({

            name: cleaned,

            score: score,

            position: i

        });

    }


    if (
        candidates.length === 0
    ) {

        return "";

    }


    candidates.sort(
        function(a, b) {

            if (
                b.score !== a.score
            ) {

                return b.score -
                    a.score;

            }

            return a.position -
                b.position;

        }
    );


    return candidates[0].name;

}


/* =========================================================
   IMPROVED ID NUMBER PARSER
========================================================= */

function parseIDFromText(text) {

    if (!text) {
        return "";
    }


    const source =
        String(text);


    /*
     * Look for ID NO / ID NUMBER first.
     */

    const labeled =
        source.match(

            /ID\s*(?:NO|NUMBER)?\s*[:#.\-]?\s*([0-9OoQqIiLl|SsBbGg]{3,})\s*[-–—\s]\s*([0-9OoQqIiLl|SsBbGg]{2,})\s*[-–—\s]?\s*([A-Za-z0-9]{2,5})?/i

        );


    if (
        labeled
    ) {

        const part1 =
            cleanIDDigits(
                labeled[1]
            );

        const part2 =
            cleanIDDigits(
                labeled[2]
            );

        if (
            part1.length >= 3 &&
            part2.length >= 2
        ) {

            let id =
                part1 +
                "-" +
                part2;


            if (
                labeled[3]
            ) {

                id +=
                    "-" +
                    normalizeIDSuffix(
                        labeled[3]
                    );

            }


            return id;

        }

    }


    /*
     * Search for the ID structure without
     * requiring the label.
     */

    const fallback =
        source.match(

            /\b([0-9OoQqIiLl|SsBbGg]{5,})\s*[-–—\s]\s*([0-9OoQqIiLl|SsBbGg]{2,})\s*[-–—\s]?\s*(SHS|JHS|5H5|JH5)?\b/i

        );


    if (
        fallback
    ) {

        const part1 =
            cleanIDDigits(
                fallback[1]
            );

        const part2 =
            cleanIDDigits(
                fallback[2]
            );


        if (
            part1.length >= 5 &&
            part2.length >= 2
        ) {

            let id =
                part1 +
                "-" +
                part2;


            if (
                fallback[3]
            ) {

                id +=
                    "-" +
                    normalizeIDSuffix(
                        fallback[3]
                    );

            }


            return id;

        }

    }


    return "";

}


/* =========================================================
   GRADE + SECTION PARSER
========================================================= */

function parseGradeAndSection(text) {

    if (!text) {

        return {
            grade: "",
            section: ""
        };

    }


    const source =
        String(text);


    /*
     * Normal GRADE pattern.
     */

    let match =
        source.match(

            /GRADE\s*(?:LEVEL)?\s*(7|8|9|10|11|12|I2|l2)\s*[-–—:]?\s*([A-Za-z0-9][A-Za-z0-9 .'-]*)/i

        );


    /*
     * OCR-tolerant GRADE pattern.
     */

    if (
        !match
    ) {

        match =
            source.match(

                /\bG[A-Z0-9]*R[A-Z0-9]*D[A-Z0-9]*E?\s*[^0-9]{0,3}(7|8|9|10|11|12|I2|l2)\s*[-–—:]?\s*([A-Za-z0-9 .'-]+)/i

            );

    }


    if (
        match
    ) {

        return {

            grade:
                normalizeGrade(
                    match[1]
                ),

            section:
                cleanSection(
                    match[2]
                )

        };

    }


    /*
     * Last fallback for:
     *
     * 12 - ROENTGEN
     */

    const fallback =
        source.match(

            /\b(7|8|9|10|11|12|I2|l2)\s*[-–—:]\s*([A-Za-z][A-Za-z0-9 .'-]*)/i

        );


    if (
        fallback
    ) {

        return {

            grade:
                normalizeGrade(
                    fallback[1]
                ),

            section:
                cleanSection(
                    fallback[2]
                )

        };

    }


    return {

        grade: "",
        section: ""

    };

}


/* =========================================================
   MERGE OCR RESULTS
   IMPROVED RESULT SELECTION
========================================================= */

function mergeOCRResults(
    bestResults,
    newResults
) {


    /* =====================================================
       NAME
    ===================================================== */

    if (
        !bestResults.name &&
        newResults.name
    ) {

        bestResults.name =
            newResults.name;

    }

    else if (
        bestResults.name &&
        newResults.name
    ) {

        const oldScore =
            scoreName(
                bestResults.name
            );

        const newScore =
            scoreName(
                newResults.name
            );


        if (
            newScore >
            oldScore
        ) {

            bestResults.name =
                newResults.name;

        }

    }


    /* =====================================================
       GRADE
    ===================================================== */

    if (
        !bestResults.grade &&
        newResults.grade
    ) {

        bestResults.grade =
            newResults.grade;

    }


    /* =====================================================
       SECTION
    ===================================================== */

    if (
        !bestResults.section &&
        newResults.section
    ) {

        bestResults.section =
            newResults.section;

    }

    else if (
        bestResults.section &&
        newResults.section
    ) {

        if (
            newResults.section.length >
            bestResults.section.length
        ) {

            bestResults.section =
                newResults.section;

        }

    }


    /* =====================================================
       LRN
    ===================================================== */

    if (
        isValidLRN(
            newResults.lrn
        )
    ) {

        if (
            !isValidLRN(
                bestResults.lrn
            ) ||
            bestResults.lrn !==
            newResults.lrn
        ) {

            bestResults.lrn =
                newResults.lrn;

        }

    }

    else if (
        !bestResults.lrn &&
        newResults.lrn
    ) {

        bestResults.lrn =
            newResults.lrn;

    }


    /* =====================================================
       ID NUMBER
    ===================================================== */

    if (
        !bestResults.id &&
        newResults.id
    ) {

        bestResults.id =
            newResults.id;

    }

    else if (
        bestResults.id &&
        newResults.id
    ) {

        const oldID =
            normalizeIDNumber(
                bestResults.id
            );

        const newID =
            normalizeIDNumber(
                newResults.id
            );


        if (
            newID.length >
            oldID.length
        ) {

            bestResults.id =
                newResults.id;

        }

    }


    return bestResults;

}


/* =========================================================
   NAME SCORE
========================================================= */

function scoreName(name) {

    if (!name) {
        return 0;
    }


    const words =
        String(name)
            .trim()
            .split(/\s+/)
            .filter(
                word =>
                    word.length > 0
            );


    let score = 0;


    if (
        words.length >= 2
    ) {

        score += 3;

    }


    if (
        words.length >= 3
    ) {

        score += 3;

    }


    const letters =
        (
            String(name)
                .match(
                    /[A-Za-zÀ-ÿ]/g
                ) || []
        ).length;


    score +=
        Math.min(
            letters,
            20
        ) / 5;


    if (
        String(name)
            .length >= 10
    ) {

        score += 1;

    }


    if (
        /\d/.test(
            String(name)
        )
    ) {

        score -= 4;

    }


    if (
        /LRN|ID\s*NO|GRADE|SECTION/i.test(
            String(name)
        )
    ) {

        score -= 10;

    }


    return score;

}


/* =========================================================
   LRN EXTRACTION
   Improved to recognize both complete and
   shorter detected numbers.
========================================================= */

function extractBestLRN(text) {

    if (!text) {
        return "";
    }


    const source =
        String(text);


    /*
     * -----------------------------------------------------
     * 1. LRN label has highest priority.
     * -----------------------------------------------------
     */

    const labeledMatches =
        source.match(

            /LRN\s*[:#=\-]?\s*([0-9OoQqIiLl|SsBbGg\s]{1,30})/gi

        );


    if (
        labeledMatches
    ) {

        const labeledCandidates = [];


        for (
            const labeled of labeledMatches
        ) {

            const numberPart =
                labeled.replace(

                    /^.*?LRN\s*[:#=\-]?\s*/i,

                    ""

                );


            const candidates =
                getLRNCandidates(
                    numberPart
                );


            for (
                const candidate of candidates
            ) {

                if (
                    candidate &&
                    !labeledCandidates.includes(
                        candidate
                    )
                ) {

                    labeledCandidates.push(
                        candidate
                    );

                }

            }

        }


        /*
         * Always prefer a complete 12-digit LRN.
         */

        for (
            const candidate of labeledCandidates
        ) {

            if (
                isValidLRN(candidate)
            ) {

                return candidate;

            }

        }


        /*
         * If OCR only captured part of the LRN,
         * return the longest available candidate.
         */

        labeledCandidates.sort(
            function(a, b) {

                return b.length -
                    a.length;

            }
        );


        if (
            labeledCandidates.length > 0
        ) {

            return labeledCandidates[0];

        }

    }


    /*
     * -----------------------------------------------------
     * 2. Search entire OCR text.
     * -----------------------------------------------------
     */

    const digitGroups =
        source.match(

            /[0-9OoQqIiLl|SsBbGg][0-9OoQqIiLl|SsBbGg\s]{0,30}/g

        );


    if (
        digitGroups
    ) {

        const candidates = [];


        for (
            const group of digitGroups
        ) {

            const found =
                getLRNCandidates(
                    group
                );


            for (
                const candidate of found
            ) {

                if (
                    candidate &&
                    !candidates.includes(
                        candidate
                    )
                ) {

                    candidates.push(
                        candidate
                    );

                }

            }

        }


        /*
         * Prefer a complete 12-digit candidate.
         */

        for (
            const candidate of candidates
        ) {

            if (
                isValidLRN(candidate)
            ) {

                return candidate;

            }

        }


        /*
         * Otherwise use the longest detected
         * number.
         */

        candidates.sort(
            function(a, b) {

                return b.length -
                    a.length;

            }
        );


        if (
            candidates.length > 0
        ) {

            return candidates[0];

        }

    }


    return "";

}


/* =========================================================
   LRN CANDIDATES
========================================================= */

function getLRNCandidates(value) {

    const cleaned =
        cleanDigits(value);

    const candidates = [];


    if (
        !cleaned
    ) {

        return candidates;

    }


    /*
     * -----------------------------------------------------
     * 1–12 digits
     * -----------------------------------------------------
     */

    if (
        cleaned.length <= 12
    ) {

        candidates.push(
            cleaned
        );

        return candidates;

    }


    /*
     * -----------------------------------------------------
     * MORE THAN 12 DIGITS
     *
     * Check every possible 12-digit window.
     * -----------------------------------------------------
     */

    for (
        let i = 0;
        i <= cleaned.length - 12;
        i++
    ) {

        const candidate =
            cleaned.substring(
                i,
                i + 12
            );


        if (
            /^\d{12}$/.test(
                candidate
            ) &&
            !candidates.includes(
                candidate
            )
        ) {

            candidates.push(
                candidate
            );

        }

    }


    return candidates;

}


/* =========================================================
   CLEAN DIGITS
========================================================= */

function cleanDigits(value) {

    return String(value)

        .toUpperCase()

        .replace(
            /[OoQq]/g,
            "0"
        )

        .replace(
            /[IiLl|]/g,
            "1"
        )

        .replace(
            /[Ss]/g,
            "5"
        )

        .replace(
            /[Bb]/g,
            "8"
        )

        .replace(
            /[Gg]/g,
            "6"
        )

        .replace(
            /[^0-9]/g,
            ""
        );

}


/* =========================================================
   ID NUMBER NORMALIZATION
========================================================= */

function cleanIDDigits(value) {

    return String(value)

        .toUpperCase()

        .replace(
            /[OoQq]/g,
            "0"
        )

        .replace(
            /[IiLl]/g,
            "1"
        )

        .replace(
            /[Bb]/g,
            "8"
        )

        .replace(
            /[Gg]/g,
            "6"
        )

        .replace(
            /[^0-9]/g,
            ""
        );

}


function normalizeIDSuffix(value) {

    return String(value)

        .toUpperCase()

        .replace(
            /5H5/g,
            "SHS"
        )

        .replace(
            /JH5/g,
            "JHS"
        )

        .replace(
            /[^A-Z0-9]/g,
            ""
        );

}


function normalizeIDNumber(value) {

    const source =
        String(value)
            .toUpperCase()
            .trim();


    const match =
        source.match(

            /^([0-9OoQq]{3,})[\s\-._]*([0-9OoQq]{2,})[\s\-._]*([A-Z0-9]{2,5})?$/

        );


    if (
        match
    ) {

        let result =
            cleanIDDigits(
                match[1]
            ) +
            cleanIDDigits(
                match[2]
            );


        if (
            match[3]
        ) {

            result +=
                normalizeIDSuffix(
                    match[3]
                );

        }


        return result;

    }


    return source
        .replace(
            /[^A-Z0-9]/g,
            ""
        );

}


/* =========================================================
   GRADE NORMALIZATION
========================================================= */

function normalizeGrade(value) {

    const source =
        String(value)
            .toUpperCase()
            .replace(
                /[IiLl]/g,
                "1"
            )
            .replace(
                /[OoQ]/g,
                "0"
            );


    const match =
        source.match(
            /7|8|9|10|11|12/
        );


    return match
        ? match[0]
        : "";

}


/* =========================================================
   SECTION CLEANING
========================================================= */

function cleanSection(section) {

    return String(section)

        .replace(
            /\s+/g,
            " "
        )

        .replace(
            /^[\-–—:\s]+/,
            ""
        )

        .trim();

}


/* =========================================================
   LRN VALIDATION
========================================================= */

function isValidLRN(lrn) {

    return /^\d{12}$/.test(
        String(lrn).trim()
    );

}


/* =========================================================
   DATABASE CHECK
========================================================= */

async function checkDatabase() {

    const lrn =
        lrnField.value.trim();

    const idNumber =
        idField.value.trim();

    const name =
        nameField.value.trim();

    const grade =
        gradeField.value.trim();

    const section =
        sectionField.value.trim();


    if (
        !isValidLRN(lrn) &&
        !normalizeIDNumber(idNumber) &&
        name.length < 5
    ) {

        status.textContent =
            "No usable student identifier was detected.";

        databaseButton.disabled =
            false;

        return;

    }


    if (
        DATABASE_URL.includes(
            "PASTE_YOUR"
        )
    ) {

        alert(
            "Apps Script URL has not been entered."
        );

        databaseButton.disabled =
            false;

        return;

    }


    status.textContent =
        "Identifying student...";

    databaseButton.disabled =
        true;

    databaseResult.style.display =
        "none";


    try {

        const params =
            new URLSearchParams({

                lrn: lrn,

                id: idNumber,

                name: name,

                grade: grade,

                section: section

            });


        const url =
            DATABASE_URL +
            "?" +
            params.toString();


        console.log(
            "DATABASE REQUEST:",
            url
        );


        const response =
            await fetch(url);


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP error: " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "DATABASE RESULT:",
            result
        );


        if (
            result.match === true
        ) {

            databaseResult.style.display =
                "block";

            databaseResult.className =
                "database-result valid";

            databaseStatus.textContent =
                "🟢 VALID STUDENT";


            let similarityText =
                "";


            if (
                result.nameSimilarity !==
                undefined
            ) {

                similarityText +=
                    "<br><strong>Name similarity:</strong> " +
                    escapeHTML(
                        String(
                            result.nameSimilarity
                        )
                    ) +
                    "%";

            }


            if (
                result.sectionSimilarity !==
                undefined
            ) {

                similarityText +=
                    "<br><strong>Section similarity:</strong> " +
                    escapeHTML(
                        String(
                            result.sectionSimilarity
                        )
                    ) +
                    "%";

            }


            databaseDetails.innerHTML =

                "<strong>Identification method:</strong> " +
                escapeHTML(
                    result.method ||
                    "Database match"
                ) +

                similarityText +

                "<br><br>" +

                "<strong>Name:</strong> " +
                escapeHTML(
                    result.student.name
                ) +

                "<br><br>" +

                "<strong>LRN:</strong> " +
                escapeHTML(
                    result.student.lrn
                ) +

                "<br><br>" +

                "<strong>ID Number:</strong> " +
                escapeHTML(
                    result.student.idNumber
                ) +

                "<br><br>" +

                "<strong>Grade:</strong> " +
                escapeHTML(
                    result.student.grade
                ) +

                "<br><br>" +

                "<strong>Section:</strong> " +
                escapeHTML(
                    result.student.section
                );


            /*
             * Once identified, replace
             * imperfect OCR with database data.
             */

            nameField.value =
                result.student.name ||
                "";

            gradeField.value =
                result.student.grade ||
                "";

            sectionField.value =
                result.student.section ||
                "";

            lrnField.value =
                result.student.lrn ||
                "";

            idField.value =
                result.student.idNumber ||
                "";


            status.textContent =
                "Student identified successfully.";

        }


        else if (
            result.ambiguous === true
        ) {

            databaseResult.style.display =
                "block";

            databaseResult.className =
                "database-result invalid";

            databaseStatus.textContent =
                "🟠 MATCH IS AMBIGUOUS";


            databaseDetails.innerHTML =
                "The scanned information was not unique " +
                "enough to safely identify one student.";


            status.textContent =
                "Multiple possible students found.";

        }


        else {

            databaseResult.style.display =
                "block";

            databaseResult.className =
                "database-result invalid";

            databaseStatus.textContent =
                "🔴 STUDENT NOT FOUND";


            databaseDetails.innerHTML =

                "<strong>Name:</strong> " +
                escapeHTML(
                    name ||
                    "Not detected"
                ) +

                "<br>" +

                "<strong>LRN:</strong> " +
                escapeHTML(
                    lrn ||
                    "Not detected"
                ) +

                "<br>" +

                "<strong>ID Number:</strong> " +
                escapeHTML(
                    idNumber ||
                    "Not detected"
                ) +

                "<br>" +

                "<strong>Grade:</strong> " +
                escapeHTML(
                    grade ||
                    "Not detected"
                ) +

                "<br>" +

                "<strong>Section:</strong> " +
                escapeHTML(
                    section ||
                    "Not detected"
                );


            status.textContent =
                "No matching student.";

        }


    } catch (error) {

        console.error(
            "DATABASE ERROR:",
            error
        );


        databaseResult.style.display =
            "block";

        databaseResult.className =
            "database-result invalid";

        databaseStatus.textContent =
            "⚠️ DATABASE CONNECTION FAILED";


        databaseDetails.innerHTML =

            "Could not connect to Google Apps Script." +

            "<br><br>" +

            "<small>" +

            escapeHTML(
                error.message
            ) +

            "</small>";


        status.textContent =
            "Database connection failed.";

    } finally {

        databaseButton.disabled =
            false;

    }

}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
