/* =========================================================
   CAPTURE + OCR
========================================================= */

async function captureAndScan() {

        );

        true;

            "Scanning failed: " +
            error.message;

    }

        false;

}


/* =========================================================
   OCR
========================================================= */

async function performOCR() {

    status.textContent =
        "Processing image...";


    const videoWidth =
        video.videoWidth;

    const videoHeight =
        video.videoHeight;


    if (
        !videoWidth ||
        !videoHeight
    ) {

        throw new Error(
            "Camera image is not ready."
        );

    }


    /*
       ID CARD CROP
       Same basic crop as your working version.
    */

    const cropWidth =
        videoWidth * 0.88;


    const cropHeight =
        cropWidth / 1.586;


    const cropX =
        (videoWidth - cropWidth) / 2;


    const cropY =
        (videoHeight - cropHeight) / 2;


    /*
       UPSCALE
    */

    const scale = 2;


    canvas.width =
        cropWidth * scale;

    canvas.height =
        cropHeight * scale;


    const ctx =
        canvas.getContext("2d");


    /*
       Improve image scaling quality.
    */

    ctx.imageSmoothingEnabled =
        true;

    ctx.imageSmoothingQuality =
        "high";


    ctx.drawImage(

        video,

        cropX,
        cropY,
        cropWidth,
        cropHeight,

        0,
        0,
        canvas.width,
        canvas.height

    );


    status.textContent =
        "Enhancing image...";


    /* =====================================================
       IMAGE PREPROCESSING
    ===================================================== */

    const imageData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


    const data =
        imageData.data;


    /*
       STEP 1
       Grayscale + contrast.

       This keeps the same basic enhancement
       from your previous working version.
    */

    const contrast =
        1.5;


    const factor =
        (259 * (contrast + 255)) /
        (255 * (259 - contrast));


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r =
            data[i];

        const g =
            data[i + 1];

        const b =
            data[i + 2];


        let gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;


        gray =
            factor *
            (gray - 128) +
            128;


        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );


        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    /*
       STEP 2
       LIGHT NOISE REDUCTION

       A small 3x3 averaging filter is used.

       This helps reduce tiny camera noise without
       destroying larger characters.
    */

    const sourceData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


    const source =
        sourceData.data;


    const filteredData =
        new ImageData(
            canvas.width,
            canvas.height
        );


    const filtered =
        filteredData.data;


    const width =
        canvas.width;

    const height =
        canvas.height;


    for (
        let y = 1;
        y < height - 1;
        y++
    ) {

        for (
            let x = 1;
            x < width - 1;
            x++
        ) {

            const center =
                (y * width + x) * 4;


            /*
               Weighted blur.

               Center pixel gets more weight so
               text edges are not excessively blurred.
            */

            let total =
                source[center] * 4;


            total +=
                source[
                    ((y - 1) * width + x) * 4
                ];


            total +=
                source[
                    ((y + 1) * width + x) * 4
                ];


            total +=
                source[
                    (y * width + x - 1) * 4
                ];


            total +=
                source[
                    (y * width + x + 1) * 4
                ];


            const value =
                total / 8;


            filtered[center] =
                value;

            filtered[center + 1] =
                value;

            filtered[center + 2] =
                value;

            filtered[center + 3] =
                255;

        }

    }


    /*
       Preserve the outside border.
    */

    for (
        let x = 0;
        x < width;
        x++
    ) {

        let top =
            x * 4;

        let bottom =
            ((height - 1) * width + x) * 4;


        filtered[top] =
            source[top];

        filtered[top + 1] =
            source[top + 1];

        filtered[top + 2] =
            source[top + 2];

        filtered[top + 3] =
            255;


        filtered[bottom] =
            source[bottom];

        filtered[bottom + 1] =
            source[bottom + 1];

        filtered[bottom + 2] =
            source[bottom + 2];

        filtered[bottom + 3] =
            255;

    }


    for (
        let y = 0;
        y < height;
        y++
    ) {

        const left =
            (y * width) * 4;

        const right =
            (y * width + width - 1) * 4;


        filtered[left] =
            source[left];

        filtered[left + 1] =
            source[left + 1];

        filtered[left + 2] =
            source[left + 2];

        filtered[left + 3] =
            255;


        filtered[right] =
            source[right];

        filtered[right + 1] =
            source[right + 1];

        filtered[right + 2] =
            source[right + 2];

        filtered[right + 3] =
            255;

    }


    ctx.putImageData(
        filteredData,
        0,
        0
    );


    /*
       STEP 3
       SHARPENING

       This makes character edges more distinct.

       It is intentionally kept moderate so that
       small letters do not become noisy.
    */

    const sharpenSource =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    const sharpenInput =
        sharpenSource.data;


    const sharpened =
        new ImageData(
            width,
            height
        );


    const sharpenOutput =
        sharpened.data;


    /*
       Sharpening kernel:

           0  -1   0
          -1   5  -1
           0  -1   0

       This increases edge definition.
    */

    for (
        let y = 1;
        y < height - 1;
        y++
    ) {

        for (
            let x = 1;
            x < width - 1;
            x++
        ) {

            const index =
                (y * width + x) * 4;


            const top =
                ((y - 1) * width + x) * 4;

            const bottom =
                ((y + 1) * width + x) * 4;

            const left =
                (y * width + x - 1) * 4;

            const right =
                (y * width + x + 1) * 4;


            let value =
                sharpenInput[index] * 5
                -
                sharpenInput[top]
                -
                sharpenInput[bottom]
                -
                sharpenInput[left]
                -
                sharpenInput[right];


            value =
                Math.max(
                    0,
                    Math.min(
                        255,
                        value
                    )
                );


            sharpenOutput[index] =
                value;

            sharpenOutput[index + 1] =
                value;

            sharpenOutput[index + 2] =
                value;

            sharpenOutput[index + 3] =
                255;

        }

    }


    /*
       Preserve borders.
    */

    for (
        let x = 0;
        x < width;
        x++
    ) {

        const top =
            x * 4;

        const bottom =
            ((height - 1) * width + x) * 4;


        sharpenOutput[top] =
            sharpenInput[top];

        sharpenOutput[top + 1] =
            sharpenInput[top + 1];

        sharpenOutput[top + 2] =
            sharpenInput[top + 2];

        sharpenOutput[top + 3] =
            255;


        sharpenOutput[bottom] =
            sharpenInput[bottom];

        sharpenOutput[bottom + 1] =
            sharpenInput[bottom + 1];

        sharpenOutput[bottom + 2] =
            sharpenInput[bottom + 2];

        sharpenOutput[bottom + 3] =
            255;

    }


    for (
        let y = 0;
        y < height;
        y++
    ) {

        const left =
            (y * width) * 4;

        const right =
            (y * width + width - 1) * 4;


        sharpenOutput[left] =
            sharpenInput[left];

        sharpenOutput[left + 1] =
            sharpenInput[left + 1];

        sharpenOutput[left + 2] =
            sharpenInput[left + 2];

        sharpenOutput[left + 3] =
            255;


        sharpenOutput[right] =
            sharpenInput[right];

        sharpenOutput[right + 1] =
            sharpenInput[right + 1];

        sharpenOutput[right + 2] =
            sharpenInput[right + 2];

        sharpenOutput[right + 3] =
            255;

    }


    ctx.putImageData(
        sharpened,
        0,
        0
    );


    /*
       STEP 4
       ADAPTIVE-STYLE THRESHOLDING

       Instead of using one global brightness
       threshold for the entire ID, each pixel
       is compared with the average brightness
       around it.

       This helps when one part of the ID is
       brighter or darker than another part.
    */

    const thresholdSource =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    const thresholdInput =
        thresholdSource.data;


    const thresholdOutput =
        new ImageData(
            width,
            height
        );


    const thresholdData =
        thresholdOutput.data;


    /*
       Small radius keeps character details.

       We do not use an excessively large window
       because student ID text can be small.
    */

    const radius =
        7;


    const offset =
        12;


    for (
        let y = 0;
        y < height;
        y++
    ) {

        for (
            let x = 0;
            x < width;
            x++
        ) {

            let sum =
                0;

            let count =
                0;


            const startY =
                Math.max(
                    0,
                    y - radius
                );

            const endY =
                Math.min(
                    height - 1,
                    y + radius
                );


            const startX =
                Math.max(
                    0,
                    x - radius
                );

            const endX =
                Math.min(
                    width - 1,
                    x + radius
                );


            for (
                let yy = startY;
                yy <= endY;
                yy++
            ) {

                for (
                    let xx = startX;
                    xx <= endX;
                    xx++
                ) {

                    const index =
                        (yy * width + xx) * 4;


                    sum +=
                        thresholdInput[index];

                    count++;

                }

            }


            const average =
                sum / count;


            const currentIndex =
                (y * width + x) * 4;


            const current =
                thresholdInput[
                    currentIndex
                ];


            /*
               Dark text becomes black.
               Bright background becomes white.
            */

            const value =
                current <
                average - offset
                    ? 0
                    : 255;


            thresholdData[
                currentIndex
            ] =
                value;

            thresholdData[
                currentIndex + 1
            ] =
                value;

            thresholdData[
                currentIndex + 2
            ] =
                value;

            thresholdData[
                currentIndex + 3
            ] =
                255;

        }

    }


    ctx.putImageData(
        thresholdOutput,
        0,
        0
    );


    /*
       SHOW PROCESSED IMAGE
    */

    processedImage.src =
        canvas.toDataURL(
            "image/png"
        );

    processedImage.style.display =
        "block";


    status.textContent =
        "Running OCR...";


    /* =====================================================
       TESSERACT
    ===================================================== */

    const result =
        await Tesseract.recognize(

            canvas,

            "eng",

            {

                logger: function(info) {

                    console.log(
                        "TESSERACT:",
                        info
                    );


                    if (
                        info.progress !== undefined
                    ) {

                        progressBar.style.width =
                            (
                                info.progress * 100
                            ) + "%";

                    }


                    if (
                        info.status
                    ) {

                        status.textContent =
                            info.status;

                    }

                },

                tessedit_pageseg_mode: 6

            }

        );


    progressBar.style.width =
        "100%";


    /*
       RAW OCR
    */

    const text =
        result.data.text;


    console.log(
        "OCR RESULT:",
        text
    );


    rawOCR.textContent =
        text ||
        "Tesseract returned no text.";


    /*
       PARSE OCR
    */

    parseOCR(text);


    /*
       AUTOMATIC DATABASE CHECK
    */

    if (
        lrnField.value.trim()
    ) {

        status.textContent =
            "OCR complete. Checking database...";


        databaseButton.disabled =
            true;


        await checkDatabase();

    }

    else {

        status.textContent =
            "OCR complete, but LRN was not detected.";

    }

}


/* =========================================================
   OCR PARSING
========================================================= */

function parseOCR(text) {

    const lines =
        text
            .split(/\r?\n/)
            .map(
                line =>
                    line.trim()
            )
            .filter(
                line =>
                    line.length > 0
            );


    /*
       CLEAR PREVIOUS VALUES
    */

    nameField.value =
        "";

    gradeField.value =
        "";

    sectionField.value =
        "";

    lrnField.value =
        "";

    idField.value =
        "";


    /* =====================================================
       LRN
    ===================================================== */

    /*
       OCR commonly confuses:

       O / o -> 0
       I / l -> 1
       S -> 5
       B -> 8
       G -> 6
       Z -> 2
    */

    const correctedText =
        text
            .replace(/[Oo]/g, "0")
            .replace(/[IiLl]/g, "1")
            .replace(/S/g, "5")
            .replace(/s/g, "5")
            .replace(/B/g, "8")
            .replace(/G/g, "6")
            .replace(/Z/g, "2");


    /*
       Look specifically after LRN.

       IMPORTANT:
       Exactly 12 digits are accepted.
    */

    let lrnMatch =
        correctedText.match(

            /LRN\s*[:#\-]?\s*([0-9](?:[\s.-]*[0-9]){11})/i

        );


    if (lrnMatch) {

        const lrnDigits =
            lrnMatch[1]
                .replace(
                    /[^0-9]/g,
                    ""
                );


        /*
           HARD LIMIT:
           Exactly 12 digits.
        */

        if (
            lrnDigits.length === 12
        ) {

            lrnField.value =
                lrnDigits;

        }

    }


    /*
       FALLBACK LRN DETECTION
       Used when OCR fails to recognize
       the word "LRN".
    */

    if (
        !lrnField.value
    ) {

        for (
            const line of lines
        ) {

            const correctedLine =
                line
                    .replace(/[Oo]/g, "0")
                    .replace(/[IiLl]/g, "1")
                    .replace(/S/g, "5")
                    .replace(/s/g, "5")
                    .replace(/B/g, "8")
                    .replace(/G/g, "6")
                    .replace(/Z/g, "2");


            const digits =
                correctedLine.replace(
                    /[^0-9]/g,
                    ""
                );


            /*
               Only accept exactly 12 digits.
            */

            if (
                digits.length === 12
            ) {

                /*
                   LRN is normally a long
                   12-digit number.
                */

                lrnField.value =
                    digits;

                break;

            }

        }

    }


    /* =====================================================
       ID NUMBER
    ===================================================== */

    /*
       First try the proper label.

       Expected examples:

       ID NO.: 305015-410-SHS
       ID NO. 305015-410-SHS
       ID NUMBER: 305015-410-SHS
    */

    let idMatch =
        text.match(

            /ID\s*(?:NO\.?|NUMBER)\s*[:#\-]?\s*([0-9]{3,})\s*[-–—]\s*([0-9]{2,})\s*[-–—]\s*([A-Za-z]{2,})/i

        );


    if (idMatch) {

        idField.value =
            idMatch[1] +
            "-" +
            idMatch[2] +
            "-" +
            idMatch[3].toUpperCase();

    }


    /*
       SECOND ID FALLBACK

       Handles OCR such as:

       ID NO.: 305015 410 SHS

       or:

       ID NO.: 305015-410 SHS
    */

    if (
        !idField.value
    ) {

        idMatch =
            text.match(

                /ID\s*(?:NO\.?|NUMBER)?\s*[:#\-]?\s*([0-9]{3,})\s*[-–—\s]+([0-9]{2,})\s*[-–—\s]+([A-Za-z]{2,})/i

            );


        if (idMatch) {

            idField.value =
                idMatch[1] +
                "-" +
                idMatch[2] +
                "-" +
                idMatch[3].toUpperCase();

        }

    }


    /*
       THIRD ID FALLBACK

       Search individual OCR lines.

       This is useful when Tesseract places
       the label and number on separate lines.
    */

    if (
        !idField.value
    ) {

        for (
            let i = 0;
            i < lines.length;
            i++
        ) {

            const line =
                lines[i];


            /*
               Look for an ID-like pattern.
            */

            const candidate =
                line.match(

                    /\b([0-9]{3,})\s*[-–—\s]\s*([0-9]{2,})\s*[-–—\s]\s*([A-Za-z]{2,})\b/i

                );


            if (candidate) {

                /*
                   Avoid accidentally using
                   other text.

                   ID numbers in this project
                   normally contain SHS.
                */

                const suffix =
                    candidate[3]
                        .toUpperCase();


                if (
                    suffix === "SHS" ||
                    suffix === "JHS"
                ) {

                    idField.value =
                        candidate[1] +
                        "-" +
                        candidate[2] +
                        "-" +
                        suffix;

                    break;

                }

            }

        }

    }


    /*
       FOURTH ID FALLBACK

       OCR may recognize:

       305015-410-SH5

       Correct the common S/H/S digit
       confusion when the surrounding
       pattern looks like an ID.
    */

    if (
        !idField.value
    ) {

        const idFallback =
            text.match(

                /\b([0-9]{3,})\s*[-–—]\s*([0-9]{2,})\s*[-–—]\s*([A-Za-z0-9]{2,})\b/i

            );


        if (idFallback) {

            let suffix =
                idFallback[3]
                    .toUpperCase()
                    .replace(
                        /5/g,
                        "S"
                    );


            if (
                suffix.length >= 2
            ) {

                idField.value =
                    idFallback[1] +
                    "-" +
                    idFallback[2] +
                    "-" +
                    suffix;

            }

        }

    }


    /* =====================================================
       GRADE + SECTION
    ===================================================== */

    let gradeMatch =
        text.match(

            /GRADE\s*(?:LEVEL)?\s*(7|8|9|10|11|12)\s*[-–—:]?\s*([A-Za-z0-9][A-Za-z0-9 .'-]*)/i

        );


    if (gradeMatch) {

        gradeField.value =
            gradeMatch[1];

        sectionField.value =
            gradeMatch[2]
                .trim();

    }


    /*
       GRADE FALLBACK

       Handles OCR such as:

       GIRADDE 12-ROENTGEN
       GRADEE 12-ROENTGEN
       GRADE 12 ROENTGEN
    */

    if (
        !gradeField.value
    ) {

        const gradeFallback =
            text.match(

                /G[A-Z]*R[A-Z]*D[A-Z]*E[A-Z]*\s*(7|8|9|10|11|12)\s*[-–—:]?\s*([A-Za-z0-9][A-Za-z0-9 .'-]*)/i

            );


        if (gradeFallback) {

            gradeField.value =
                gradeFallback[1];

            sectionField.value =
                gradeFallback[2]
                    .trim();

        }

    }


    /* =====================================================
       NAME
    ===================================================== */

    /*
       Find the first line that looks like
       a person's name.
    */

    for (
        const line of lines
    ) {

        const upper =
            line.toUpperCase();


        /*
           Skip known information lines.
        */

        if (
            upper.includes("LRN") ||
            upper.includes("ID NO") ||
            upper.includes("ID NUMBER") ||
            upper.includes("GRADE") ||
            upper.includes("SECTION")
        ) {

            continue;

        }


        /*
           Clean OCR characters.
        */

        const cleaned =
            line
                .replace(
                    /[^A-Za-zÀ-ÿ.' -]/g,
                    ""
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();


        const words =
            cleaned
                .split(" ")
                .filter(
                    word =>
                        word.length > 0
                );


        /*
           A name should have
           at least two words.
        */

        if (
            words.length >= 2 &&
            cleaned.length >= 5
        ) {

            nameField.value =
                cleaned;

            break;

        }

    }


    /*
       DEBUG
    */

    console.log(
        "PARSED NAME:",
        nameField.value
    );

    console.log(
        "PARSED GRADE:",
        gradeField.value
    );

    console.log(
        "PARSED SECTION:",
        sectionField.value
    );

    console.log(
        "PARSED LRN:",
        lrnField.value
    );

    console.log(
        "PARSED ID:",
        idField.value
    );

}


/* =========================================================
   DATABASE CHECK
========================================================= */

async function checkDatabase() {

    const lrn =
        lrnField.value
            .trim();


    if (!lrn) {

        status.textContent =
            "No LRN was detected.";

        databaseButton.disabled =
            false;

        return;

    }


    /*
       Safety check:
       Only send exactly 12 digits.
    */

    if (
        !/^\d{12}$/.test(lrn)
    ) {

        status.textContent =
            "Invalid LRN. A valid LRN must contain exactly 12 digits.";

        databaseButton.disabled =
            false;

        return;

    }


    if (
        DATABASE_URL.includes(
            "PASTE_YOUR"
        )
    ) {

        alert(
            "Apps Script URL has not been entered."
        );

        databaseButton.disabled =
            false;

        return;

    }


    status.textContent =
        "Checking Google Sheets...";


    databaseButton.disabled =
        true;


    databaseResult.style.display =
        "none";


    try {

        const url =
            DATABASE_URL +
            "?lrn=" +
            encodeURIComponent(
                lrn
            );


        console.log(
            "DATABASE REQUEST:",
            url
        );


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "HTTP error: " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "DATABASE RESULT:",
            result
        );


        /*
           STUDENT FOUND
        */

        if (
            result.match === true
        ) {

            databaseResult.style.display =
                "block";

            databaseResult.className =
                "database-result valid";


            databaseStatus.textContent =
                "🟢 VALID STUDENT";


            databaseDetails.innerHTML =

                "<strong>Name:</strong> " +
                escapeHTML(
                    result.student.name
                ) +

                "<br><br>" +

                "<strong>LRN:</strong> " +
                escapeHTML(
                    result.student.lrn
                ) +

                "<br><br>" +

                "<strong>ID Number:</strong> " +
                escapeHTML(
                    result.student.idNumber
                ) +

                "<br><br>" +

                "<strong>Grade:</strong> " +
                escapeHTML(
                    result.student.grade
                ) +

                "<br><br>" +

                "<strong>Section:</strong> " +
                escapeHTML(
                    result.student.section
                );


            status.textContent =
                "Student identified successfully.";

        }


        /*
           STUDENT NOT FOUND
        */

        else {

            databaseResult.style.display =
                "block";

            databaseResult.className =
                "database-result invalid";


            databaseStatus.textContent =
                "🔴 STUDENT NOT FOUND";


            databaseDetails.innerHTML =

                "<strong>Scanned LRN:</strong> " +
                escapeHTML(
                    lrn
                ) +

                "<br><br>" +

                "This LRN was not found " +
                "in the student database.";


            status.textContent =
                "No matching student.";

        }

    }


    catch (error) {

        console.error(
            "DATABASE ERROR:",
            error
        );


        databaseResult.style.display =
            "block";

        databaseResult.className =
            "database-result invalid";


        databaseStatus.textContent =
            "⚠️ DATABASE CONNECTION FAILED";


        databaseDetails.innerHTML =

            "Could not connect to Google Apps Script." +

            "<br><br>" +

            "<small>" +

            escapeHTML(
                error.message
            ) +

            "</small>";


        status.textContent =
            "Database connection failed.";

    }


    finally {

        databaseButton.disabled =
            false;

    }

}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
