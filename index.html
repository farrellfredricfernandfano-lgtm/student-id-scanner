        top: 50%;

        left: 50%;

        transform: translate(-50%, -50%);

    ================================================= */

        width: 100%;

        height: 2px;

        background: #00ff88;

        left: 0;

        opacity: 0;

        pointer-events: none;

        animation:

            scanAnimation 2s
            linear
            infinite;

    }

        0% {

            top: 0%;

        }

        50% {

            top: 100%;

        }

        100% {

            top: 0%;

        }

    }

<script>


/* =====================================================
   ELEMENT REFERENCES
===================================================== */

const video =
    document.getElementById(
        "video"
    );


const canvas =
    document.getElementById(
        "canvas"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const scanButton =
    document.getElementById(
        "scanButton"
    );


const stopButton =
    document.getElementById(
        "stopButton"
    );


const status =
    document.getElementById(
        "status"
    );


const processedImage =
    document.getElementById(
        "processedImage"
    );


const ocrResult =
    document.getElementById(
        "ocrResult"
    );


const progressContainer =
    document.getElementById(
        "progressContainer"
    );


const progressBar =
    document.getElementById(
        "progressBar"
    );


const scanLine =
    document.getElementById(
        "scanLine"
    );


const nameField =
    document.getElementById(
        "nameField"
    );


const gradeField =
    document.getElementById(
        "gradeField"
    );


const sectionField =
    document.getElementById(
        "sectionField"
    );


const lrnField =
    document.getElementById(
        "lrnField"
    );


const idField =
    document.getElementById(
        "idField"
    );



/* =====================================================
   CAMERA STATE
===================================================== */

let cameraStream =
    null;


let scanning =
    false;



/* =====================================================
   CAMERA SUPPORT CHECK
===================================================== */

if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
) {

    status.textContent =
        "Live camera is not supported by this browser.";

}



/* =====================================================
   START CAMERA
===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);


async function startCamera() {

    try {


        status.textContent =
            "Requesting camera permission...";


        /*
            GitHub Pages should use HTTPS.
        */

        if (
            location.protocol !== "https:" &&
            location.hostname !== "localhost"
        ) {

            throw new Error(
                "Camera requires HTTPS."
            );

        }


        /*
            Request rear camera.
        */

        const constraints = {

            audio: false,

            video: {

                facingMode: {

                    ideal:
                        "environment"

                },

                width: {

                    ideal:
                        1920

                },

                height: {

                    ideal:
                        1080

                },

                frameRate: {

                    ideal:
                        30

                }

            }

        };


        cameraStream =
            await navigator
                .mediaDevices
                .getUserMedia(
                    constraints
                );


        /*
            Attach stream.
        */

        video.srcObject =
            cameraStream;


        await video.play();


        /*
            Camera information.
        */

        const track =
            cameraStream
                .getVideoTracks()[0];


        console.log(
            "Camera:",
            track.label
        );


        console.log(
            "Camera settings:",
            track.getSettings()
        );


        status.textContent =
            "Camera ready. Align the ID.";


        startButton.disabled =
            true;


        scanButton.disabled =
            false;


        stopButton.disabled =
            false;


    }

    catch (error) {


        console.error(
            error
        );


        status.textContent =
            "Camera error: " +
            error.name;


        let message =
            "";


        if (
            error.name ===
            "NotAllowedError"
        ) {

            message =
                "Camera permission was denied.\n\n" +
                "Check Chrome's camera permission " +
                "for this GitHub Pages website.";

        }


        else if (
            error.name ===
            "NotFoundError"
        ) {

            message =
                "No camera was found.";

        }


        else if (
            error.name ===
            "NotReadableError"
        ) {

            message =
                "The camera is already being used " +
                "by another application.";

        }


        else {

            message =
                error.name +
                "\n\n" +
                error.message;

        }


        alert(
            message
        );

    }

}



/* =====================================================
   STOP CAMERA
===================================================== */

stopButton.addEventListener(
    "click",
    stopCamera
);


function stopCamera() {


    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }


    cameraStream =
        null;


    video.srcObject =
        null;


    startButton.disabled =
        false;


    scanButton.disabled =
        true;


    stopButton.disabled =
        true;


    scanLine.classList.remove(
        "active"
    );


    status.textContent =
        "Camera stopped.";

}



/* =====================================================
   CAPTURE + SCAN
===================================================== */

scanButton.addEventListener(
    "click",
    captureAndScan
);


async function captureAndScan() {


    if (
        !cameraStream ||
        scanning
    ) {

        return;

    }


    scanning =
        true;


    scanButton.disabled =
        true;


    scanLine.classList.add(
        "active"
    );


    status.textContent =
        "Capturing ID...";


    /*
        Give camera a moment
        to stabilize.
    */

    await sleep(200);


    try {


        const videoWidth =
            video.videoWidth;


        const videoHeight =
            video.videoHeight;


        if (
            !videoWidth ||
            !videoHeight
        ) {

            throw new Error(
                "Camera frame is not ready."
            );

        }


        /*
            =============================================
            CROP TO GREEN GUIDE
            =============================================
        */


        const guideWidthRatio =
            0.88;


        const cropWidth =
            Math.floor(
                videoWidth *
                guideWidthRatio
            );


        const cropHeight =
            Math.floor(
                cropWidth /
                1.586
            );


        const cropX =
            Math.floor(
                (
                    videoWidth -
                    cropWidth
                ) / 2
            );


        const cropY =
            Math.floor(
                (
                    videoHeight -
                    cropHeight
                ) / 2
            );


        /*
            Upscale image.
        */

        const scale =
            2;


        canvas.width =
            cropWidth *
            scale;


        canvas.height =
            cropHeight *
            scale;


        const ctx =
            canvas.getContext(
                "2d"
            );


        /*
            Draw ID.
        */

        ctx.drawImage(

            video,

            cropX,
            cropY,

            cropWidth,
            cropHeight,

            0,
            0,

            canvas.width,
            canvas.height

        );


        status.textContent =
            "Preprocessing image...";


        /*
            Preprocess.
        */

        preprocessImage(
            ctx,
            canvas.width,
            canvas.height
        );


        /*
            Display processed image.
        */

        processedImage.src =
            canvas.toDataURL(
                "image/jpeg",
                0.95
            );


        processedImage.style.display =
            "block";


        /*
            OCR.
        */

        await performOCR();


    }

    catch (error) {


        console.error(
            error
        );


        status.textContent =
            "Scan failed.";


        ocrResult.textContent =
            error.message;

    }


    scanLine.classList.remove(
        "active"
    );


    scanButton.disabled =
        false;


    scanning =
        false;

}



/* =====================================================
   IMAGE PREPROCESSING
===================================================== */

function preprocessImage(
    ctx,
    width,
    height
) {


    const imageData =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    const data =
        imageData.data;



    /* =================================================
       GRAYSCALE
    ================================================= */

    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {


        const r =
            data[i];


        const g =
            data[i + 1];


        const b =
            data[i + 2];


        const gray =
            (
                0.299 * r +
                0.587 * g +
                0.114 * b
            );


        data[i] =
            gray;


        data[i + 1] =
            gray;


        data[i + 2] =
            gray;

    }



    /* =================================================
       CONTRAST
    ================================================= */

    const contrast =
        1.7;


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {


        let value =
            data[i];


        value =
            (
                (value - 128) *
                contrast
            ) + 128;


        value =
            Math.max(
                0,
                Math.min(
                    255,
                    value
                )
            );


        data[i] =
            value;


        data[i + 1] =
            value;


        data[i + 2] =
            value;

    }



    /* =================================================
       SHARPENING
    ================================================= */

    const original =
        new Uint8ClampedArray(
            data
        );


    const strength =
        0.3;


    for (
        let y = 1;
        y < height - 1;
        y++
    ) {


        for (
            let x = 1;
            x < width - 1;
            x++
        ) {


            const index =
                (
                    y * width +
                    x
                ) * 4;


            const center =
                original[index];


            const top =
                original[
                    (
                        (y - 1) *
                        width +
                        x
                    ) * 4
                ];


            const bottom =
                original[
                    (
                        (y + 1) *
                        width +
                        x
                    ) * 4
                ];


            const left =
                original[
                    (
                        y *
                        width +
                        x -
                        1
                    ) * 4
                ];


            const right =
                original[
                    (
                        y *
                        width +
                        x +
                        1
                    ) * 4
                ];


            let value =
                center *
                (
                    1 +
                    4 * strength
                )
                -
                strength *
                (
                    top +
                    bottom +
                    left +
                    right
                );


            value =
                Math.max(
                    0,
                    Math.min(
                        255,
                        value
                    )
                );


            data[index] =
                value;


            data[index + 1] =
                value;


            data[index + 2] =
                value;

        }

    }


    /*
        Save processed image.
    */

    ctx.putImageData(
        imageData,
        0,
        0
    );

}



/* =====================================================
   OCR
===================================================== */

async function performOCR() {


    status.textContent =
        "Starting OCR...";


    ocrResult.textContent =
        "Reading ID...";


    progressContainer.style.display =
        "block";


    progressBar.style.width =
        "0%";


    try {


        const result =
            await Tesseract.recognize(

                canvas,

                "eng",

                {

                    logger:
                        function(info) {


                            console.log(
                                info
                            );


                            if (
                                info.status ===
                                "recognizing text"
                            ) {


                                const percent =
                                    Math.round(
                                        info.progress *
                                        100
                                    );


                                progressBar.style.width =
                                    percent + "%";


                                status.textContent =
                                    "Reading ID: " +
                                    percent +
                                    "%";

                            }

                        },


                    /*
                        PSM 6:

                        Treat image as a
                        uniform block of text.
                    */

                    tessedit_pageseg_mode:
                        "6"

                }

            );


        const text =
            result.data.text;


        console.log(
            "========== RAW OCR =========="
        );


        console.log(
            text
        );


        console.log(
            "=============================="
        );


        /*
            Display raw OCR.
        */

        if (
            text &&
            text.trim()
        ) {

            ocrResult.textContent =
                text.trim();

        }

        else {

            ocrResult.textContent =
                "No readable text detected.";

        }


        /*
            Extract fields.
        */

        extractFields(
            text
        );


        progressBar.style.width =
            "100%";


        status.textContent =
            "Scan complete.";

    }

    catch (error) {


        console.error(
            error
        );


        status.textContent =
            "OCR failed.";


        ocrResult.textContent =
            "OCR Error:\n\n" +
            error.message;

    }


    setTimeout(
        function() {

            progressContainer.style.display =
                "none";

        },
        1000
    );

}



/* =====================================================
   EXTRACT STUDENT INFORMATION
===================================================== */

function extractFields(
    text
) {


    if (!text) {

        return;

    }


    /*
        =============================================
        SPLIT OCR INTO LINES
        =============================================
    */

    const lines =
        text
            .split(/\r?\n/)
            .map(
                line =>
                    line.trim()
            )
            .filter(
                line =>
                    line.length > 0
            );


    console.log(
        "OCR LINES:",
        lines
    );


    /*
        =============================================
        VARIABLES
        =============================================
    */

    let name = "";

    let grade = "";

    let section = "";

    let lrn = "";

    let idNumber = "";



    /* =================================================
       NAME
       =================================================

       Expected:

       FARRELL FREDRIC FERNAND F. FANO

       We assume the first meaningful
       non-label line is the name.
    */

    for (
        let line of lines
    ) {


        const upper =
            line.toUpperCase();


        /*
            Ignore known fields.
        */

        if (
            upper.includes("LRN") ||
            upper.includes("ID NO") ||
            upper.includes("IDNO") ||
            upper.includes("GRADE")
        ) {

            continue;

        }


        /*
            Remove weird OCR symbols.
        */

        const cleaned =
            line
                .replace(
                    /[^A-Za-zÀ-ÿ.' -]/g,
                    ""
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();


        /*
            Count words.
        */

        const words =
            cleaned
                .split(/\s+/)
                .filter(
                    word =>
                        word.length > 0
                );


        /*
            Student name should
            have at least two words.
        */

        if (
            words.length >= 2 &&
            cleaned.length >= 5
        ) {

            name =
                cleaned;

            break;

        }

    }



    /* =================================================
       LRN
       =================================================

       Expected:

       LRN: 123456789012
    */

    const lrnMatch =
        text.match(
            /LRN\s*[:\-]?\s*([0-9]{8,20})/i
        );


    if (lrnMatch) {

        lrn =
            lrnMatch[1];

    }



    /*
        FALLBACK:

        If OCR misses the colon or label.
    */

    if (!lrn) {


        for (
            let line of lines
        ) {


            if (
                /LRN/i.test(line)
            ) {


                const number =
                    line.match(
                        /\d{8,20}/
                    );


                if (number) {

                    lrn =
                        number[0];

                    break;

                }

            }

        }

    }



    /* =================================================
       ID NUMBER
       =================================================

       Expected:

       ID NO: 123456 -123
    */

    const idMatch =
        text.match(
            /ID\s*(?:NO|NUMBER)?\s*[:#\-]?\s*([0-9]+)\s*[-–—]\s*([0-9]+)/i
        );


    if (idMatch) {

        idNumber =
            idMatch[1] +
            "-" +
            idMatch[2];

    }



    /*
        FALLBACK ID NUMBER

        Example:

        123456 -123
    */

    if (!idNumber) {


        const generalID =
            text.match(
                /\b([0-9]{4,8})\s*[-–—]\s*([0-9]{2,6})\b/
            );


        if (generalID) {

            idNumber =
                generalID[1] +
                "-" +
                generalID[2];

        }

    }



    /* =================================================
       GRADE + SECTION
       =================================================

       Expected:

       GRADE 12- ROENTGEN

       Result:

       Grade = 12
       Section = ROENTGEN
    */

    const gradeMatch =
        text.match(
            /GRADE\s*(?:LEVEL)?\s*(7|8|9|10|11|12)\s*[-–—:]?\s*([A-Za-z0-9][A-Za-z0-9 .'-]*)/i
        );


    if (gradeMatch) {


        grade =
            gradeMatch[1];


        section =
            gradeMatch[2]
                .trim();


        /*
            Remove trailing junk.
        */

        section =
            section
                .replace(
                    /^[\s\-:]+/,
                    ""
                )
                .replace(
                    /[\s\-:]+$/,
                    ""
                );

    }



    /* =================================================
       GRADE FALLBACK
       ================================================= */

    if (!grade) {


        const gradeOnly =
            text.match(
                /GRADE\s*(?:LEVEL)?\s*(7|8|9|10|11|12)\b/i
            );


        if (gradeOnly) {

            grade =
                gradeOnly[1];

        }

    }



    /* =================================================
       SECTION CLEANUP
       ================================================= */

    if (section) {


        section =
            section
                .replace(
                    /^[^A-Za-z0-9]+/,
                    ""
                )
                .trim();

    }



    /* =================================================
       DISPLAY
       ================================================= */

    nameField.value =
        name;


    gradeField.value =
        grade;


    sectionField.value =
        section;


    lrnField.value =
        lrn;


    idField.value =
        idNumber;



    /* =================================================
       DEBUG
       ================================================= */

    console.log(
        "================================"
    );


    console.log(
        "EXTRACTED STUDENT INFORMATION"
    );


    console.log(
        "NAME:",
        name
    );


    console.log(
        "GRADE:",
        grade
    );


    console.log(
        "SECTION:",
        section
    );


    console.log(
        "LRN:",
        lrn
    );


    console.log(
        "ID NUMBER:",
        idNumber
    );


    console.log(
        "================================"
    );

}



/* =====================================================
   UTILITY
===================================================== */

function sleep(
    ms
) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}



/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    stopCamera
);


</script>
