<script>


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById(
        "video"
    );

const canvas =
    document.getElementById(
        "canvas"
    );

const processedImage =
    document.getElementById(
        "processedImage"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const scanButton =
    document.getElementById(
        "scanButton"
    );

const stopButton =
    document.getElementById(
        "stopButton"
    );

const databaseButton =
    document.getElementById(
        "databaseButton"
    );

const status =
    document.getElementById(
        "status"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );

const nameField =
    document.getElementById(
        "nameField"
    );

const gradeField =
    document.getElementById(
        "gradeField"
    );

const sectionField =
    document.getElementById(
        "sectionField"
    );

const lrnField =
    document.getElementById(
        "lrnField"
    );

const idField =
    document.getElementById(
        "idField"
    );

const databaseResult =
    document.getElementById(
        "databaseResult"
    );

const databaseStatus =
    document.getElementById(
        "databaseStatus"
    );

const databaseDetails =
    document.getElementById(
        "databaseDetails"
    );

const rawOCR =
    document.getElementById(
        "rawOCR"
    );


/* =========================================================
   DATABASE URL
========================================================= */

const DATABASE_URL =
    "https://script.google.com/macros/s/AKfycby8SQH20dz2PK6Covm_GOy4sG1WigvDaxZr8a--gbrI_LBKE1KJoQO7AMzaKZR_3mQ/exec";


/* =========================================================
   GLOBALS
========================================================= */

let cameraStream = null;

let ocrWorker = null;

let ocrWorkerReady = false;

let scanning = false;


/* =========================================================
   BUTTON EVENTS
========================================================= */

startButton.addEventListener(
    "click",
    startCamera
);

scanButton.addEventListener(
    "click",
    captureAndScan
);

stopButton.addEventListener(
    "click",
    stopCamera
);

databaseButton.addEventListener(
    "click",
    checkDatabase
);


/* =========================================================
   INITIALIZE OCR
========================================================= */

async function initializeOCR() {

    if (
        ocrWorkerReady
    ) {

        return;

    }


    if (
        typeof Tesseract ===
        "undefined"
    ) {

        throw new Error(
            "Tesseract.js did not load."
        );

    }


    status.textContent =
        "Loading OCR engine...";


    progressBar.style.width =
        "5%";


    const {
        createWorker
    } = Tesseract;


    ocrWorker =
        await createWorker(

            "eng",

            1,

            {

                logger:
                    function(info) {

                        console.log(
                            "OCR:",
                            info
                        );

                        if (
                            info.progress !==
                            undefined
                        ) {

                            const p =
                                Math.round(
                                    info.progress *
                                    100
                                );

                            progressBar.style.width =
                                p + "%";

                        }

                    }

            }

        );


    /*
       Improve recognition for
       normal text.
    */

    await ocrWorker.setParameters({

        tessedit_pageseg_mode:
            "6",

        preserve_interword_spaces:
            "1"

    });


    ocrWorkerReady =
        true;


    progressBar.style.width =
        "10%";


    status.textContent =
        "OCR engine ready.";

}


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

    try {

        status.textContent =
            "Starting camera...";


        /*
           Load OCR in parallel with
           camera initialization.
        */

        const ocrPromise =
            initializeOCR();


        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio: false,

                    video: {

                        facingMode: {
                            ideal:
                                "environment"
                        },

                        width: {
                            ideal:
                                1920
                        },

                        height: {
                            ideal:
                                1080
                        },

                        frameRate: {
                            ideal:
                                30
                        }

                    }

                });


        video.srcObject =
            cameraStream;


        await video.play();


        await ocrPromise;


        startButton.disabled =
            true;

        scanButton.disabled =
            false;

        stopButton.disabled =
            false;


        status.textContent =
            "Camera ready. Align the ID inside the green guide.";

    }


    catch (error) {

        console.error(
            "START ERROR:",
            error
        );


        status.textContent =
            "Camera/OCR error: " +
            error.message;

    }

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera() {

    if (
        cameraStream
    ) {

        cameraStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        cameraStream =
            null;

    }


    video.srcObject =
        null;


    startButton.disabled =
        false;

    scanButton.disabled =
        true;

    stopButton.disabled =
        true;


    status.textContent =
        "Camera stopped.";

}


/* =========================================================
   CAPTURE + SCAN
========================================================= */

async function captureAndScan() {

    if (
        scanning
    ) {

        return;

    }


    if (
        !cameraStream
    ) {

        alert(
            "Please start the camera first."
        );

        return;

    }


    scanning =
        true;


    scanButton.disabled =
        true;

    databaseButton.disabled =
        true;


    databaseResult.style.display =
        "none";


    progressBar.style.width =
        "0%";


    try {

        await performOCR();

    }


    catch (error) {

        console.error(
            "SCAN ERROR:",
            error
        );


        status.textContent =
            "Scanning failed: " +
            error.message;

    }


    finally {

        scanning =
            false;

        scanButton.disabled =
            false;

    }

}


/* =========================================================
   CREATE CROPPED IMAGE
========================================================= */

function captureID() {

    const videoWidth =
        video.videoWidth;

    const videoHeight =
        video.videoHeight;


    if (
        !videoWidth ||
        !videoHeight
    ) {

        throw new Error(
            "Camera image is not ready."
        );

    }


    /*
       Same basic proportions as
       your sample001 image.

       ID ratio:
       1.586 : 1
    */

    let cropWidth =
        videoWidth * 0.88;


    let cropHeight =
        cropWidth / 1.586;


    /*
       Make sure crop fits vertically.
    */

    if (
        cropHeight >
        videoHeight * 0.88
    ) {

        cropHeight =
            videoHeight * 0.88;

        cropWidth =
            cropHeight * 1.586;

    }


    const cropX =
        (
            videoWidth -
            cropWidth
        ) / 2;


    const cropY =
        (
            videoHeight -
            cropHeight
        ) / 2;


    /*
       2x upscale.
    */

    const scale =
        2;


    canvas.width =
        Math.round(
            cropWidth * scale
        );

    canvas.height =
        Math.round(
            cropHeight * scale
        );


    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:
                    true
            }
        );


    /*
       High quality resizing.
    */

    ctx.imageSmoothingEnabled =
        true;

    ctx.imageSmoothingQuality =
        "high";


    ctx.drawImage(

        video,

        cropX,
        cropY,

        cropWidth,
        cropHeight,

        0,
        0,

        canvas.width,
        canvas.height

    );


    return ctx;

}


/* =========================================================
   PREPROCESS IMAGE
========================================================= */

function preprocessImage() {

    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:
                    true
            }
        );


    const imageData =
        ctx.getImageData(

            0,
            0,

            canvas.width,
            canvas.height

        );


    const data =
        imageData.data;


    /*
       Moderate contrast.

       Too much contrast can destroy
       thin characters such as 1 and 7.
    */

    const contrast =
        1.35;


    const factor =
        (
            259 *
            (
                contrast + 255
            )
        ) /
        (
            255 *
            (
                259 - contrast
            )
        );


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r =
            data[i];

        const g =
            data[i + 1];

        const b =
            data[i + 2];


        /*
           Grayscale
        */

        let gray =
            (
                0.299 * r +
                0.587 * g +
                0.114 * b
            );


        /*
           Contrast
        */

        gray =
            factor *
            (
                gray - 128
            ) +
            128;


        /*
           Slight brightness correction.
        */

        gray +=
            5;


        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );


        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );

}


/* =========================================================
   OCR
========================================================= */

async function performOCR() {

    if (
        !ocrWorkerReady
    ) {

        await initializeOCR();

    }


    status.textContent =
        "Capturing ID...";


    progressBar.style.width =
        "10%";


    /*
       Capture exactly what is inside
       the green guide.
    */

    captureID();


    status.textContent =
        "Enhancing image...";


    progressBar.style.width =
        "20%";


    preprocessImage();


    /*
       Display processed image.
    */

    processedImage.src =
        canvas.toDataURL(
            "image/png"
        );

    processedImage.style.display =
        "block";


    status.textContent =
        "Reading ID information...";


    progressBar.style.width =
        "30%";


    /*
       NORMAL OCR PASS
    */

    const normalResult =
        await ocrWorker.recognize(
            canvas
        );


    const normalText =
        normalResult.data.text ||
        "";


    console.log(
        "NORMAL OCR:",
        normalText
    );


    progressBar.style.width =
        "65%";


    /*
       NUMBER-FOCUSED OCR PASS
    */

    const numberText =
        await performNumberOCR();


    console.log(
        "NUMBER OCR:",
        numberText
    );


    progressBar.style.width =
        "90%";


    /*
       Combine both OCR results.

       The parser can use the
       strongest result available.
    */

    const combinedText =
        normalText +
        "\n" +
        numberText;


    rawOCR.textContent =
        "NORMAL OCR:\n\n" +
        normalText +
        "\n\n" +
        "NUMBER OCR:\n\n" +
        numberText;


    parseOCR(
        combinedText
    );


    progressBar.style.width =
        "100%";


    /*
       Database lookup.
    */

    if (
        lrnField.value.trim()
    ) {

        status.textContent =
            "OCR complete. Checking database...";


        await checkDatabase();

    }


    else {

        status.textContent =
            "OCR complete. LRN was not detected.";

    }

}


/* =========================================================
   NUMBER OCR
========================================================= */

async function performNumberOCR() {

    /*
       Create another canvas containing
       the same image.

       We use a character whitelist
       because this pass is primarily
       looking for numeric information.
    */

    const numberCanvas =
        document.createElement(
            "canvas"
        );


    numberCanvas.width =
        canvas.width;

    numberCanvas.height =
        canvas.height;


    const ctx =
        numberCanvas.getContext(
            "2d"
        );


    ctx.drawImage(
        canvas,
        0,
        0
    );


    /*
       This tells Tesseract that this
       pass should focus on numbers,
       colon, hyphen, and letters needed
       by the labels.
    */

    await ocrWorker.setParameters({

        tessedit_pageseg_mode:
            "6",

        tessedit_char_whitelist:
            "0123456789LRNIDNO:.-",

        preserve_interword_spaces:
            "1"

    });


    const result =
        await ocrWorker.recognize(
            numberCanvas
        );


    /*
       Restore normal character set
       for future scans.
    */

    await ocrWorker.setParameters({

        tessedit_pageseg_mode:
            "6",

        preserve_interword_spaces:
            "1",

        tessedit_char_whitelist:
            ""

    });


    return (
        result.data.text ||
        ""
    );

}


/* =========================================================
   OCR PARSER
========================================================= */

function parseOCR(text) {

    /*
       Normalize text.
    */

    const normalized =
        text
            .replace(
                /\r/g,
                ""
            );


    const lines =
        normalized
            .split("\n")
            .map(
                line =>
                    line.trim()
            )
            .filter(
                line =>
                    line.length > 0
            );


    /*
       Clear previous values.
    */

    nameField.value =
        "";

    gradeField.value =
        "";

    sectionField.value =
        "";

    lrnField.value =
        "";

    idField.value =
        "";


    /* =====================================================
       LRN
    ===================================================== */

    let lrn =
        findLRN(
            normalized
        );


    if (
        lrn
    ) {

        lrnField.value =
            lrn;

    }


    /* =====================================================
       ID NUMBER
    ===================================================== */

    const id =
        findIDNumber(
            normalized
        );


    if (
        id
    ) {

        idField.value =
            id;

    }


    /* =====================================================
       GRADE + SECTION
    ===================================================== */

    const gradeInfo =
        findGradeSection(
            normalized
        );


    if (
        gradeInfo
    ) {

        gradeField.value =
            gradeInfo.grade;

        sectionField.value =
            gradeInfo.section;

    }


    /* =====================================================
       NAME
    ===================================================== */

    const name =
        findName(
            lines
        );


    if (
        name
    ) {

        nameField.value =
            name;

    }


    console.log(
        "FINAL NAME:",
        nameField.value
    );

    console.log(
        "FINAL GRADE:",
        gradeField.value
    );

    console.log(
        "FINAL SECTION:",
        sectionField.value
    );

    console.log(
        "FINAL LRN:",
        lrnField.value
    );

    console.log(
        "FINAL ID:",
        idField.value
    );

}


/* =========================================================
   FIND LRN
========================================================= */

function findLRN(text) {

    /*
       First try the normal form.

       Example:

       LRN: 134113150002
    */

    const direct =
        text.match(

            /LRN\s*[:#\-]?\s*([0-9][0-9\s]{7,19})/i

        );


    if (
        direct
    ) {

        const digits =
            direct[1]
                .replace(
                    /\D/g,
                    ""
                );


        if (
            digits.length >= 8 &&
            digits.length <= 20
        ) {

            return digits;

        }

    }


    /*
       OCR often turns:

       LRN

       into:

       TRN
       NRN
       RNN
       LNN
       IRN

       Try those too.
    */

    const fuzzy =
        text.match(

            /[LIRTNR]{2,4}\s*[:#\-]?\s*([0-9][0-9\s]{7,19})/i

        );


    if (
        fuzzy
    ) {

        const digits =
            fuzzy[1]
                .replace(
                    /\D/g,
                    ""
                );


        if (
            digits.length >= 8 &&
            digits.length <= 20
        ) {

            return digits;

        }

    }


    /*
       Last-resort search.

       Look for a long number near
       the word LRN.
    */

    const nearby =
        text.match(

            /LRN[\s\S]{0,40}?([0-9][0-9\s]{7,19})/i

        );


    if (
        nearby
    ) {

        const digits =
            nearby[1]
                .replace(
                    /\D/g,
                    ""
                );


        if (
            digits.length >= 8 &&
            digits.length <= 20
        ) {

            return digits;

        }

    }


    return "";

}


/* =========================================================
   FIND ID NUMBER
========================================================= */

function findIDNumber(text) {

    /*
       Normal format:

       ID NO.: 305015-410-SHS
    */

    let match =
        text.match(

            /ID\s*(?:NO|NUMBER)?\s*[:#\-]?\s*([0-9]{3,})\s*[-–—]\s*([0-9]{2,})\s*[-–—]?\s*([A-Za-z0-9]*)/i

        );


    if (
        match
    ) {

        let result =
            match[1] +
            "-" +
            match[2];


        if (
            match[3]
        ) {

            result +=
                "-" +
                match[3]
                    .toUpperCase();

        }


        return result;

    }


    /*
       Fallback:
       search for a common ID pattern.
    */

    match =
        text.match(

            /\b([0-9]{5,7})\s*[-–—]\s*([0-9]{2,4})\s*[-–—]?\s*([A-Za-z]{2,4})\b/i

        );


    if (
        match
    ) {

        return (

            match[1] +
            "-" +
            match[2] +
            (
                match[3]
                    ? "-" +
                      match[3]
                          .toUpperCase()
                    : ""
            )

        );

    }


    return "";

}


/* =========================================================
   FIND GRADE + SECTION
========================================================= */

function findGradeSection(text) {

    /*
       Example:

       GRADE 12-ROENTGEN
    */

    let match =
        text.match(

            /GRADE\s*(?:LEVEL)?\s*(7|8|9|10|11|12)\s*[-–—:]?\s*([A-Za-z0-9][A-Za-z0-9 .'-]*)/i

        );


    if (
        match
    ) {

        return {

            grade:
                match[1],

            section:
                cleanSection(
                    match[2]
                )

        };

    }


    /*
       OCR may read GRADE incorrectly.
    */

    match =
        text.match(

            /(?:GIRADDE|GIRRADE|GRADDE|GRADEE|GR4DE|GRDE)\s*(7|8|9|10|11|12)\s*[-–—:]?\s*([A-Za-z0-9][A-Za-z0-9 .'-]*)/i

        );


    if (
        match
    ) {

        return {

            grade:
                match[1],

            section:
                cleanSection(
                    match[2]
                )

        };

    }


    /*
       Last fallback:
       Find a standalone grade number.
    */

    const grade =
        text.match(
            /\b(7|8|9|10|11|12)\s*[-–—]\s*([A-Za-z][A-Za-z0-9 .'-]*)\b/
        );


    if (
        grade
    ) {

        return {

            grade:
                grade[1],

            section:
                cleanSection(
                    grade[2]
                )

        };

    }


    return null;

}


/* =========================================================
   CLEAN SECTION
========================================================= */

function cleanSection(value) {

    return String(value)

        .replace(
            /[^A-Za-z0-9 .'-]/g,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


/* =========================================================
   FIND NAME
========================================================= */

function findName(lines) {

    const rejected =
        [

            "LRN",

            "ID",

            "NO",

            "NUMBER",

            "GRADE",

            "SECTION",

            "STUDENT",

            "SCHOOL",

            "REPUBLIC",

            "PHILIPPINES"

        ];


    for (
        const originalLine
        of lines
    ) {

        let line =
            originalLine
                .trim();


        const upper =
            line.toUpperCase();


        /*
           Skip obvious labels.
        */

        if (
            rejected.some(
                word =>
                    upper.includes(
                        word
                    )
            )
        ) {

            continue;

        }


        /*
           Remove numbers and
           strange OCR characters.
        */

        let cleaned =
            line

                .replace(
                    /[0-9]/g,
                    ""
                )

                .replace(
                    /[^A-Za-zÀ-ÿ.' -]/g,
                    ""
                )

                .replace(
                    /\s+/g,
                    " "
                )

                .trim();


        const words =
            cleaned
                .split(
                    " "
                )
                .filter(
                    word =>
                        word.length >= 1
                );


        /*
           Names usually contain
           at least two words.
        */

        if (
            words.length >= 2 &&
            cleaned.length >= 5
        ) {

            return cleaned;

        }

    }


    return "";

}


/* =========================================================
   DATABASE
========================================================= */

async function checkDatabase() {

    const lrn =
        lrnField.value
            .trim()
            .replace(
                /\s/g,
                ""
            );


    if (
        !lrn
    ) {

        status.textContent =
            "No LRN was detected.";

        return;

    }


    status.textContent =
        "Checking Google Sheets...";


    databaseButton.disabled =
        true;


    databaseResult.style.display =
        "none";


    try {

        const url =
            DATABASE_URL +
            "?lrn=" +
            encodeURIComponent(
                lrn
            );


        console.log(
            "DATABASE REQUEST:",
            url
        );


        const response =
            await fetch(
                url
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP error: " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "DATABASE RESULT:",
            result
        );


        if (
            result.match === true
        ) {

            databaseResult.style.display =
                "block";


            databaseResult.className =
                "database-result valid";


            databaseStatus.textContent =
                "🟢 VALID STUDENT";


            databaseDetails.innerHTML =

                "<strong>Name:</strong> " +

                escapeHTML(
                    result.student.name
                ) +

                "<br><br>" +

                "<strong>LRN:</strong> " +

                escapeHTML(
                    result.student.lrn
                ) +

                "<br><br>" +

                "<strong>ID Number:</strong> " +

                escapeHTML(
                    result.student.idNumber
                ) +

                "<br><br>" +

                "<strong>Grade:</strong> " +

                escapeHTML(
                    result.student.grade
                ) +

                "<br><br>" +

                "<strong>Section:</strong> " +

                escapeHTML(
                    result.student.section
                );


            status.textContent =
                "Student identified successfully.";

        }


        else {

            databaseResult.style.display =
                "block";


            databaseResult.className =
                "database-result invalid";


            databaseStatus.textContent =
                "🔴 STUDENT NOT FOUND";


            databaseDetails.innerHTML =

                "<strong>Scanned LRN:</strong> " +

                escapeHTML(
                    lrn
                ) +

                "<br><br>" +

                "This LRN was not found " +
                "in the student database.";


            status.textContent =
                "No matching student.";

        }

    }


    catch (error) {

        console.error(
            "DATABASE ERROR:",
            error
        );


        databaseResult.style.display =
            "block";


        databaseResult.className =
            "database-result invalid";


        databaseStatus.textContent =
            "⚠️ DATABASE CONNECTION FAILED";


        databaseDetails.innerHTML =

            "Could not connect to Google Apps Script." +

            "<br><br>" +

            "<small>" +

            escapeHTML(
                error.message
            ) +

            "</small>";


        status.textContent =
            "Database connection failed.";

    }


    finally {

        databaseButton.disabled =
            false;

    }

}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
