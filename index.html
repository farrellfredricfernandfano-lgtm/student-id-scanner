<script>


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const lrnCanvas =
    document.getElementById("lrnCanvas");

const processedImage =
    document.getElementById("processedImage");

const startButton =
    document.getElementById("startButton");

const scanButton =
    document.getElementById("scanButton");

const stopButton =
    document.getElementById("stopButton");

const databaseButton =
    document.getElementById("databaseButton");

const status =
    document.getElementById("status");

const progressBar =

const nameField =

const gradeField =
    document.getElementById("gradeField");

const sectionField =

const lrnField =
    document.getElementById("lrnField");

const idField =
    document.getElementById("idField");

const databaseResult =
    document.getElementById("databaseResult");

const databaseStatus =
    document.getElementById("databaseStatus");

const databaseDetails =
    document.getElementById("databaseDetails");

const rawOCR =
    document.getElementById("rawOCR");


/* =========================================================
   RED DETECTION
========================================================= */

const redDetectionBox =
    document.getElementById(
        "redDetectionBox"
    );


const redDetectionCanvas =
    document.createElement(
        "canvas"
    );


const redDetectionCtx =
    redDetectionCanvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );


let redDetectionTimer =
    null;


let lastRedDetection =
    null;


/* =========================================================
   GOOGLE APPS SCRIPT DATABASE
========================================================= */

const DATABASE_URL =
    "https://script.google.com/macros/s/AKfycby8SQH20dz2PK6Covm_GOy4sG1WigvDaxZr8a--gbrI_LBKE1KJoQO7AMzaKZR_3mQ/exec";


/* =========================================================
   CAMERA STREAM
========================================================= */

let cameraStream =
    null;


/* =========================================================
   BUTTON EVENTS
========================================================= */

startButton.addEventListener(
    "click",
    startCamera
);


scanButton.addEventListener(
    "click",
    captureAndScan
);


stopButton.addEventListener(
    "click",
    stopCamera
);


databaseButton.addEventListener(
    "click",
    checkDatabase
);


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

    try {

        status.textContent =
            "Starting camera...";


        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio: false,

                    video: {

                        facingMode: {
                            ideal: "environment"
                        },

                        width: {
                            ideal: 1920
                        },

                        height: {
                            ideal: 1080
                        },

                        frameRate: {
                            ideal: 30
                        }

                    }

                });


        video.srcObject =
            cameraStream;


        /*
         * Give the video a moment to
         * initialize its dimensions.
         */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    300
                )
        );


        startButton.disabled =
            true;

        scanButton.disabled =
            false;

        stopButton.disabled =
            false;


        status.textContent =
            "Camera ready. Align the entire ID inside the green guide.";


        /*
         * Start live red detection.
         */

        if (redDetectionTimer) {

            clearInterval(
                redDetectionTimer
            );

        }


        redDetectionTimer =
            setInterval(

                detectRedIDLive,

                250

            );

    }

    catch (error) {

        console.error(
            "CAMERA ERROR:",
            error
        );


        status.textContent =
            "Could not access camera: " +
            error.message;

    }

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera() {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        cameraStream =
            null;

    }


    video.srcObject =
        null;


    if (redDetectionTimer) {

        clearInterval(
            redDetectionTimer
        );

        redDetectionTimer =
            null;

    }


    redDetectionBox.style.display =
        "none";


    lastRedDetection =
        null;


    startButton.disabled =
        false;

    scanButton.disabled =
        true;

    stopButton.disabled =
        true;


    status.textContent =
        "Camera stopped.";

}


/* =========================================================
   LIVE RED DETECTION
========================================================= */

function detectRedIDLive() {

    if (

        !cameraStream ||

        !video.videoWidth ||

        !video.videoHeight

    ) {

        redDetectionBox.style.display =
            "none";

        return;

    }


    /*
     * Use a small image for fast
     * real-time detection.
     */

    const detectionWidth =
        320;


    const detectionHeight =
        Math.round(

            video.videoHeight *
            (
                detectionWidth /
                video.videoWidth
            )

        );


    redDetectionCanvas.width =
        detectionWidth;


    redDetectionCanvas.height =
        detectionHeight;


    redDetectionCtx.drawImage(

        video,

        0,
        0,

        video.videoWidth,
        video.videoHeight,

        0,
        0,

        detectionWidth,
        detectionHeight

    );


    const imageData =
        redDetectionCtx.getImageData(

            0,
            0,

            detectionWidth,
            detectionHeight

        );


    const data =
        imageData.data;


    /*
     * Match the green guide:
     * 88% of the camera width.
     */

    const guideLeft =
        Math.round(
            detectionWidth * 0.06
        );


    const guideRight =
        Math.round(
            detectionWidth * 0.94
        );


    const guideWidth =
        guideRight -
        guideLeft;


    const guideHeight =
        guideWidth / 1.586;


    const guideTop =
        Math.round(

            (
                detectionHeight -
                guideHeight
            ) / 2

        );


    const guideBottom =
        Math.round(

            guideTop +
            guideHeight

        );


    let minX =
        detectionWidth;


    let minY =
        detectionHeight;


    let maxX =
        -1;


    let maxY =
        -1;


    let redPixelCount =
        0;


    /*
     * Scan for red pixels.
     */

    for (

        let y =
            guideTop;

        y <
            guideBottom;

        y++

    ) {

        for (

            let x =
                guideLeft;

            x <
                guideRight;

            x++

        ) {

            const index =
                (
                    y *
                    detectionWidth +
                    x
                ) * 4;


            const r =
                data[index];


            const g =
                data[index + 1];


            const b =
                data[index + 2];


            /*
             * Red color threshold.
             */

            const isRed =

                r > 80 &&

                r >
                    g * 1.25 &&

                r >
                    b * 1.25 &&

                (r - g) > 25 &&

                (r - b) > 25;


            if (isRed) {

                redPixelCount++;


                if (x < minX)
                    minX = x;


                if (y < minY)
                    minY = y;


                if (x > maxX)
                    maxX = x;


                if (y > maxY)
                    maxY = y;

            }

        }

    }


    /*
     * Nothing red was found.
     */

    if (

        maxX === -1 ||

        maxY === -1

    ) {

        redDetectionBox.style.display =
            "none";

        lastRedDetection =
            null;

        return;

    }


    const detectedWidth =
        maxX -
        minX;


    const detectedHeight =
        maxY -
        minY;


    const detectedArea =
        detectedWidth *
        detectedHeight;


    const guideArea =
        guideWidth *
        guideHeight;


    /*
     * Ignore small red objects.
     */

    if (

        detectedArea <
        guideArea * 0.08

    ) {

        redDetectionBox.style.display =
            "none";

        lastRedDetection =
            null;

        return;

    }


    /*
     * Add padding around red area.
     */

    const paddingX =
        detectedWidth *
        0.08;


    const paddingY =
        detectedHeight *
        0.08;


    minX -=
        paddingX;


    minY -=
        paddingY;


    maxX +=
        paddingX;


    maxY +=
        paddingY;


    /*
     * Keep box inside guide.
     */

    minX =
        Math.max(
            guideLeft,
            minX
        );


    minY =
        Math.max(
            guideTop,
            minY
        );


    maxX =
        Math.min(
            guideRight,
            maxX
        );


    maxY =
        Math.min(
            guideBottom,
            maxY
        );


    /*
     * Convert to percentages
     * for the video element.
     */

    const leftPercent =

        (
            minX /
            detectionWidth
        ) * 100;


    const topPercent =

        (
            minY /
            detectionHeight
        ) * 100;


    const widthPercent =

        (
            (
                maxX -
                minX
            ) /
            detectionWidth
        ) * 100;


    const heightPercent =

        (
            (
                maxY -
                minY
            ) /
            detectionHeight
        ) * 100;


    /*
     * Display the blue box.
     */

    redDetectionBox.style.display =
        "block";


    redDetectionBox.style.left =
        leftPercent + "%";


    redDetectionBox.style.top =
        topPercent + "%";


    redDetectionBox.style.width =
        widthPercent + "%";


    redDetectionBox.style.height =
        heightPercent + "%";


    /*
     * Save detection coordinates.
     */

    lastRedDetection = {

        x:
            minX,

        y:
            minY,

        width:
            maxX -
            minX,

        height:
            maxY -
            minY,

        detectionWidth:
            detectionWidth,

        detectionHeight:
            detectionHeight

    };

}


/* =========================================================
   FALLBACK CROP
========================================================= */

function getFallbackCardCrop(
    videoWidth,
    videoHeight
) {

    const cropWidth =
        videoWidth *
        0.88;


    const cropHeight =
        cropWidth /
        1.586;


    let finalWidth =
        cropWidth;


    let finalHeight =
        cropHeight;


    if (

        finalHeight >
        videoHeight * 0.92

    ) {

        finalHeight =
            videoHeight * 0.92;


        finalWidth =
            finalHeight *
            1.586;

    }


    return {

        x:
            (
                videoWidth -
                finalWidth
            ) / 2,

        y:
            (
                videoHeight -
                finalHeight
            ) / 2,

        width:
            finalWidth,

        height:
            finalHeight

    };

}


/* =========================================================
   RED ID CROP
========================================================= */

function detectRedIDArea(

    const sourceWidth =
        sourceCanvas.width;


    const sourceHeight =
        sourceCanvas.height;


    const detectionWidth =
        320;


    const detectionHeight =
        Math.round(

            sourceHeight *
            (
                detectionWidth /
                sourceWidth
            )

        );


    const smallCanvas =
        document.createElement(
            "canvas"
        );


    smallCanvas.width =
        detectionWidth;


    smallCanvas.height =
        detectionHeight;


    const ctx =
        smallCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    ctx.drawImage(

        sourceCanvas,

        0,
        0,

        sourceWidth,
        sourceHeight,

        0,
        0,

        detectionWidth,
        detectionHeight

    );


    const imageData =
        ctx.getImageData(

            0,
            0,

            detectionWidth,
            detectionHeight

        );


    const data =
        imageData.data;


    /*
     * Green-guide area.
     */

    const guideLeft =
        detectionWidth *
        0.06;


    const guideRight =
        detectionWidth *
        0.94;


    const guideWidth =
        guideRight -
        guideLeft;


    const guideHeight =
        guideWidth /
        1.586;


    const guideTop =
        (
            detectionHeight -
            guideHeight
        ) / 2;


    const guideBottom =
        guideTop +
        guideHeight;


    let minX =
        detectionWidth;


    let minY =
        detectionHeight;


    let maxX =
        -1;


    let maxY =
        -1;


    /*
     * Find red pixels.
     */

    for (

        let y =
            Math.floor(
                guideTop
            );

        y <
            Math.ceil(
                guideBottom
            );

        y++

    ) {

        for (

            let x =
                Math.floor(
                    guideLeft
                );

            x <
                Math.ceil(
                    guideRight
                );

            x++

        ) {

            const index =

                    detectionWidth +
                    x
                ) * 4;


            const r =
                data[index];


            const g =
                data[index + 1];


            const b =
                data[index + 2];


            const isRed =

                r > 80 &&

                r >
                    g * 1.25 &&

                r >
                    b * 1.25 &&

                (r - g) > 25 &&

                (r - b) > 25;


            if (isRed) {

                minX =
                    Math.min(
                        minX,
                        x
                    );


                minY =
                    Math.min(
                        minY,
                        y
                    );


                maxX =
                    Math.max(
                        maxX,
                        x
                    );


                maxY =
                    Math.max(
                        maxY,
                        y
                    );

            }

        }

    }


    /*
     * If red detection fails,
     * use the old camera crop.
     */

    if (

        maxX === -1 ||

        maxY === -1

    ) {

        return getFallbackCardCrop(

            sourceWidth,
            sourceHeight

        );

    }


    let detectedWidth =
        maxX -
        minX;


    let detectedHeight =
        maxY -
        minY;


    /*
     * Reject tiny detections.
     */

    if (

        detectedWidth *
        detectedHeight

        <

        guideWidth *
        guideHeight *
        0.08

    ) {

        return getFallbackCardCrop(

            sourceWidth,
            sourceHeight

        );

    }


    /*
     * Add padding.
     */

    const paddingX =
        detectedWidth *
        0.12;


    const paddingY =
        detectedHeight *
        0.12;


    minX -=
        paddingX;


    minY -=
        paddingY;


    maxX +=
        paddingX;


    maxY +=
        paddingY;


    /*
     * Convert back to
     * original camera coordinates.
     */

    let cropX =

        (
            minX /
            detectionWidth
        ) *
        sourceWidth;


    let cropY =

        (
            minY /
            detectionHeight
        ) *
        sourceHeight;


    let cropWidth =

        (
            (
                maxX -
                minX
            ) /
            detectionWidth
        ) *
        sourceWidth;


    let cropHeight =

        (
            (
                maxY -
                minY
            ) /
            detectionHeight
        ) *
        sourceHeight;


    /*
     * Maintain ID-card ratio.
     */

    const targetRatio =
        1.586;


    const currentRatio =
        cropWidth /
        cropHeight;


    if (

        currentRatio <
        targetRatio

    ) {

        const newWidth =
            cropHeight *
            targetRatio;


        cropX -=

            (
                newWidth -
                cropWidth
            ) / 2;


        cropWidth =
            newWidth;

    }

    else {

        const newHeight =
            cropWidth /
            targetRatio;


        cropY -=

            (
                newHeight -
                cropHeight
            ) / 2;


        cropHeight =
            newHeight;

    }


    /*
     * Keep crop inside image.
     */

    cropX =
        Math.max(
            0,
            cropX
        );


    cropY =
        Math.max(
            0,
            cropY
        );


    if (

        cropX +
        cropWidth >
        sourceWidth

    ) {

        cropWidth =
            sourceWidth -
            cropX;

    }


    if (

        cropY +
        cropHeight >
        sourceHeight

    ) {

        cropHeight =
            sourceHeight -
            cropY;

    }


    return {

        x:
            cropX,

        y:
            cropY,

        width:
            cropWidth,

        height:
            cropHeight

    };

}


/* =========================================================
   PREPROCESSING
========================================================= */

function preprocessCanvas(
    sourceCanvas,
    contrast = 1.35
) {

    const ctx =
        sourceCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    const imageData =
        ctx.getImageData(

            0,
            0,

            sourceCanvas.width,
            sourceCanvas.height

        );


    const data =
        imageData.data;


    const factor =

        (
            259 *
            (
                contrast +
                255
            )
        ) /

        (
            255 *
            (
                259 -
                contrast
            )
        );


    for (

        let i = 0;

        i < data.length;

        i += 4

    ) {

        const r =
            data[i];


        const g =
            data[i + 1];


        const b =
            data[i + 2];


        let gray =

            0.299 * r +
            0.587 * g +
            0.114 * b;


        gray =

            factor *
            (
                gray -
                128
            ) +
            128;


        gray =

            Math.max(

                0,

                Math.min(
                    255,
                    gray
                )

            );


        data[i] =
            gray;


        data[i + 1] =
            gray;


        data[i + 2] =
            gray;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );

}


/* =========================================================
   CAPTURE + OCR
========================================================= */

async function captureAndScan() {

    if (!cameraStream) {

        alert(
            "Please start the camera first."
        );

        return;

    }


    scanButton.disabled =
        true;


    databaseButton.disabled =
        true;


    databaseResult.style.display =
        "none";


    progressBar.style.width =
        "0%";


    status.textContent =
        "Capturing ID...";


    try {

        await performOCR();

    }

    catch (error) {

        console.error(
            "SCAN ERROR:",
            error
        );


        status.textContent =
            "Scanning failed: " +
            error.message;

    }


    scanButton.disabled =
        false;

}


/* =========================================================
   OCR
========================================================= */

async function performOCR() {

    status.textContent =
        "Preparing ID image...";


    const videoWidth =
        video.videoWidth;


    const videoHeight =
        video.videoHeight;


    if (

        !videoWidth ||

        !videoHeight

    ) {

        throw new Error(
            "Camera image is not ready."
        );

    }


    /*
     * Capture current frame.
     */

    const fullCanvas =
        document.createElement(
            "canvas"
        );


    fullCanvas.width =
        videoWidth;


    fullCanvas.height =
        videoHeight;


    const fullCtx =
        fullCanvas.getContext(
            "2d"
        );


    fullCtx.drawImage(

        video,

        0,
        0,

        videoWidth,
        videoHeight

    );


    /*
     * Detect red ID.
     */

    status.textContent =
        "Detecting red ID area...";


    const crop =
        detectRedIDArea(
            fullCanvas
        );


    console.log(
        "FINAL ID CROP:",
        crop
    );


    /*
     * Hide overlay while processing.
     */

    redDetectionBox.style.display =
        "none";


    /*
     * Upscale for OCR.
     */

    const scale =
        2;


    canvas.width =
        Math.round(
            crop.width *
            scale
        );


    canvas.height =
        Math.round(
            crop.height *
            scale
        );


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.imageSmoothingEnabled =
        true;


    ctx.imageSmoothingQuality =
        "high";


    ctx.drawImage(

        fullCanvas,

        crop.x,
        crop.y,

        crop.width,
        crop.height,

        0,
        0,

        canvas.width,
        canvas.height

    );


    status.textContent =
        "Enhancing image...";


    /*
     * Grayscale + contrast.
     */

    preprocessCanvas(
        canvas,
        1.35
    );


    /*
     * Display processed image.
     *
     * CSS keeps it small on mobile,
     * while canvas remains high-resolution.
     */

    processedImage.src =
        canvas.toDataURL(
            "image/png"
        );


    processedImage.style.display =
        "block";


    /* =====================================================
       TESSERACT
    ===================================================== */

    status.textContent =
        "Reading ID information...";


    const result =
        await Tesseract.recognize(

            canvas,

            "eng",

            {

                logger:
                    function(info) {

                        console.log(
                            "TESSERACT:",
                            info
                        );


                        if (
                            info.progress !==
                            undefined
                        ) {

                            progressBar.style.width =

                                (
                                    info.progress *
                                    80
                                ) + "%";

                        }


                        if (
                            info.status
                        ) {

                            status.textContent =
                                info.status;

                        }

                    },


                tessedit_pageseg_mode:
                    6,


                preserve_interword_spaces:
                    1

            }

        );


    const text =
        result.data.text;


    console.log(
        "MAIN OCR RESULT:",
        text
    );


    rawOCR.textContent =
        text ||
        "Tesseract returned no text.";


    /*
     * Parse fields.
     */

    parseOCR(
        text
    );


    /*
     * Targeted LRN OCR if necessary.
     */

    if (

        !isValidLRN(
            lrnField.value
        )

    ) {

        status.textContent =
            "Improving LRN recognition...";


        const targetedLRN =
            await performTargetedLRNOCR(
                canvas
            );


        if (
            isValidLRN(
                targetedLRN
            )
        ) {

            lrnField.value =
                targetedLRN;


            rawOCR.textContent +=

                "\n\n[Targeted LRN OCR]\n" +
                targetedLRN;

        }

    }


    progressBar.style.width =
        "100%";


    /*
     * Automatically check database
     * when a valid LRN exists.
     */

    if (

        isValidLRN(
            lrnField.value
        )

    ) {

        status.textContent =
            "OCR complete. Checking database...";


        await checkDatabase();

    }

    else {

        status.textContent =
            "OCR complete. LRN could not be confidently detected.";


        databaseButton.disabled =
            false;

    }

}


/* =========================================================
   TARGETED LRN OCR
========================================================= */

async function performTargetedLRNOCR(
    fullCanvas
) {

    const width =
        fullCanvas.width;


    const height =
        fullCanvas.height;


    /*
     * LRN area.
     */

    const x =
        width * 0.05;


    const y =
        height * 0.25;


    const cropWidth =
        width * 0.90;


    const cropHeight =
        height * 0.18;


    const scale =
        3;


    lrnCanvas.width =
        Math.round(
            cropWidth *
            scale
        );


    lrnCanvas.height =
        Math.round(
            cropHeight *
            scale
        );


    const ctx =
        lrnCanvas.getContext(
            "2d"
        );


    ctx.imageSmoothingEnabled =
        true;


    ctx.imageSmoothingQuality =
        "high";


    ctx.drawImage(

        fullCanvas,

        x,
        y,

        cropWidth,
        cropHeight,

        0,
        0,

        lrnCanvas.width,
        lrnCanvas.height

    );


    preprocessCanvas(
        lrnCanvas,
        1.6
    );


    const result =
        await Tesseract.recognize(

            lrnCanvas,

            "eng",

            {

                logger:
                    function(info) {

                        console.log(
                            "LRN OCR:",
                            info
                        );

                    },


                tessedit_pageseg_mode:
                    7,


                tessedit_char_whitelist:
                    "LRN:0123456789"

            }

        );


    const text =
        result.data.text;


    console.log(
        "TARGETED LRN RESULT:",
        text
    );


    return extractBestLRN(
        text
    );

}


/* =========================================================
   PARSE OCR
========================================================= */

function parseOCR(
    text
) {

    nameField.value =
        "";

    gradeField.value =
        "";

    sectionField.value =
        "";

    lrnField.value =
        "";

    idField.value =
        "";


    const lines =
        text
            .split(/\r?\n/)
            .map(
                line =>
                    line.trim()
            )
            .filter(
                line =>
                    line.length > 0
            );


    /* =====================================================
       LRN
    ===================================================== */

    const lrn =
        extractBestLRN(
            text
        );


    if (
        isValidLRN(lrn)
    ) {

        lrnField.value =
            lrn;

    }


    /* =====================================================
       ID NUMBER
    ===================================================== */

    let idMatch =
        text.match(

            /ID\s*(?:NO|NUMBER)?\s*[:#.\-]?\s*([0-9]{3,})\s*[-–—]\s*([0-9]{2,})\s*[-–—]?\s*([A-Za-z]{0,5})/i

        );


    if (idMatch) {

        let id =
            idMatch[1] +
            "-" +
            idMatch[2];


        if (
            idMatch[3]
        ) {

            id +=
                "-" +
                idMatch[3]
                    .toUpperCase();

        }


        idField.value =
            id;

    }

    else {

        const fallbackID =
            text.match(

                /\b([0-9]{5,})\s*[-–—]\s*([0-9]{2,})\s*[-–—]?\s*(SHS|JHS)?\b/i

            );


        if (
            fallbackID
        ) {

            idField.value =
                fallbackID[1] +
                "-" +
                fallbackID[2];


            if (
                fallbackID[3]
            ) {

                idField.value +=
                    "-" +
                    fallbackID[3]
                        .toUpperCase();

            }

        }

    }


    /* =====================================================
       GRADE + SECTION
    ===================================================== */

    let gradeMatch =
        text.match(

            /GRADE\s*(?:LEVEL)?\s*(7|8|9|10|11|12)\s*[-–—:]?\s*([A-Za-z0-9][A-Za-z0-9 .'-]*)/i

        );


    if (
        gradeMatch
    ) {

        gradeField.value =
            gradeMatch[1];


        sectionField.value =
            cleanSection(
                gradeMatch[2]
            );

    }


    /* =====================================================
       FALLBACK GRADE
    ===================================================== */

    if (
        !gradeField.value
    ) {

        const fallbackGrade =
            text.match(

                /\b(?:G[A-Z]*R[A-Z]*D[A-Z]*E?)\s*[^0-9]{0,3}(7|8|9|10|11|12)\s*[-–—:]?\s*([A-Za-z0-9 .'-]+)/i

            );


        if (
            fallbackGrade
        ) {

            gradeField.value =
                fallbackGrade[1];


            sectionField.value =
                cleanSection(
                    fallbackGrade[2]
                );

        }

    }


    /* =====================================================
       NAME
    ===================================================== */

    for (
        const line of lines
    ) {

        const upper =
            line.toUpperCase();


        if (

            upper.includes("LRN") ||

            upper.includes("ID NO") ||

            upper.includes("ID NUMBER") ||

            upper.includes("GRADE") ||

            upper.includes("SECTION")

        ) {

            continue;

        }


        const cleaned =
            line

                .replace(
                    /[^A-Za-zÀ-ÿ.' -]/g,
                    ""
                )

                .replace(
                    /\s+/g,
                    " "
                )

                .trim();


        const words =
            cleaned
                .split(" ")
                .filter(
                    word =>
                        word.length > 0
                );


        if (

            words.length >= 2 &&

            cleaned.length >= 5

        ) {

            nameField.value =
                cleaned;

            break;

        }

    }

}


/* =========================================================
   EXTRACT LRN
========================================================= */

function extractBestLRN(
    text
) {

    let match =
        text.match(

            /LRN\s*[:#=\-]?\s*([0-9][0-9\s]{10,18})/i

        );


    if (
        match
    ) {

        const digits =
            cleanDigits(
                match[1]
            );


        if (
            isValidLRN(
                digits
            )
        ) {

            return digits;

        }

    }


    /*
     * OCR label may be wrong.
     */

    match =
        text.match(

            /\b[A-Z]{2,4}\s*[:#=\-]?\s*([0-9][0-9\s]{10,18})\b/i

        );


    if (
        match
    ) {

        const digits =
            cleanDigits(
                match[1]
            );


        if (
            isValidLRN(
                digits
            )
        ) {

            return digits;

        }

    }


    /*
     * Final fallback:
     * find any 12-digit number.
     */

    const groups =
        text.match(
            /[0-9][0-9\s]{10,18}/g
        );


    if (
        groups
    ) {

        for (
            const group of groups
        ) {

            const digits =
                cleanDigits(
                    group
                );


            if (
                isValidLRN(
                    digits
                )
            ) {

                return digits;

            }

        }

    }


    return "";

}


/* =========================================================
   CLEAN DIGITS
========================================================= */

function cleanDigits(
    value
) {

    return String(
        value
    )

        .replace(
            /[OoQq]/g,
            "0"
        )

        .replace(
            /[IiLl|]/g,
            "1"
        )

        .replace(
            /[Ss]/g,
            "5"
        )

        .replace(
            /[Bb]/g,
            "8"
        )

        .replace(
            /[Gg]/g,
            "6"
        )

        .replace(
            /[^0-9]/g,
            ""
        );

}


/* =========================================================
   VALIDATE LRN
========================================================= */

function isValidLRN(
    lrn
) {

    return /^\d{12}$/.test(
        String(lrn).trim()
    );

}


/* =========================================================
   CLEAN SECTION
========================================================= */

function cleanSection(
    section
) {

    return String(
        section
    )

        .replace(
            /\s+/g,
            " "
        )

        .replace(
            /^[\-–—:\s]+/,
            ""
        )

        .trim();

}


/* =========================================================
   DATABASE
========================================================= */

async function checkDatabase() {

    const lrn =
        lrnField.value
            .trim();


    if (
        !isValidLRN(lrn)
    ) {

        status.textContent =
            "No valid 12-digit LRN was detected.";


        databaseButton.disabled =
            false;


        return;

    }


    if (
        DATABASE_URL.includes(
            "PASTE_YOUR"
        )
    ) {

        alert(
            "Apps Script URL has not been entered."
        );


        databaseButton.disabled =
            false;


        return;

    }


    status.textContent =
        "Checking Google Sheets...";


    databaseButton.disabled =
        true;


    databaseResult.style.display =
        "none";


    try {

        const url =
            DATABASE_URL +
            "?lrn=" +
            encodeURIComponent(
                lrn
            );


        const response =
            await fetch(
                url
            );


        if (
            !response.ok
        ) {

            throw new Error(

                "HTTP error: " +
                response.status

            );

        }


        const result =
            await response.json();


        console.log(
            "DATABASE RESULT:",
            result
        );


        if (
            result.match === true
        ) {

            databaseResult.style.display =
                "block";


            databaseResult.className =
                "database-result valid";


            databaseStatus.textContent =
                "🟢 VALID STUDENT";


            databaseDetails.innerHTML =

                "<strong>Name:</strong> " +
                escapeHTML(
                    result.student.name
                ) +

                "<br><br>" +

                "<strong>LRN:</strong> " +
                escapeHTML(
                    result.student.lrn
                ) +

                "<br><br>" +

                "<strong>ID Number:</strong> " +
                escapeHTML(
                    result.student.idNumber
                ) +

                "<br><br>" +

                "<strong>Grade:</strong> " +
                escapeHTML(
                    result.student.grade
                ) +

                "<br><br>" +

                "<strong>Section:</strong> " +
                escapeHTML(
                    result.student.section
                );


            status.textContent =
                "Student identified successfully.";

        }

        else {

            databaseResult.style.display =
                "block";


            databaseResult.className =
                "database-result invalid";


            databaseStatus.textContent =
                "🔴 STUDENT NOT FOUND";


            databaseDetails.innerHTML =

                "<strong>Scanned LRN:</strong> " +
                escapeHTML(
                    lrn
                ) +

                "<br><br>" +

                "This LRN was not found in the student database.";


            status.textContent =
                "No matching student.";

        }

    }

    catch (error) {

        console.error(
            "DATABASE ERROR:",
            error
        );


        databaseResult.style.display =
            "block";


        databaseResult.className =
            "database-result invalid";


        databaseStatus.textContent =
            "⚠️ DATABASE CONNECTION FAILED";


        databaseDetails.innerHTML =

            "Could not connect to Google Apps Script." +

            "<br><br>" +

            "<small>" +

            escapeHTML(
                error.message
            ) +

            "</small>";


        status.textContent =
            "Database connection failed.";

    }


    finally {

        databaseButton.disabled =
            false;

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
) {

    return String(
        value
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
