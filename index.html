const nameField =

const gradeField =
    document.getElementById("gradeField");

const sectionField =

const lrnField =
    document.getElementById("lrnField");

const idField =
    document.getElementById("idField");

const databaseStatus =
    document.getElementById("databaseStatus");

const databaseDetails =
    document.getElementById("databaseDetails");


/* =========================================================
   DATABASE
========================================================= */

const DATABASE_URL =
"https://script.google.com/macros/s/AKfycby8SQH20dz2PK6Covm_GOy4sG1WigvDaxZr8a--gbrI_LBKE1KJoQO7AMzaKZR_3mQ/exec";


let cameraStream = null;


/* =========================================================
   BUTTON EVENTS
========================================================= */

startButton.addEventListener(

);

scanButton.addEventListener(

/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

    try {

        status.textContent =
            "Starting camera...";

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                audio: false,

                video: {

                        ideal: 1080
                    },

                },

/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera() {

            .getTracks()

            );

        cameraStream = null;

    video.srcObject = null;

    stopButton.disabled =
        true;

    databaseButton.disabled =
        true;

}


/* =========================================================
   CAPTURE
========================================================= */

async function captureAndScan() {

    if (!cameraStream) {

        status.textContent =
            "Please start the camera first.";

        return;

    }


    scanButton.disabled =
        true;

    databaseButton.disabled =
        true;


    progressBar.style.width =
        "0%";


    databaseStatus.textContent =
        "";

    databaseDetails.textContent =
        "";


    try {

        await performOCR();

    } catch (error) {

        console.error(error);

        status.textContent =
            "Scanning error: " +
            error.message;

    }


    scanButton.disabled =
        false;

}


/* =========================================================
   IMAGE PREPROCESSING
   Gentle processing is kept because this worked better
   with the user's ID images.
========================================================= */

function preprocessCanvas(
    sourceCanvas,
    contrast = 1.35
) {

    const ctx =
        sourceCanvas.getContext("2d", {
            willReadFrequently: true
        });


    const imageData =
        ctx.getImageData(
            0,
            0,
            sourceCanvas.width,
            sourceCanvas.height
        );


    const data =
        imageData.data;


    const factor =
        (259 * (contrast + 255)) /
        (255 * (259 - contrast));


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];


        let gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;


        gray =
            factor *
            (gray - 128) +
            128;


        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );


        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );

}


/* =========================================================
   MILD SHARPENING
========================================================= */

function createSharpenedCanvas(
    sourceCanvas
) {

    const sharpenCanvas =
        document.createElement("canvas");


    sharpenCanvas.width =
        sourceCanvas.width;

    sharpenCanvas.height =
        sourceCanvas.height;


    const ctx =
        sharpenCanvas.getContext("2d");


    ctx.drawImage(
        sourceCanvas,
        0,
        0
    );


    const imageData =
        ctx.getImageData(
            0,
            0,
            sharpenCanvas.width,
            sharpenCanvas.height
        );


    const data =
        imageData.data;


    const copy =
        new Uint8ClampedArray(data);


    const width =
        sharpenCanvas.width;

    const height =
        sharpenCanvas.height;


    /*
       Very mild sharpening.
       This avoids the aggressive processing that
       previously made OCR worse.
    */

    for (
        let y = 1;
        y < height - 1;
        y++
    ) {

        for (
            let x = 1;
            x < width - 1;
            x++
        ) {

            const index =
                (y * width + x) * 4;


            const center =
                copy[index];


            const top =
                copy[((y - 1) * width + x) * 4];

            const bottom =
                copy[((y + 1) * width + x) * 4];

            const left =
                copy[(y * width + x - 1) * 4];

            const right =
                copy[(y * width + x + 1) * 4];


            let value =
                center * 1.4 -
                (top + bottom + left + right) * 0.1;


            value =
                Math.max(
                    0,
                    Math.min(
                        255,
                        value
                    )
                );


            data[index] =
                value;

            data[index + 1] =
                value;

            data[index + 2] =
                value;

        }

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return sharpenCanvas;

}


/* =========================================================
   MAIN OCR
========================================================= */

async function performOCR() {

    const videoWidth =
        video.videoWidth;

    const videoHeight =
        video.videoHeight;


    if (
        !videoWidth ||
        !videoHeight
    ) {

        throw new Error(
            "Camera image is not ready."
        );

    }


    /*
       Requested output resolution.
    */

    const TARGET_WIDTH =
        1850;

    const TARGET_HEIGHT =
        617;


    /*
       Keep the original ID-card crop.
    */

    let cropWidth =
        videoWidth * 0.88;


    let cropHeight =
        cropWidth / 1.586;


    if (
        cropHeight >
        videoHeight * 0.92
    ) {

        cropHeight =
            videoHeight * 0.92;

        cropWidth =
            cropHeight * 1.586;

    }


    const cropX =
        (videoWidth - cropWidth) / 2;


    const cropY =
        (videoHeight - cropHeight) / 2;


    /*
       The OCR canvas is exactly 1850 × 617
       as requested.
    */

    canvas.width =
        TARGET_WIDTH;

    canvas.height =
        TARGET_HEIGHT;


    const ctx =
        canvas.getContext("2d");


    ctx.imageSmoothingEnabled =
        true;

    ctx.imageSmoothingQuality =
        "high";


    ctx.drawImage(

        video,

        cropX,
        cropY,
        cropWidth,
        cropHeight,

        0,
        0,
        TARGET_WIDTH,
        TARGET_HEIGHT

    );


    /*
       Primary processing.
       Keep this gentle because the original
       grayscale + contrast method worked.
    */

    preprocessCanvas(
        canvas,
        1.35
    );


    processedImage.src =
        canvas.toDataURL(
            "image/png"
        );


    processedImage.style.display =
        "block";


    let bestResults = {

        name: "",
        grade: "",
        section: "",
        lrn: "",
        id: ""

    };


    const OCR_RESULTS = [];


    /* =====================================================
       PASS 1
    ===================================================== */

    status.textContent =
        "Scanning ID... Pass 1";

    progressBar.style.width =
        "15%";


    const pass1 =
        await Tesseract.recognize(

            canvas,

            "eng",

            {

                tessedit_pageseg_mode: 6,

                logger: message => {

                    if (
                        message.status ===
                        "recognizing text"
                    ) {

                        const p =
                            Math.round(
                                message.progress *
                                35
                            );

                        progressBar.style.width =
                            p + "%";

                    }

                }

            }

        );


    const pass1Text =
        pass1.data.text;


    OCR_RESULTS.push(
        "[OCR PASS 1]\n" +
        pass1Text
    );


    bestResults =
        mergeOCRResults(

            bestResults,

            parseOCR(pass1Text)

        );


    /*
       FAST PATH:
       If Pass 1 already found both critical
       numeric identifiers, don't waste time
       running another full-image OCR.
    */

    if (
        isValidLRN(bestResults.lrn) &&
        bestResults.id
    ) {

        progressBar.style.width =
            "100%";

        status.textContent =
            "Scan complete.";

    } else {


        /* =================================================
           PASS 2
        ================================================= */

        status.textContent =
            "Improving image... Pass 2";

        progressBar.style.width =
            "45%";


        const sharpenCanvas =
            createSharpenedCanvas(
                canvas
            );


        const pass2 =
            await Tesseract.recognize(

                sharpenCanvas,

                "eng",

                {

                    tessedit_pageseg_mode: 6,

                    logger: message => {

                        if (
                            message.status ===
                            "recognizing text"
                        ) {

                            const p =
                                45 +
                                Math.round(
                                    message.progress *
                                    30
                                );

                            progressBar.style.width =
                                p + "%";

                        }

                    }

                }

            );


        const pass2Text =
            pass2.data.text;


        OCR_RESULTS.push(
            "[OCR PASS 2 - SHARPENED]\n" +
            pass2Text
        );


        bestResults =
            mergeOCRResults(

                bestResults,

                parseOCR(pass2Text)

            );


        /*
           If Pass 2 successfully found both
           critical identifiers, stop here.
        */

        if (
            isValidLRN(bestResults.lrn) &&
            bestResults.id
        ) {

            progressBar.style.width =
                "100%";

            status.textContent =
                "Scan complete.";

        } else {


            /* =============================================
               PASS 3
               TARGETED NUMERIC OCR

               IMPORTANT:
               This is NOT the old raw-color pass.

               It only focuses on the LRN + ID number
               area and cannot overwrite good values.
            ============================================= */

            status.textContent =
                "Checking LRN and ID number...";

            progressBar.style.width =
                "75%";


            const targeted =
                await performTargetedNumericOCR(
                    canvas
                );


            OCR_RESULTS.push(
                "[TARGETED NUMERIC OCR]\n" +
                targeted.text
            );


            /*
               Only fill missing values.

               A good LRN from Pass 1/2 is NEVER
               replaced by the targeted pass.
            */

            if (
                !isValidLRN(bestResults.lrn) &&
                isValidLRN(targeted.lrn)
            ) {

                bestResults.lrn =
                    targeted.lrn;

            }


            if (
                !bestResults.id &&
                targeted.id
            ) {

                bestResults.id =
                    targeted.id;

            }


            progressBar.style.width =
                "100%";

            status.textContent =
                "Scan complete.";

        }

    }


    /* =====================================================
       SHOW OCR DEBUG
    ===================================================== */

    rawOCR.textContent =
        OCR_RESULTS.join(
            "\n\n-----------------------------\n\n"
        );


    /* =====================================================
       DISPLAY RESULTS
    ===================================================== */

    nameField.value =
        bestResults.name || "";


    gradeField.value =
        bestResults.grade || "";


    sectionField.value =
        bestResults.section || "";


    lrnField.value =
        bestResults.lrn || "";


    idField.value =
        bestResults.id || "";


    /* =====================================================
       DATABASE
    ===================================================== */

    if (
        isValidLRN(bestResults.lrn)
    ) {

        databaseButton.disabled =
            false;


        /*
           Automatically check the database
           using the valid LRN.
        */

        await checkDatabase();

    } else {

        databaseButton.disabled =
            true;


        databaseStatus.textContent =
            "LRN not detected.";

        databaseDetails.textContent =
            "The scanner could not find a valid 12-digit LRN.";

    }

}


/* =========================================================
   TARGETED NUMERIC OCR
========================================================= */

async function performTargetedNumericOCR(
    fullCanvas
) {

    const result = {

        lrn: "",
        id: "",
        text: ""

    };


    const width =
        fullCanvas.width;

    const height =
        fullCanvas.height;


    /*
       The LRN and ID number are normally
       located in the middle portion of the card.

       We intentionally avoid the name/grade areas.
    */

    const sourceX =
        width * 0.04;

    const sourceY =
        height * 0.20;

    const sourceWidth =
        width * 0.92;

    const sourceHeight =
        height * 0.42;


    const targetCanvas =
        document.createElement("canvas");


    targetCanvas.width =
        Math.round(
            sourceWidth * 1.5
        );

    targetCanvas.height =
        Math.round(
            sourceHeight * 1.5
        );


    const ctx =
        targetCanvas.getContext("2d");


    ctx.imageSmoothingEnabled =
        true;

    ctx.imageSmoothingQuality =
        "high";


    ctx.drawImage(

        fullCanvas,

        sourceX,
        sourceY,
        sourceWidth,
        sourceHeight,

        0,
        0,
        targetCanvas.width,
        targetCanvas.height

    );


    /*
       Slightly stronger contrast for
       the numeric fallback only.
    */

    preprocessCanvas(
        targetCanvas,
        1.55
    );


    const OCR =
        await Tesseract.recognize(

            targetCanvas,

            "eng",

            {

                tessedit_pageseg_mode: 6,

                tessedit_char_whitelist:
                    "0123456789LRNIDNO.SHJ-"

            }

        );


    result.text =
        OCR.data.text;


    result.lrn =
        extractBestLRN(
            result.text
        );


    result.id =
        extractBestID(
            result.text
        );


    return result;

}


/* =========================================================
   OCR PARSER
========================================================= */

function parseOCR(text) {

    const result = {

        name: "",
        grade: "",
        section: "",
        lrn: "",
        id: ""

    };


    if (!text) {
        return result;
    }


    const lines =
        text
            .split(/\r?\n/)
            .map(line =>
                line.trim()
            )
            .filter(Boolean);


    /* =====================================================
       LRN
    ===================================================== */

    result.lrn =
        extractBestLRN(text);


    /* =====================================================
       ID NUMBER
    ===================================================== */

    result.id =
        extractBestID(text);


    /* =====================================================
       GRADE + SECTION
    ===================================================== */

    for (const line of lines) {

        const upper =
            line.toUpperCase();


        const gradeMatch =
            upper.match(
                /GRADE\s*[:\-]?\s*(\d{1,2})\s*[-–—]?\s*([A-Z0-9 ._-]+)?/
            );


        if (gradeMatch) {

            result.grade =
                gradeMatch[1];

            if (
                gradeMatch[2]
            ) {

                result.section =
                    cleanSection(
                        gradeMatch[2]
                    );

            }

            break;

        }

    }


    /* =====================================================
       SECTION FALLBACK
    ===================================================== */

    if (!result.section) {

        for (const line of lines) {

            const upper =
                line.toUpperCase();


            if (
                upper.includes("SECTION")
            ) {

                let section =
                    line
                        .replace(
                            /SECTION/ig,
                            ""
                        )
                        .replace(
                            /[:\-]/g,
                            " "
                        )
                        .trim();


                section =
                    cleanSection(
                        section
                    );


                if (section) {

                    result.section =
                        section;

                    break;

                }

            }

        }

    }


    /* =====================================================
       NAME
    ===================================================== */

    for (const line of lines) {

        const cleaned =
            line
                .replace(
                    /[^A-Za-zÀ-ÿ .'-]/g,
                    " "
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();


        const upper =
            cleaned.toUpperCase();


        if (!cleaned) {
            continue;
        }


        if (
            upper.includes("LRN") ||
            upper.includes("ID NO") ||
            upper.includes("IDNO") ||
            upper.includes("GRADE") ||
            upper.includes("SECTION")
        ) {

            continue;

        }


        const words =
            cleaned.split(" ");


        if (
            words.length >= 2 &&
            cleaned.length >= 5
        ) {

            result.name =
                cleaned;

            break;

        }

    }


    return result;

}


/* =========================================================
   LRN EXTRACTION
========================================================= */

function extractBestLRN(text) {

    if (!text) {
        return "";
    }


    /*
       First try normal 12-digit matches.
    */

    const directMatches =
        text.match(
            /\b\d{12}\b/g
        );


    if (
        directMatches &&
        directMatches.length
    ) {

        return directMatches[0];

    }


    /*
       Normalize common OCR mistakes.
    */

    let cleaned =
        text
            .replace(
                /O/gi,
                "0"
            )
            .replace(
                /Q/gi,
                "0"
            )
            .replace(
                /I/gi,
                "1"
            )
            .replace(
                /L/gi,
                "1"
            )
            .replace(
                /\|/g,
                "1"
            )
            .replace(
                /S/gi,
                "5"
            )
            .replace(
                /B/gi,
                "8"
            )
            .replace(
                /G/gi,
                "6"
            );


    const digitSequences =
        cleaned.match(
            /\d{8,14}/g
        );


    if (!digitSequences) {
        return "";
    }


    /*
       Prefer exactly 12 digits.
    */

    for (
        const sequence of digitSequences
    ) {

        if (
            sequence.length === 12
        ) {

            return sequence;

        }

    }


    /*
       If OCR joined/separated digits,
       try stripping everything except digits.
    */

    const digitOnly =
        cleaned.replace(
            /\D/g,
            ""
        );


    /*
       Search for any 12-digit window.
    */

    if (
        digitOnly.length >= 12
    ) {

        for (
            let i = 0;
            i <= digitOnly.length - 12;
            i++
        ) {

            const candidate =
                digitOnly.substring(
                    i,
                    i + 12
                );


            if (
                isValidLRN(candidate)
            ) {

                return candidate;

            }

        }

    }


    return "";

}


/* =========================================================
   ID NUMBER EXTRACTION
========================================================= */

function extractBestID(text) {

    if (!text) {
        return "";
    }


    /*
       Normal format:

       305015-410-SHS
    */

    const normal =
        text.match(
            /\b\d{3,8}-\d{2,5}-[A-Z]{2,6}\b/i
        );


    if (normal) {

        return normal[0]
            .toUpperCase();

    }


    /*
       OCR sometimes adds spaces.
    */

    const normalized =
        text
            .toUpperCase()
            .replace(
                /\s+/g,
                " "
            );


    const spaced =
        normalized.match(
            /\b\d{3,8}\s*-\s*\d{2,5}\s*-\s*[A-Z]{2,6}\b/
        );


    if (spaced) {

        return spaced[0]
            .replace(
                /\s+/g,
                ""
            );

    }


    /*
       Search for ID NO and inspect
       the following text.
    */

    const idMatch =
        normalized.match(
            /ID\s*(?:NO|NUMBER)?\.?\s*[:\-]?\s*([A-Z0-9\- ]{5,30})/
        );


    if (idMatch) {

        let value =
            idMatch[1]
                .trim()
                .replace(
                    /\s+/g,
                    ""
                );


        /*
           Avoid accidentally returning LRN.
        */

        if (
            value.length >= 5 &&
            !/^\d{12}$/.test(value)
        ) {

            return value;

        }

    }


    return "";

}


/* =========================================================
   MERGE OCR RESULTS
========================================================= */

function mergeOCRResults(
    current,
    incoming
) {

    if (
        !current.name &&
        incoming.name
    ) {

        current.name =
            incoming.name;

    }


    if (
        !current.grade &&
        incoming.grade
    ) {

        current.grade =
            incoming.grade;

    }


    if (
        !current.section &&
        incoming.section
    ) {

        current.section =
            incoming.section;

    }


    /*
       LRN is only accepted if it is
       exactly 12 digits.
    */

    if (
        !isValidLRN(current.lrn) &&
        isValidLRN(incoming.lrn)
    ) {

        current.lrn =
            incoming.lrn;

    }


    if (
        !current.id &&
        incoming.id
    ) {

        current.id =
            incoming.id;

    }


    return current;

}


/* =========================================================
   DIGIT CLEANING
========================================================= */

function cleanDigits(value) {

    if (!value) {
        return "";
    }


    return String(value)
        .replace(
            /O/gi,
            "0"
        )
        .replace(
            /Q/gi,
            "0"
        )
        .replace(
            /I/gi,
            "1"
        )
        .replace(
            /L/gi,
            "1"
        )
        .replace(
            /\|/g,
            "1"
        )
        .replace(
            /S/gi,
            "5"
        )
        .replace(
            /B/gi,
            "8"
        )
        .replace(
            /G/gi,
            "6"
        )
        .replace(
            /\D/g,
            ""
        );

}


/* =========================================================
   VALID LRN
========================================================= */

function isValidLRN(lrn) {

    return /^\d{12}$/.test(
        String(lrn || "").trim()
    );

}


/* =========================================================
   SECTION CLEANING
========================================================= */

function cleanSection(section) {

    if (!section) {
        return "";
    }


    return section
        .replace(
            /^[\s:.\-]+/,
            ""
        )
        .replace(
            /[\s]+/g,
            " "
        )
        .trim();

}


/* =========================================================
   DATABASE
========================================================= */

async function checkDatabase() {

    const lrn =
        lrnField.value.trim();


    if (
        !isValidLRN(lrn)
    ) {

        databaseStatus.textContent =
            "Invalid LRN.";

        databaseDetails.textContent =
            "A valid 12-digit LRN is required.";

        return;

    }


    databaseStatus.textContent =
        "Checking database...";


    databaseDetails.textContent =
        "";


    try {

        const response =
            await fetch(
                DATABASE_URL +
                "?lrn=" +
                encodeURIComponent(lrn)
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (
            data.status === "success" &&
            data.student
        ) {

            const student =
                data.student;


            /*
               Database information becomes
               authoritative.

               This is especially useful when
               OCR misses the name/section.
            */

            if (
                student.name
            ) {

                nameField.value =
                    student.name;

            }


            if (
                student.grade
            ) {

                gradeField.value =
                    student.grade;

            }


            if (
                student.section
            ) {

                sectionField.value =
                    student.section;

            }


            if (
                student.idNumber
            ) {

                idField.value =
                    student.idNumber;

            } else if (
                student.id
            ) {

                idField.value =
                    student.id;

            }


            databaseStatus.textContent =
                "✓ Student found in database.";


            databaseDetails.innerHTML =

                "<strong>NAME:</strong> " +
                escapeHTML(
                    student.name || ""
                ) +

                "<br><strong>LRN:</strong> " +
                escapeHTML(
                    student.lrn || lrn
                ) +

                "<br><strong>ID NUMBER:</strong> " +
                escapeHTML(
                    student.idNumber ||
                    student.id ||
                    ""
                ) +

                "<br><strong>GRADE:</strong> " +
                escapeHTML(
                    student.grade || ""
                ) +

                "<br><strong>SECTION:</strong> " +
                escapeHTML(
                    student.section || ""
                );


        } else {

            databaseStatus.textContent =
                "✗ Student not found.";

            databaseDetails.textContent =
                "No student with this LRN was found in the database.";

        }


    } catch (error) {

        console.error(error);


        databaseStatus.textContent =
            "Database connection failed.";

        databaseDetails.textContent =
            error.message;

    }

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value) {

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
