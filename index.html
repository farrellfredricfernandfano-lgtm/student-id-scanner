<script>


/* =========================================================
   ELEMENTS
========================================================= */

const video =

const canvas =

const lrnCanvas =

const scanButton =

    );

const stopButton =
    document.getElementById(

    );

const databaseButton =
    document.getElementById(
        "databaseButton"
    );

const status =
    document.getElementById(

    );

const progressBar =
    document.getElementById(

const nameField =

    );

    document.getElementById(
        "databaseResult"
    );

const databaseStatus =
    document.getElementById(
        "databaseStatus"
    );

const databaseDetails =
    document.getElementById(
        "databaseDetails"
    );

const rawOCR =
    document.getElementById(
        "rawOCR"
    );


/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */

const DATABASE_URL =
    "https://script.google.com/macros/s/AKfycby8SQH20dz2PK6Covm_GOy4sG1WigvDaxZr8a--gbrI_LBKE1KJoQO7AMzaKZR_3mQ/exec";


/* =========================================================
   CAMERA
========================================================= */

let cameraStream = null;


startButton.addEventListener(
    "click",
    startCamera
);


stopButton.addEventListener(
    "click",
    stopCamera
);


scanButton.addEventListener(
    "click",
    captureAndScan
);


databaseButton.addEventListener(
    "click",
    checkDatabase
);


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

    try {

        status.textContent =
            "Starting camera...";


        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio: false,

                    video: {

                        facingMode: {
                            ideal:
                                "environment"
                        },

                        width: {
                            ideal: 1920
                        },

                        height: {
                            ideal: 1080
                        },

                        frameRate: {
                            ideal: 30
                        }

                    }

                });


        video.srcObject =
            cameraStream;


        const track =
            cameraStream
                .getVideoTracks()[0];


        try {

            await track.applyConstraints({

                width: {
                    ideal: 1920
                },

                height: {
                    ideal: 1080
                },

                frameRate: {
                    ideal: 30
                }

            });

        }

        catch (constraintError) {

            console.log(
                "Could not apply extra camera constraints:",
                constraintError
            );

        }


        startButton.disabled =
            true;

        scanButton.disabled =
            false;

        stopButton.disabled =
            false;


        status.textContent =
            "Camera ready. Align the entire ID inside the green guide.";

    }

    catch (error) {

        console.error(
            "CAMERA ERROR:",
            error
        );

        status.textContent =
            "Could not access camera: " +
            error.message;

    }

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera() {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        cameraStream =
            null;

    }


    video.srcObject =
        null;


    startButton.disabled =
        false;

    scanButton.disabled =
        true;

    stopButton.disabled =
        true;


    status.textContent =
        "Camera stopped.";

}


/* =========================================================
   CAPTURE + SCAN
========================================================= */

async function captureAndScan() {

    if (!cameraStream) {

        alert(
            "Please start the camera first."
        );

        return;

    }


    scanButton.disabled =
        true;

    databaseButton.disabled =
        true;


    databaseResult.style.display =
        "none";


    progressBar.style.width =
        "0%";


    status.textContent =
        "Capturing ID...";


    try {

        await performOCR();

    }

    catch (error) {

        console.error(
            "SCAN ERROR:",
            error
        );

        status.textContent =
            "Scanning failed: " +
            error.message;

    }


    scanButton.disabled =
        false;

}


/* =========================================================
   IMAGE PREPROCESSING
========================================================= */

function preprocessCanvas(
    sourceCanvas,
    contrast = 1.35
) {

    const ctx =
        sourceCanvas.getContext(
            "2d",
            {
                willReadFrequently:
                    true
            }
        );


    const imageData =
        ctx.getImageData(
            0,
            0,
            sourceCanvas.width,
            sourceCanvas.height
        );


    const data =
        imageData.data;


    const factor =
        (
            259 *
            (contrast + 255)
        ) /
        (
            255 *
            (259 - contrast)
        );


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r =
            data[i];

        const g =
            data[i + 1];

        const b =
            data[i + 2];


        let gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;


        gray =
            factor *
            (gray - 128) +
            128;


        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );


        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );

}


/* =========================================================
   MAIN OCR
========================================================= */

async function performOCR() {

    status.textContent =
        "Preparing ID image...";


    const videoWidth =
        video.videoWidth;

    const videoHeight =
        video.videoHeight;


    if (
        !videoWidth ||
        !videoHeight
    ) {

        throw new Error(
            "Camera image is not ready."
        );

    }


    /* =====================================================
       NEW CROP RATIO
       1850 × 617
       ===================================================== */

    const targetWidth =
        1850;

    const targetHeight =
        617;

    const targetRatio =
        targetWidth /
        targetHeight;


    /*
     * Determine the largest centered
     * camera crop matching 1850:617.
     */

    let finalCropWidth;
    let finalCropHeight;


    if (
        videoWidth / videoHeight >
        targetRatio
    ) {

        /*
         * Camera is wider than target.
         */

        finalCropHeight =
            videoHeight * 0.92;

        finalCropWidth =
            finalCropHeight *
            targetRatio;

    }

    else {

        /*
         * Camera is narrower than target.
         */

        finalCropWidth =
            videoWidth * 0.92;

        finalCropHeight =
            finalCropWidth /
            targetRatio;

    }


    const cropX =
        (
            videoWidth -
            finalCropWidth
        ) / 2;


    const cropY =
        (
            videoHeight -
            finalCropHeight
        ) / 2;


    /* =====================================================
       EXACT 1850 × 617 OUTPUT
       ===================================================== */

    canvas.width =
        targetWidth;

    canvas.height =
        targetHeight;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.imageSmoothingEnabled =
        true;

    ctx.imageSmoothingQuality =
        "high";


    ctx.drawImage(

        video,

        cropX,
        cropY,

        finalCropWidth,
        finalCropHeight,

        0,
        0,

        targetWidth,
        targetHeight

    );


    status.textContent =
        "Enhancing image...";


    /*
     * Original preprocessing.
     */

    preprocessCanvas(
        canvas,
        1.35
    );


    /*
     * Display processed image.
     */

    processedImage.src =
        canvas.toDataURL(
            "image/png"
        );

    processedImage.style.display =
        "block";


    /* =====================================================
       OCR PASS 1
    ===================================================== */

    status.textContent =
        "Reading ID information...";


    const result1 =
        await Tesseract.recognize(

            canvas,

            "eng",

            {

                logger:
                    function(info) {

                        console.log(
                            "TESSERACT PASS 1:",
                            info
                        );


                        if (
                            info.progress !==
                            undefined
                        ) {

                            progressBar.style.width =
                                (
                                    info.progress *
                                    30
                                ) + "%";

                        }


                        if (
                            info.status
                        ) {

                            status.textContent =
                                info.status;

                        }

                    },

                tessedit_pageseg_mode:
                    6,

                preserve_interword_spaces:
                    1

            }

        );


    const textPass1 =
        result1.data.text;


    console.log(
        "OCR PASS 1:",
        textPass1
    );


    const pass1Results =
        parseOCR(
            textPass1
        );


    let bestResults = {

        name:
            pass1Results.name,

        grade:
            pass1Results.grade,

        section:
            pass1Results.section,

        lrn:
            pass1Results.lrn,

        id:
            pass1Results.id

    };


    /* =====================================================
       OCR PASS 2
       MILD SHARPEN
    ===================================================== */

    status.textContent =
        "Running second OCR pass...";


    const sharpenCanvas =
        document.createElement(
            "canvas"
        );


    sharpenCanvas.width =
        canvas.width;

    sharpenCanvas.height =
        canvas.height;


    const sharpenCtx =
        sharpenCanvas.getContext(
            "2d"
        );


    sharpenCtx.drawImage(
        canvas,
        0,
        0
    );


    const imageData =
        sharpenCtx.getImageData(
            0,
            0,
            sharpenCanvas.width,
            sharpenCanvas.height
        );


    const data =
        imageData.data;


    const original =
        new Uint8ClampedArray(
            data
        );


    const w =
        sharpenCanvas.width;

    const h =
        sharpenCanvas.height;


    for (
        let y = 1;
        y < h - 1;
        y++
    ) {

        for (
            let x = 1;
            x < w - 1;
            x++
        ) {

            const index =
                (
                    y * w + x
                ) * 4;


            for (
                let c = 0;
                c < 3;
                c++
            ) {

                const center =
                    original[
                        index + c
                    ];


                const top =
                    original[
                        index -
                        w * 4 +
                        c
                    ];


                const bottom =
                    original[
                        index +
                        w * 4 +
                        c
                    ];


                const left =
                    original[
                        index -
                        4 +
                        c
                    ];


                const right =
                    original[
                        index +
                        4 +
                        c
                    ];


                const sharpened =
                    (
                        5 * center -
                        top -
                        bottom -
                        left -
                        right
                    );


                data[
                    index + c
                ] =
                    Math.max(
                        0,
                        Math.min(
                            255,
                            sharpened
                        )
                    );

            }

        }

    }


    sharpenCtx.putImageData(
        imageData,
        0,
        0
    );


    const result2 =
        await Tesseract.recognize(

            sharpenCanvas,

            "eng",

            {

                logger:
                    function(info) {

                        console.log(
                            "TESSERACT PASS 2:",
                            info
                        );


                        if (
                            info.progress !==
                            undefined
                        ) {

                            progressBar.style.width =
                                (
                                    30 +
                                    info.progress *
                                    30
                                ) + "%";

                        }

                    },

                tessedit_pageseg_mode:
                    6,

                preserve_interword_spaces:
                    1

            }

        );


    const textPass2 =
        result2.data.text;


    console.log(
        "OCR PASS 2:",
        textPass2
    );


    const pass2Results =
        parseOCR(
            textPass2
        );


    bestResults =
        mergeOCRResults(
            bestResults,
            pass2Results
        );



/* =====================================================
   OCR PASS 3
   HIGH-RESOLUTION GRAYSCALE FALLBACK
   ===================================================== */

status.textContent =
    "Running final enhanced OCR pass...";


/*
 * IMPORTANT:
 *
 * Pass 3 no longer uses the raw color
 * camera image.
 *
 * Instead, it uses the SAME processed
 * 1850 × 617 crop that Pass 1 and Pass 2
 * already use.
 *
 * The image is enlarged before OCR so
 * small characters have more pixels.
 */

const enhancedCanvas =
    document.createElement(
        "canvas"
    );


const enhanceScale =
    1.5;


enhancedCanvas.width =
    Math.round(
        canvas.width *
        enhanceScale

    Math.round(
        canvas.height *

    enhancedCanvas.getContext(
        "2d",
        {
            willReadFrequently:

        }
    );


enhancedCtx.imageSmoothingEnabled =
    true;

/*
 * Copy the already processed

enhancedCtx.drawImage(

    canvas,

    0,
    0,

    canvas.width,
    canvas.height,

    0,
    0,

    enhancedCanvas.width,
    enhancedCanvas.height

/*
 * Apply stronger contrast to the
 * enlarged image.

preprocessCanvas(
    enhancedCanvas,
    1.55
);


/*

 *
 * PSM 11 is useful when the text is
 * separated into different regions.
 *
 * This can help when the ID contains:

 * NAME
 * LRN

 */

const result3 =
    await Tesseract.recognize(

console.log(

 */

bestResults =
    mergeOCRResults(

    }


    /* =====================================================
       FINAL RESULTS
    ===================================================== */

    nameField.value =
        bestResults.name;

    gradeField.value =
        bestResults.grade;

    sectionField.value =
        bestResults.section;

    lrnField.value =
        bestResults.lrn;

    idField.value =
        bestResults.id;


    progressBar.style.width =
        "100%";


    /* =====================================================
       DATABASE
    ===================================================== */

    if (
        isValidLRN(
            lrnField.value
        )
    ) {

        status.textContent =
            "OCR complete. Checking database...";


        await checkDatabase();

    }

    else {

        status.textContent =
            "OCR complete. LRN could not be confidently detected.";


        databaseButton.disabled =
            false;

    }

}


/* =========================================================
   TARGETED LRN OCR
========================================================= */

async function performTargetedLRNOCR(
    fullCanvas
) {

    const width =
        fullCanvas.width;

    const height =
        fullCanvas.height;


    /*
     * LRN area.
     *
     * This remains based on the
     * processed 1850 × 617 image.
     */

    const x =
        width * 0.05;


    const y =
        height * 0.25;


    const cropWidth =
        width * 0.90;


    const cropHeight =
        height * 0.18;


    const scale =
        3;


    lrnCanvas.width =
        Math.round(
            cropWidth *
            scale
        );


    lrnCanvas.height =
        Math.round(
            cropHeight *
            scale
        );


    const ctx =
        lrnCanvas.getContext(
            "2d"
        );


    ctx.imageSmoothingEnabled =
        true;

    ctx.imageSmoothingQuality =
        "high";


    ctx.drawImage(

        fullCanvas,

        x,
        y,

        cropWidth,
        cropHeight,

        0,
        0,

        lrnCanvas.width,
        lrnCanvas.height

    );


    preprocessCanvas(
        lrnCanvas,
        1.6
    );


    console.log(
        "Running targeted LRN OCR..."
    );


    const result =
        await Tesseract.recognize(

            lrnCanvas,

            "eng",

            {

                logger:
                    function(info) {

                        console.log(
                            "LRN OCR:",
                            info
                        );

                    },

                tessedit_pageseg_mode:
                    7,

                tessedit_char_whitelist:
                    "LRN:0123456789"

            }

        );


    const text =
        result.data.text;


    console.log(
        "TARGETED LRN RESULT:",
        text
    );


    return extractBestLRN(
        text
    );

}


/* =========================================================
   OCR PARSING
========================================================= */

function parseOCR(text) {

    const result = {

        name: "",
        grade: "",
        section: "",
        lrn: "",
        id: ""

    };


    const lines =
        String(text)
            .split(/\r?\n/)
            .map(
                line =>
                    line.trim()
            )
            .filter(
                line =>
                    line.length > 0
            );


    /* LRN */

    const lrn =
        extractBestLRN(
            text
        );


    if (
        isValidLRN(lrn)
    ) {

        result.lrn =
            lrn;

    }


    /* ID NUMBER */

    let idMatch =
        text.match(

            /ID\s*(?:NO|NUMBER)?\s*[:#.\-]?\s*([0-9]{3,})\s*[-–—]\s*([0-9]{2,})\s*[-–—]?\s*([A-Za-z]{0,5})/i

        );


    if (idMatch) {

        let id =
            idMatch[1] +
            "-" +
            idMatch[2];


        if (
            idMatch[3]
        ) {

            const suffix =
                idMatch[3]
                    .toUpperCase();


            if (
                suffix.length > 0
            ) {

                id +=
                    "-" +
                    suffix;

            }

        }


        result.id =
            id;

    }

    else {

        const fallbackID =
            text.match(

                /\b([0-9]{5,})\s*[-–—]\s*([0-9]{2,})\s*[-–—]?\s*(SHS|JHS)?\b/i

            );


        if (
            fallbackID
        ) {

            result.id =
                fallbackID[1] +
                "-" +
                fallbackID[2];


            if (
                fallbackID[3]
            ) {

                result.id +=
                    "-" +
                    fallbackID[3]
                        .toUpperCase();

            }

        }

    }


    /* GRADE + SECTION */

    let gradeMatch =
        text.match(

            /GRADE\s*(?:LEVEL)?\s*(7|8|9|10|11|12)\s*[-–—:]?\s*([A-Za-z0-9][A-Za-z0-9 .'-]*)/i

        );


    if (
        gradeMatch
    ) {

        result.grade =
            gradeMatch[1];


        result.section =
            cleanSection(
                gradeMatch[2]
            );

    }


    if (
        !result.grade
    ) {

        const fallbackGrade =
            text.match(

                /\b(?:G[A-Z]*R[A-Z]*D[A-Z]*E?)\s*[^0-9]{0,3}(7|8|9|10|11|12)\s*[-–—:]?\s*([A-Za-z0-9 .'-]+)/i

            );


        if (
            fallbackGrade
        ) {

            result.grade =
                fallbackGrade[1];


            result.section =
                cleanSection(
                    fallbackGrade[2]
                );

        }

    }


    /* NAME */

    for (
        const line of lines
    ) {

        const upper =
            line.toUpperCase();


        if (
            upper.includes("LRN") ||
            upper.includes("ID NO") ||
            upper.includes("ID NUMBER") ||
            upper.includes("GRADE") ||
            upper.includes("SECTION")
        ) {

            continue;

        }


        const cleaned =
            line

                .replace(
                    /[^A-Za-zÀ-ÿ.' -]/g,
                    ""
                )

                .replace(
                    /\s+/g,
                    " "
                )

                .trim();


        const words =
            cleaned
                .split(" ")
                .filter(
                    word =>
                        word.length > 0
                );


        if (
            words.length >= 2 &&
            cleaned.length >= 5
        ) {

            result.name =
                cleaned;

            break;

        }

    }


    console.log(
        "PARSED OCR PASS:",
        result
    );


    return result;

}


/* =========================================================
   MERGE OCR RESULTS
========================================================= */

function mergeOCRResults(
    bestResults,
    newResults
) {

    if (
        !bestResults.name &&
        newResults.name
    ) {

        bestResults.name =
            newResults.name;

    }


    if (
        !bestResults.grade &&
        newResults.grade
    ) {

        bestResults.grade =
            newResults.grade;

    }


    if (
        !bestResults.section &&
        newResults.section
    ) {

        bestResults.section =
            newResults.section;

    }


    if (
        !isValidLRN(
            bestResults.lrn
        ) &&
        isValidLRN(
            newResults.lrn
        )
    ) {

        bestResults.lrn =
            newResults.lrn;

    }


    if (
        !bestResults.id &&
        newResults.id
    ) {

        bestResults.id =
            newResults.id;

    }


    return bestResults;

}


/* =========================================================
   LRN EXTRACTION
========================================================= */

function extractBestLRN(text) {

    let match =
        text.match(

            /LRN\s*[:#=\-]?\s*([0-9OoQqIiLl|SsBbGg\s]{10,24})/i

        );


    if (
        match
    ) {

        const digits =
            cleanDigits(
                match[1]
            );


        if (
            isValidLRN(digits)
        ) {

            return digits;

        }

    }


    match =
        text.match(

            /\b[A-Z]{2,4}\s*[:#=\-]?\s*([0-9OoQqIiLl|SsBbGg\s]{10,24})\b/i

        );


    if (
        match
    ) {

        const digits =
            cleanDigits(
                match[1]
            );


        if (
            isValidLRN(digits)
        ) {

            return digits;

        }

    }


    const digitGroups =
        text.match(

            /[0-9OoQqIiLl|SsBbGg][0-9OoQqIiLl|SsBbGg\s]{10,24}/g

        );


    if (
        digitGroups
    ) {

        for (
            const group of digitGroups
        ) {

            const digits =
                cleanDigits(
                    group
                );


            if (
                isValidLRN(digits)
            ) {

                return digits;

            }

        }

    }


    return "";

}


/* =========================================================
   CLEAN LRN
========================================================= */

function cleanDigits(value) {

    return String(value)

        .replace(
            /[OoQq]/g,
            "0"
        )

        .replace(
            /[IiLl|]/g,
            "1"
        )

        .replace(
            /[Ss]/g,
            "5"
        )

        .replace(
            /[Bb]/g,
            "8"
        )

        .replace(
            /[Gg]/g,
            "6"
        )

        .replace(
            /[^0-9]/g,
            ""
        );

}


/* =========================================================
   LRN VALIDATION
========================================================= */

function isValidLRN(lrn) {

    return /^\d{12}$/.test(

        String(lrn).trim()

    );

}


/* =========================================================
   CLEAN SECTION
========================================================= */

function cleanSection(section) {

    return String(section)

        .replace(
            /\s+/g,
            " "
        )

        .replace(
            /^[\-–—:\s]+/,
            ""
        )

        .trim();

}


/* =========================================================
   DATABASE CHECK
========================================================= */

async function checkDatabase() {

    const lrn =
        lrnField.value.trim();


    if (
        !isValidLRN(lrn)
    ) {

        status.textContent =
            "No valid 12-digit LRN was detected.";


        databaseButton.disabled =
            false;


        return;

    }


    if (
        DATABASE_URL.includes(
            "PASTE_YOUR"
        )
    ) {

        alert(
            "Apps Script URL has not been entered."
        );


        databaseButton.disabled =
            false;


        return;

    }


    status.textContent =
        "Checking Google Sheets...";


    databaseButton.disabled =
        true;


    databaseResult.style.display =
        "none";


    try {

        const url =
            DATABASE_URL +
            "?lrn=" +
            encodeURIComponent(
                lrn
            );


        console.log(
            "DATABASE REQUEST:",
            url
        );


        const response =
            await fetch(
                url
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP error: " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "DATABASE RESULT:",
            result
        );


        if (
            result.match === true
        ) {

            databaseResult.style.display =
                "block";


            databaseResult.className =
                "database-result valid";


            databaseStatus.textContent =
                "🟢 VALID STUDENT";


            databaseDetails.innerHTML =

                "<strong>Name:</strong> " +
                escapeHTML(
                    result.student.name
                ) +

                "<br><br>" +

                "<strong>LRN:</strong> " +
                escapeHTML(
                    result.student.lrn
                ) +

                "<br><br>" +

                "<strong>ID Number:</strong> " +
                escapeHTML(
                    result.student.idNumber
                ) +

                "<br><br>" +

                "<strong>Grade:</strong> " +
                escapeHTML(
                    result.student.grade
                ) +

                "<br><br>" +

                "<strong>Section:</strong> " +
                escapeHTML(
                    result.student.section
                );


            status.textContent =
                "Student identified successfully.";

        }


        else {

            databaseResult.style.display =
                "block";


            databaseResult.className =
                "database-result invalid";


            databaseStatus.textContent =
                "🔴 STUDENT NOT FOUND";


            databaseDetails.innerHTML =

                "<strong>Scanned LRN:</strong> " +
                escapeHTML(
                    lrn
                ) +

                "<br><br>" +

                "This LRN was not found " +
                "in the student database.";


            status.textContent =
                "No matching student.";

        }

    }


    catch (error) {

        console.error(
            "DATABASE ERROR:",
            error
        );


        databaseResult.style.display =
            "block";


        databaseResult.className =
            "database-result invalid";


        databaseStatus.textContent =
            "⚠️ DATABASE CONNECTION FAILED";


        databaseDetails.innerHTML =

            "Could not connect to Google Apps Script." +

            "<br><br>" +

            "<small>" +

            escapeHTML(
                error.message
            ) +

            "</small>";


        status.textContent =
            "Database connection failed.";

    }


    finally {

        databaseButton.disabled =
            false;

    }

}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
